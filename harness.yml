# Project manifest. `./render` reads this and builds every model listed.
# Nothing here is WireViz syntax -- it is just which files make up which model.

common: models/kz305-common.yml     # shared part library, prepended to every source file

output_dir: out

models:
  # ---- the two whole-harness models --------------------------------------
  factory:
    # The as-built reference. Rendered WITHOUT a BOM (no `t`): it carries no
    # lengths by design, and WireViz has no "length unknown" state, so a BOM
    # would print 0 m and read as measured.
    output: kz305-factory
    formats: hps
    sources:
      - models/style.yml
      - models/factory/*.yml

  rebuild:
    # The harness actually being built, so the BOM matters -- `t` included.
    output: kz305-rebuild
    formats: hpst
    sources:
      - models/style.yml
      - models/kz305-rebuild.yml

  # ---- per-subsystem sheets ----------------------------------------------
  # One system per sheet, the way a factory manual splits them. This is what
  # makes a diagram readable; the layout engine settings only stop it being a
  # ribbon. Every sheet includes backbone.yml, which carries the power
  # distribution and grounds each system hangs off.
  # controls appears on several sheets because the switchgear operates those
  # systems -- a starting sheet without the start button is not a diagram of
  # anything. A factory manual shows the switch on the sheet too.
  # Sheets set strict: false. The unreferenced-component guard exists because
  # such a component vanishes from the BOM and never gets built -- but sheets
  # render no BOM (no `t`), and a view of one system is *supposed* to leave the
  # other systems' parts unconnected. The `factory` model above still enforces
  # it over the same files.
  sheet-starting:
    strict: false
    output: sheet-starting
    formats: hs
    sources: [models/style.yml, models/factory/backbone.yml, models/factory/controls.yml, models/factory/starting.yml]

  sheet-charging:
    strict: false
    output: sheet-charging
    formats: hs
    sources: [models/style.yml, models/factory/backbone.yml, models/factory/charging.yml]

  sheet-ignition:
    strict: false
    output: sheet-ignition
    formats: hs
    sources: [models/style.yml, models/factory/backbone.yml, models/factory/controls.yml, models/factory/ignition.yml]

  sheet-controls:
    strict: false
    output: sheet-controls
    formats: hs
    sources: [models/style.yml, models/factory/backbone.yml, models/factory/controls.yml]

  sheet-signals:
    strict: false
    output: sheet-signals
    formats: hs
    sources: [models/style.yml, models/factory/backbone.yml, models/factory/controls.yml, models/factory/signals.yml]

  sheet-brakes:
    strict: false
    output: sheet-brakes
    formats: hs
    sources: [models/style.yml, models/factory/backbone.yml, models/factory/brakes.yml]

  sheet-instruments:
    strict: false
    output: sheet-instruments
    formats: hs
    sources: [models/style.yml, models/factory/backbone.yml, models/factory/instruments.yml]
