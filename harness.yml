# Project manifest. `./render` reads this and builds every model listed.
# Nothing here is WireViz syntax -- it is just which files make up which model.

common: models/kz305-common.yml     # shared part library, prepended to every source file

output_dir: out

models:
  factory:
    # The as-built reference. Rendered WITHOUT a BOM (no `t`): it carries no
    # lengths by design, and WireViz has no "length unknown" state, so a BOM
    # would print 0 m and read as measured.
    #
    # models/factory/sheets.yml splits the drawing into one sheet per
    # subsystem (the fork's native `sheets:` feature). png/svg come out as
    # kz305-factory.<sheet>.<ext>; html is a single interactive page carrying
    # every sheet, with net tracing that follows a wire across sheet
    # boundaries. Connections that cross sheets end in a stub naming the
    # sheet they continue on, so each sheet still reads on its own -- the
    # start button appears on the starting sheet as a stub of the controls
    # sheet, the way a factory manual cross-references.
    #
    # This replaced the old sheet-* models, which re-rendered overlapping
    # file subsets with strict off. Native sheets keep strict on: the split
    # is a view of the one validated harness, so a component missing from
    # every connection set still fails the build.
    output: kz305-factory
    formats: hps
    sources:
      - models/style.yml
      - models/factory/*.yml

  rebuild:
    # The harness actually being built, so the BOM matters -- `t` included.
    output: kz305-rebuild
    formats: hpst
    sources:
      - models/style.yml
      - models/kz305-rebuild.yml
