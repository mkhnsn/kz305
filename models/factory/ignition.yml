# IGNITION — Coils, contact breakers and capacitors.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.

connectors:
  COIL_L:
    <<: *coil
    subtype: LEFT
  COIL_R:
    <<: *coil
    subtype: RIGHT
  PTS_L:
    <<: *points
    subtype: LEFT
  PTS_R:
    <<: *points
    subtype: RIGHT
  CAP_L:
    <<: *capacitor
    subtype: LEFT - one half of a single bracketed assembly
    notes: |-
      ** THE TWO CONDENSERS ARE ONE PART, NOT TWO ** [bench 4 Sep 2026]. A single bracket carrying two
      cans stacked axially, like batteries end to end, with a shared two-wire pigtail about 8 inches
      long that is clamped to the bracket halfway along its run. Drawn as two connectors because they
      are two electrically independent components; ONE line in any BOM.
      ⚠️ IT EARTHS THROUGH ITS MOUNTING TABS TO THE FRAME - not to the engine case, despite sitting on
      GND_ENG here. Two tabs, metal-to-metal. THE FRAME IS BEING POWDER COATED, which removes exactly
      that path, so this is another blocker-5 component: it needs masked mounting points or a ground
      wire it has never had. See the rebuild.
  CAP_R:
    <<: *capacitor
    subtype: RIGHT - the other half of the same assembly

cables:
  # --- coil feeds ------------------------------------------------
  W_COIL_L_FEED: {<<: *w16, colors: [YERD]}
  W_COIL_R_FEED: {<<: *w16, colors: [YERD]}
  # --- points -------------------------------------------------------
  W_PTS_L:
    <<: *w18
    colors: [YE]
    notes: Yellow serves LEFT [bench 15 Aug 2026, stamped plate], corroborated by the diagram at the coil block. ⚠️ YE also carries the alternator phases.
  W_PTS_R:
    <<: *w18
    colors: [BK]
    notes: Black serves RIGHT [bench 15 Aug 2026, stamped plate], corroborated by the diagram at the coil block. ⚠️ BK also serves the starter trigger and the grounds - this lead is NOT one.
  W_CAP_L: {<<: *w18, colors: [YE]}
  W_CAP_R:
    <<: *w18
    colors: [BU]
    notes: |-
      ** BLUE, NOT BLACK - CORRECTED 4 Sep 2026 with the part in hand. ** It was drawn BK by symmetry
      with W_PTS_R, the right points lead, on the assumption that a condenser lead matches the points
      lead it parallels. It does not: the assembly's pigtail is YELLOW and BLUE, both ending in male
      bullets.
      ⚠️ SO BLUE HAS A THIRD ROLE ON THIS BIKE - brake lamp feed, fused headlight supply, and this.
      The first two are measured open to each other; this one is a third net again. See the colour
      collision note in kz305-common.yml.

connections:
  # --- coil primaries to the points ---------------------------------
  - - COIL_L: [2]
    - W_PTS_L: [1]
    - PTS_L: [1]
  - - COIL_R: [2]
    - W_PTS_R: [1]
    - PTS_R: [1]
  - - PTS_L: [1]
    - W_CAP_L: [1]
    - CAP_L: [1]
  - - PTS_R: [1]
    - W_CAP_R: [1]
    - CAP_R: [1]
  # case grounds - no harness wire, drawn as arrows
  - - CAP_L: [2]
    - '-->'
    - GND_ENG: [1]
  - - CAP_R: [2]
    - '-->'
    - GND_ENG: [1]

  # --- kill switch output feeding both coils -------------------------
  - - SP_YR: [1]
    - W_COIL_L_FEED: [1]
    - COIL_L: [1]
  - - SP_YR: [1]
    - W_COIL_R_FEED: [1]
    - COIL_R: [1]
