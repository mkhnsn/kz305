# STARTING — Starter motor and trigger circuit.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.

connectors:
  SM:
    <<: *starter_motor

cables:
  # --- heavy starter path -------------------------------------------
  W_SOL_SM:   {<<: *w6, colors: [BK]}

  # --- starter trigger ----------------------------------------------
  W_START:
    <<: *w18
    colors: [BK]
    notes: Starter button output to relay COIL+. BK but NOT a ground - a black net of its own from the right-bar 4P to the starter-relay branch, open to the horn-button black [meter 28 Aug 2026]. Corroborated by a switch table from an unrelated source (Push = Y/R to BK).
  W_SOL_GND:
    <<: *w18
    colors: [BK]
    notes: |-
      ⛔ ** THIS WIRE MAY NOT EXIST. ** It was drawn on the claim that the relay's COIL- grounds
      directly, which is WITHDRAWN - the assembly is in hand and has exactly TWO small leads, both
      ending in BULLETS into the harness. No ring, no eyelet, nothing that lands on engine or frame
      [bench 2 Sep 2026]. See measurements/starter-relay.md.
      LEFT DRAWN rather than deleted because there is no positive account of what replaces it, and
      deleting it would assert the coil has no return, which is also false. The meter settles it.
      [OPEN]

connections:
  # --- heavy starter path -------------------------------------------
  - - SOL: [2]
    - W_SOL_SM: [1]
    - SM: [1]

  # --- starter trigger ----------------------------------------------
  - - RH_4P: [4]
    - W_START: [1]
    - SOL: [3]
  - - SOL: [4]
    - W_SOL_GND: [1]
    - GND_CHASSIS: [1]

  # --- starter motor case ground -------------------------------------
  - - SM: [1]
    - '-->'
    - GND_ENG: [1]
