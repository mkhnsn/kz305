# CONTROLS — Handlebar switchgear, including the mapped right-bar branch.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.

connectors:
  RH:
    <<: *rh_cluster
    pinlabels: [Br STOP IN, Y/R STOP OUT, Y/R BTN IN, BK BTN OUT]
    notes: Four leads leave the switch housing directly - no connector at the switch [bench 17 Aug 2026]. ⚠️ Contacts degraded - button 5 ohm, kill 3 ohm [meter 15 Aug 2026]; clean before reuse.
  SP_RH_YR:
    style: simple
    type: Splice
    subtype: 2 to 1, Y/R
    notes: The two Y/R leads from the switch housing join here and continue as a single Y/R to the 4P [bench 17 Aug 2026, re-checked 29 Aug]. Kill switch output and starter button input are the same net, and this is what carries the coil feed out of the branch.
  SP_RH_BR:
    style: simple
    type: Splice
    subtype: 1 to 3, Br
    notes: |-
      THE DISTRIBUTION POINT FOR SWITCHED-IGNITION POWER. Brown arrives from the bus on way 1 of the
      4P and leaves three ways - to the kill switch as Br, to the TAIL fuse as Br/W, and to the HEAD
      fuse as Bl/W. Four legs, mapped by unsleeving twice, the second time with the net map in hand
      [bench 17 and 29 Aug 2026].
      ** DESIGN FINDING: BOTH 10A FUSE FEEDS GO UP TO THE HANDLEBAR AND BACK. ** The fuse box's two
      10A circuits are not fed from the fuse box end at all. They are fed from this splice inside the
      right-hand switch pigtail, which is itself fed from the brown bus. That is why Br/W and Bl/W
      both run between the fuse box and the right-bar branch. The rebuild has no reason to reproduce
      the detour.
  RH_4P:
    type: Junction
    subtype: 4-pin connector, right bar
    pinlabels: [Br, Br/W, Y/R, BK]
    notes: |-
      Cavity order - mating face, keyway up, left to right, top row first - is Br, Br/W, Y/R, BK,
      exactly as drawn. Both halves read, mirror 4-of-4, every mated pair matching on colour. Male
      spades on the harness side, female on the subharness side. [bench 29 Aug 2026]
      THE WIRE COUNT CLOSES ON THE CONNECTOR: 4 ways here plus the Bl/W flying bullet is 5 conductors
      leaving the switchgear, from the switch's 4 leads through SP_RH_YR and SP_RH_BR [arith
      29 Aug 2026]. The splices are corroborated from outside the sleeve as well as by unsleeving.
      PHYSICAL: 4-way rectangular, the SMALLER of the two four-way series in this harness. B06.5 at
      the fuse box is the same series in the opposite gender. NOT the same part as the R/R's 4P.
      PART SELECTION: ⚠️ NOT REPRODUCED, AND THE SERIES NEVER HAS TO BE IDENTIFIED - #37, closed
      4 Sep 2026. This entry used to say the rebuild had to mate this pigtail in the male half of
      the same series, and carried an [OPEN] demanding the series and its dimensions. Both are
      RETIRED: the rebuild cuts the stock housing off the retained cluster pigtail and fits a new
      sealed 090 at each end, which is why docs/connector-order.md buys both halves of a 3-way.
      The physical description above stays as the factory record. See docs/verification-plan.md.
      ⚠️ THREE WAYS IN THE REBUILD AGAINST FOUR HERE. Br/W is dropped - the brake switches are fed
      from the PDM now - and Bl/W with it. That leaves the question of what happens to those two
      legs of SP_RH_BR, which are on the cluster side and survive the housing coming off; see the
      comment above RH in models/kz305-rebuild.yml.
  RH_BLW:
    type: Bullet connector
    subtype: Bl/W, right bar
    pinlabels: [Bl/W]
    notes: A feed OUT of the branch, into the HEAD fuse - Bl/W sits on SP_RH_BR together with the switched brown, so it carries bus power down to the fuse [bench 29 Aug 2026]. The harness half is B01.1, a male bullet; the subharness carries the female flying lead.
  SP_YR:
    style: simple
    type: Splice
    subtype: Y/R coil feed - and it is B03
    notes: |-
      The kill switch output feeds BOTH ignition coils and the starter button from this node. Killing
      the engine works by cutting coil power here.
      THIS NODE IS B03: a single Y/R off the trunk at 460mm from the datum, 140mm long, ending in a
      DOUBLE-FEMALE BULLET whose two slots fed one ignition coil each [photo 2 Sep 2026]. The harness
      contributes one wire; the two coil feeds were external male bullets, unplugged at teardown.
      Corroborated independently: B03 rings 0.2 ohm to B01, the right-bar junction, so its Y/R is the
      kill switch output [meter 28 Aug 2026].
      IT IS AN ACCESSIBLE BULLET NODE, NOT A HIDDEN SPLICE. That matters for the rebuild, which wants
      this point kept accessible as the plug-in for an EI module later - stock already made it so.

cables:
  W_RH_IN:
    <<: *w18
    colors: [BUWH]
    notes: Bl/W between the fuse box and the right-bar bullet, running DOWN to the HEAD fuse [bench 29 Aug 2026]. See RH_BLW.
  # --- kill switch output: coils AND starter button -----------------
  W_YR_OUT:
    <<: *w16
    colors: [YERD]
    notes: THE critical stock detail. Kill switch output. Feeds the coil splice and, internally to the cluster, the starter button. Cutting this is how the engine stop switch stops the engine.

  # --- right-bar branch internals, mapped by unsleeving --------------
  W_RH_BR_SW:  {<<: *w18, colors: [BN]}
  W_RH_BR:     {<<: *w18, colors: [BN]}
  W_RH_BRW:
    <<: *w18
    colors: [BNWH]
    notes: Br/W at this connector is continuous with the fuse box [meter 28 Aug 2026, switchgear unplugged], so this leg is an arrival rather than a departure - see W_BRW_HARNESS on the backbone sheet.
  W_BR_BUS:
    <<: *w16
    colors: [BN]
    notes: The right-bar brown leg, joining the Br trunk just aft of the bar drop. A TAP off the bus, not its source - the ignition switch's brown output is on this net at 0.0 ohm [meter 28 Aug 2026].
  W_RH_BLW:
    <<: *w18
    colors: [BUWH]
    notes: The Bl/W leg leaving on a bullet rather than the 4P, carrying bus power down to the HEAD fuse.
  W_RH_YR1:    {<<: *w18, colors: [YERD]}
  W_RH_YR2:    {<<: *w18, colors: [YERD]}
  W_RH_YR_OUT: {<<: *w18, colors: [YERD]}
  W_RH_BK:     {<<: *w18, colors: [BK]}

connections:
  # --- right-bar branch internals -----------------------------------
  - - RH_4P: [1]
    - W_RH_BR_SW: [1]
    - SP_RH_BR: [1]
  - - SP_RH_BR: [1]
    - W_RH_BR: [1]
    - RH: [1]
  - - SP_RH_BR: [1]
    - W_RH_BRW: [1]
    - RH_4P: [2]
  - - SP_RH_BR: [1]
    - W_RH_BLW: [1]
    - RH_BLW: [1]
  - - RH: [2]
    - W_RH_YR1: [1]
    - SP_RH_YR: [1]
  - - RH: [3]
    - W_RH_YR2: [1]
    - SP_RH_YR: [1]
  - - SP_RH_YR: [1]
    - W_RH_YR_OUT: [1]
    - RH_4P: [3]
  - - RH: [4]
    - W_RH_BK: [1]
    - RH_4P: [4]

  # --- kill switch out: coils and starter button --------------------
  - - RH_4P: [3]
    - W_YR_OUT: [1]
    - SP_YR: [1]

  # --- Bl/W: a feed out of the branch, into the HEAD fuse -------------
  - - FUSE_4P: [3]
    - W_RH_IN: [1]
    - RH_BLW: [1]

  # --- right-bar brown: a tap on the bus, not its source --------------
  - - RH_4P: [1]
    - W_BR_BUS: [1]
    - SP_BR: [1]
