# BRAKES — Tail lamp and brake switches.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.

connectors:
  TAIL:
    <<: *taillight
    notes: RED feeds the tail filament, BLUE the brake filament, BK/Y grounds [scan 17 Aug 2026]. No license lamp exists on the US/Canada diagram - the tail lamp lights the plate.
  FBRK:
    <<: *brake_switch
    subtype: front, at the lever perch
    pinlabels: [Br IN, Bl OUT]
    notes: |-
      NOT part of the right-bar switchgear branch - it has its own pair of bullets at the HEADLIGHT
      JUNCTION, B00.5 (plain Br, double-female) and B00.6 (Bl, male) [bench 2 Sep 2026].
      Fed plain Br from the brown bus, returning Bl into the brake net. B00.6 is Blue Net 1, 0.0 ohm
      to B04.2 [meter 28 Aug 2026]; B00.5's brown sleeves with it and both run to the lever perch
      [photo 2 Sep 2026].
  RBRK:
    <<: *brake_switch
    subtype: rear, frame mounted
    pinlabels: [Br IN, Bl OUT]
    notes: |-
      In parallel with the front switch - brown in, blue out, both returning into one net at B04.2.
      Its pigtail carries a brown and a blue, the same pair as the front [photo 2 Sep 2026].
      Its harness-side pair is B04.4 (Br, female bullet) and B04.2 (Bl). Both leave B04 at the same
      breakout and the same length, so they travel together, mirroring B00.5/B00.6 at the front
      [arith 2 Sep 2026]. B04 sits at 650mm along the trunk, which is the right footpeg.
      NOT OBSERVED MATED - one step short of the front switch's evidence.
  SP_BRAKE:
    style: simple
    type: Splice
    subtype: brake lamp feed - and it is B04.2
    notes: |-
      Two blue wires crimped into ONE bullet terminal - electrically a splice, mechanically a shared
      crimp [bench 28 Aug 2026]. The front switch's output arrives from B00.6, the rear switch's
      plugs into the bullet, and one blue leaves for the tail lamp at B10.4.
      Blue Net 1 throughout: 0.0 ohm to B00.6, 0.1 ohm to B10.4 [meter 28 Aug 2026].
  SP_R:
    style: simple
    type: Splice
    subtype: tail/city R net
    notes: |-
      The R output of the ignition switch feeds the tail filament. Live in ON and PARK [meter
      15 Aug 2026, from the switch table].
      ⚠️ THIS SPLICE HAS ONE CONSUMER AND MAY NOT BE A PHYSICAL NODE AT ALL - a degenerate splice is
      what a straight run looks like when the model was told there were two legs. Left drawn because
      the tail's park behaviour depends on this pin and step 3 may yet find a real junction here.
      Do not reproduce it in the rebuild without evidence. [OPEN]

cables:
  W_GND_TAIL:   {<<: *w18, colors: [BKYE]}
  # --- tail / brake --------------------------------------------------
  W_TAIL:
    <<: *w18
    colors: [RD]
    notes: |-
      Tail filament feed off the ignition switch R pin, which is fed from the TAIL fuse's output on
      R/Bl [meter 29 Aug 2026]. The chain is: switched brown bus, right-bar splice, Br/W, TAIL fuse,
      R/Bl, this switch pin, bridged to R in ON, tail lamp.
      NOTE PARK BYPASSES THE TAIL FUSE - W straight to R. That is a design property, not wear, so it
      is inherited by any rebuild that preserves park.
  W_TAIL_RUN:  {<<: *w18, colors: [RD]}
  W_BRAKE:     {<<: *w18, colors: [BU]}
  W_BRK_FEED_F:
    <<: *w18
    colors: [BN]
    notes: Plain Br from the brown bus - B00.5 is one of the nine points on that single net [bench 2 Sep 2026]. See FBRK.
  W_BRK_FEED_R:
    <<: *w18
    colors: [BN]
    notes: Plain Br, like the front, from B04.4 - a brown female bullet on the brown net at 0.7 ohm to B00.1 [meter 28 Aug 2026], its consumer identified from the switch pigtail [photo 2 Sep 2026].
  W_BRK_OUT_F:  {<<: *w18, colors: [BU]}
  W_BRK_OUT_R:  {<<: *w18, colors: [BU]}

connections:
  # --- tail and brake -----------------------------------------------
  - - IGN: [2]
    - W_TAIL: [1]
    - SP_R: [1]
  - - SP_R: [1]
    - W_TAIL_RUN: [1]
    - TAIL: [1]
  - - SP_BR: [1]
    - W_BRK_FEED_F: [1]
    - FBRK: [1]
  - - SP_BR: [1]
    - W_BRK_FEED_R: [1]
    - RBRK: [1]
  - - FBRK: [2]
    - W_BRK_OUT_F: [1]
    - SP_BRAKE: [1]
  - - RBRK: [2]
    - W_BRK_OUT_R: [1]
    - SP_BRAKE: [1]
  - - SP_BRAKE: [1]
    - W_BRAKE: [1]
    - TAIL: [2]

  # --- tail lamp ground ----------------------------------------------
  - - TAIL: [3]
    - W_GND_TAIL: [1]
    - GND_NETB: [1]
