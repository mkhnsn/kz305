# =====================================================================
# KZ305-B1 — FACTORY HARNESS, AS BUILT
#
# Reference model of the stock harness. This file describes what
# Kawasaki did, NOT what we are building. Do not "improve" anything
# here - corrections belong in kz305-rebuild.yml, so the diff between
# the two files stays an honest list of our modifications.
#
#   wireviz -f hps -p kz305-common.yml kz305-factory.yml
#
# NO LENGTHS, and no BOM. This is a reference drawing, not a cut list.
# WireViz defaults a missing length to 0, so a BOM here would print
# "0 m" for every wire and read as measured. Render with -f hps.
#
# Sources: the KZ305-A1/A2/B1/C1/D1 wiring diagram (1981 KZ305A
# supplement, printed p.255) at 600 dpi, in the repo as
# KZ305-B1-wiring-diagram-600dpi.png; bench and meter work 13 Aug -
# 2 Sep 2026; pre-teardown photographs.
#
# ---------------------------------------------------------------------
# HOW TO READ A NOTE IN THESE FILES
#
# Every claim carries ONE evidence tag naming how it was established:
#
#   [meter]   continuity or resistance, with the harness disconnected
#   [bench]   the part or the wire in hand, read directly
#   [photo]   the pre-teardown photographs
#   [arith]   deduced from a conductor, way or gender count
#   [scan]    read off the 600 dpi diagram or its printed tables
#   [OPEN]    not established - stated as a question, not a fact
#
# The tags are ranked by this project's own failure record, not by
# prior belief: the meter has never produced a withdrawn claim and the
# scan has produced twelve. See docs/overturned-claims.md, and treat
# anything tagged [scan] as provisional - especially a colour.
#
# These notes state what is CURRENTLY held true. They do not carry the
# history of how each claim got there; that is in
# archive/models-2026-09-02/ and in the git log.
# ---------------------------------------------------------------------
#
# ---------------------------------------------------------------------
# STANDING RULES, each earned by a specific error
#
#   1. THE BENCH OUTRANKS THE DOCUMENT. Where a reading and the diagram
#      disagree, the reading wins and the diagram is annotated.
#   2. BOTH HALVES OF EVERY MULTI-WAY CONNECTOR GET READ. An
#      unpopulated cavity is invisible from the harness side and will
#      silently invert a conclusion drawn from way count.
#   3. BASE COLOUR FIRST, ALWAYS. Br/W is not W/Br; Y/BK is not BK/Y.
#      Both members of each pair physically exist on this bike.
#   4. NEVER IDENTIFY A LEAD BY COLOUR ALONE. Four colours in this
#      harness carry more than one circuit - see kz305-common.yml.
#   5. A STOCK WAY COUNT IS NOT A CIRCUIT COUNT. Two ways in this
#      harness feed nothing at all.
#   6. WHERE THE BENCH CONTRADICTS THE DRAWING WITHOUT ESTABLISHING
#      WHAT REPLACES IT, THE DRAWING IS LEFT AS IT WAS and the note
#      says so. A reference drawing that guesses is worse than one
#      that says it does not know.
# ---------------------------------------------------------------------
#
# ---------------------------------------------------------------------
# IN-SLEEVE SPLICES WITH COLOUR CHANGES
#
# Every circuit here is drawn as a single wire end to end, which is how
# the diagram presents it. Wherever an in-sleeve splice exists that is
# not how the harness is built, so a cable's single colour here may be
# two colours on the bike, and a "wire" here may be a junction.
#
# The RIGHT-BAR branch is mapped and is drawn with its real splices
# (SP_RH_YR, SP_RH_BR) [bench]. The LEFT-BAR branch is unsleeved and
# contains no splices at all [bench]. The main trunk has NOT been
# unwrapped - two splices in it (SP_BRW, SP_NETA) are inferred from
# conductor counts and have never been seen.
#
# Do not treat these cable colours as a shopping list until steps 3-4
# of docs/harness-ringout-procedure.md are done.
#
# OPEN ITEMS are listed at the foot of signals.yml.
# =====================================================================
