# =====================================================================
# KZ305-B1 — FACTORY HARNESS, AS BUILT
#
# Reference model of the stock harness. This file describes what
# Kawasaki did, NOT what we are building. Do not "improve" anything
# here - corrections belong in kz305-rebuild.yml, so the diff between
# the two files stays an honest list of our modifications.
#
#   wireviz -f hps -p kz305-common.yml kz305-factory.yml
#
# Render with -f hps (no TSV). WireViz always defaults a missing length
# to 0, so a BOM for this file would report "0 m" for every wire. There
# is no BOM for a harness we are not building - that belongs to
# kz305-rebuild.yml.
#
# Source: KZ305-A1/A2/B1/C1/D1 wiring diagram, 1981 KZ305A supplement
# printed p.255, read at 600 dpi, plus bench work 13-15 Aug 2026.
#
# NO LENGTHS. This is a reference drawing, not a cut list. Inventing
# placeholder lengths for a harness we are not building would put fake
# numbers in the BOM.
#
# COVERAGE: full-vehicle as of 19 Aug 2026, off the 600 dpi scan -
# lighting, horn, instruments, brake switches, both 6P junctions and
# the fuse topology. Source scans live in the repo:
# KZ305-B1-wiring-diagram-600dpi.png.
#
# REVISED 28 Aug 2026 BY RING-OUT. The first pass with a meter across
# the whole harness, every pigtail disconnected, changed four things
# this drawing had asserted from the scan:
#
#   - THE FUSE CASCADE DOES NOT EXIST. The box has no internal bus and
#     no brown reaches it. Three independent holders, printed MAIN,
#     HEAD and TAIL. FUSE_A and SP_BLW are deleted.
#   - THERE ARE TWO GROUND NETS, not one, and only one of them reaches
#     the ring terminal. See GND_CHASSIS and GND_NETB.
#   - THE R/R OUTPUT is brown and lands on the switched brown bus, not
#     white to the solenoid - so charging current runs through the
#     ignition switch.
#     ** WITHDRAWN 29 Aug 2026. THIS WAS WRONG AND IS THE ONE ITEM ON
#     THIS LIST THAT DID NOT SURVIVE. ** It rested on the R/R 4P having
#     no spare pin. At the bench the R/R half of that connector is
#     populated on THREE cavities only - the brown cavity is EMPTY -
#     and the SH221-12's fourth lead leaves as a W/R male bullet to
#     B04.6, the only female W/R terminal in the harness. The R/R
#     output is W/R onto the main power net, which is what this
#     drawing said BEFORE the 28 Aug revision. The original reading
#     off the scan was right. Charging does NOT pass the ignition
#     switch. See RR, W_RR_OUT and SP_WR.
#     The brown at the R/R connector IS still on the switched bus -
#     that meter reading stands. What fell was the inference that the
#     R/R drives it.
#   - THE BROWN BUS is fed by the ignition switch directly, not
#     energised through the right-bar branch.
#
# METHOD NOTE, worth more than the correction itself: the 28 Aug error
# was not a bad measurement. Every reading behind it was correct. It
# was an argument from PIN COUNT - "four ways, four functions, no
# spare" - which is a statement about a drawing, not an observation of
# a harness. BOTH HALVES OF A CONNECTOR HAVE TO BE LOOKED AT. An
# unpopulated cavity is invisible from the harness side and will
# silently invert a conclusion.
#
# Where the bench contradicted the drawing without establishing what
# replaces it, the drawing is LEFT AS IT WAS with the conflict written
# into the notes - see MF/W_IGN_FEED and SP_RH_BR. A reference drawing
# that guesses is worse than one that says it does not know.
#
# Remaining unknowns are listed at the foot of signals.yml; all are
# bench items, none block the drawing.
#
# Anything marked TBD is unverified. The harness is on the bench; ring
# it out rather than trusting this drawing.
#
# !! IN-SLEEVE SPLICES WITH COLOUR CHANGES
#
# CONFIRMED 17 Aug 2026, in ONE place: inside the RIGHT-BAR switchgear
# branch, a wire changes colour at a splice within the sleeve. Not
# observed in the main trunk. Elsewhere is UNKNOWN, not clean - nobody
# has unwrapped the rest yet.
#
# Every circuit below is drawn as a single wire end to end, which is how
# the diagram presents it. Wherever an in-sleeve splice exists that is
# not how the harness is built, so:
#   - a cable's single colour here may be two colours on the bike
#   - a "wire" here may physically be a junction
#   - the rebuild BOM would be wrong about wire count and colour
#
# The right-bar branch is MAPPED as of 17 Aug 2026 and is drawn below
# with its real splices - SP_RH_YR and SP_RH_BR. The rest of the harness
# has not been unwrapped. Do not treat these cable colours
# as a shopping list until harness-ringout-procedure.md steps 3-4 are
# done.
# =====================================================================
