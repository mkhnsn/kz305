# LIGHTING — Headlight, dimmer, left cluster and horn.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.
#
# The dimmer is metered on the switch itself: Bl is the common, R/BK is
# HI, R/Y is LO. Its Bl common is fed from FUSE_HEAD - holder 2 of the
# fuse box, printed HEAD - and that leg is measured end to end.

connectors:
  LH:
    <<: *lh_cluster
    pinlabels: [R/BK HI, Bl COMMON, R/Y LO, G, O, Gy, BK HORN, CASE GND]
    notes: |-
      DIMMER: Bl common, 0.1 ohm to R/BK in HI and to R/Y in LO, R/BK to R/Y open in both [meter
      28 Aug 2026, cluster unplugged]. ⚠️ THE WIPER IS MAKE-BEFORE-BREAK - both beam outputs blip
      together while the switch moves. Turn switch - R is O to Gy, L is G to O.
      ⚠️ EIGHT WAYS IN THE REBUILD AGAINST THIS 6P's SIX. It is not a mismatch: the rebuild
      collapses all three of this cluster's stock terminations into ONE 8-way housing - the seven
      leads below plus a new earth lead. See LH in models/kz305-rebuild.yml, which carries the
      full 5 / 6 / 7 / 8 reconciliation.
      THE CLUSTER CARRIES SEVEN LEADS: five through the 6P, the blue on its own flying bullet
      (B02.2), and B02.1's plain BK spade. The 6P is 3 rows of 2 and carries, top row first, R/BK
      and Br, then Gy and R/Y, then Or and Gn - BROWN IS IN IT AND BLUE IS NOT [bench 29 Aug 2026].
      ⚠️ THE BROWN FEEDS NOTHING. Both halves read, mirror 5-of-6: the cluster half of the brown's
      cavity is EMPTY while every other pair matches on colour [bench 29 Aug 2026]. The harness
      carries a live switched-ignition wire to a way the left cluster does not populate. This is the
      SECOND such way on this harness - B04.3's brown at the R/R is the other. Hypothesis: the loom
      serves A1/A2/B1/C1/D1 and these ways are live on other variants. [OPEN]
      PIN 8 IS NOT A WIRE. The horn button grounds through the CLUSTER BODY - the pigtail was
      unsleeved and contains NO SPLICES, so its conductor count IS the cluster's lead count and
      nothing can be hiding [bench 29 Aug 2026]. Pin 8 is CASE GND, drawn with the mounting-ground
      marker rather than a cable.
      NEGATIVE RESULT WORTH KEEPING: no splices in this branch, against TWO in the right-bar branch.
      The bars are not symmetric, and the left one is as simple as it looks.
  HEAD:
    <<: *headlight
    notes: R/BK to HI, R/Y to LO, BK/Y ground [scan 19 Aug 2026]. Polarity matters for the LED rebuild - this drawing is the feed/ground reference.
  HORN:
    type: Horn
    subtype: 12V 2A
    pinlabels: [FEED, SW]
    notes: Br feed off the accessory bus; the button switches the GROUND side, which is the topology K_HORN in the rebuild assumes. 2A nominal - the relay case rests on the measured 3-5 ohm cluster contacts, not the load.
  SP_HI:
    style: simple
    type: Splice
    subtype: high-beam net
    notes: R/BK from the dimmer feeds the HI filament and the high-beam indicator from this net.

cables:
  # --- dimmer feed and beams -----------------------------------------
  W_DIM_FEED:
    <<: *w16
    colors: [BU]
    notes: The fused headlight supply, fuse box to the left-bar junction on the harness side, dimmer common on the switch side, each measured separately [meter 28 Aug 2026]. ⚠️ Blue is TWO nets in this harness - this one and the brake feed - and they are open to each other.
  W_HI:      {<<: *w18, colors: [RDBK]}
  W_HI_HEAD: {<<: *w18, colors: [RDBK]}
  W_LO:      {<<: *w18, colors: [RDYE]}
  W_GND_HEAD: {<<: *w18, colors: [BKYE]}

  # --- horn -----------------------------------------------------------
  W_HORN_FEED: {<<: *w18, colors: [BN]}
  W_HORN_SW:
    <<: *w18
    colors: [BK]
    notes: The horn button return is its own black net, left-bar junction to horn, open to the starter-trigger black [meter 28 Aug 2026]. Corroborated from an independent direction - a switch table transcribed weeks earlier from an unrelated source gives the horn button as BK to ground. Two of the four black roles the models warn about are separated by measurement.

connections:
  # --- headlight through the dimmer -----------------------------------
  - - FUSE_4P: [1]
    - W_DIM_FEED: [1]
    - LH: [2]
  - - LH: [1]
    - W_HI: [1]
    - SP_HI: [1]
  - - SP_HI: [1]
    - W_HI_HEAD: [1]
    - HEAD: [1]
  - - LH: [3]
    - W_LO: [1]
    - HEAD: [2]
  - - HEAD: [3]
    - W_GND_HEAD: [1]
    - GND_NETB: [1]

  # --- horn, ground-side switched --------------------------------------
  - - SP_BR: [1]
    - W_HORN_FEED: [1]
    - HORN: [1]
  - - HORN: [2]
    - W_HORN_SW: [1]
    - LH: [7]
  # The button's ground is the CLUSTER BODY, not a harness lead - see LH.
  - - LH: [8]
    - '-->'
    - GND_ENG: [1]
