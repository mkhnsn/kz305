# LIGHTING — Headlight, dimmer, left cluster and horn.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/kz305-factory.yml for the model-wide notes.
#
# TRANSCRIBED 19 Aug 2026 off the 600 dpi scan, and the dimmer is now
# METER-CONFIRMED on the switch itself, 28 Aug 2026, cluster unplugged:
# Bl is the common, R/BK is HI, R/Y is LO. Closes procedure item 5.6,
# open since 13 Aug. The scan and the meter agree.
#
# The Bl common is fed from FUSE_HEAD - holder 2 of the fuse box,
# printed HEAD - and that leg is measured end to end: fuse box to the
# left-bar junction on the harness side, and Bl as the dimmer common on
# the switch side, established independently the same day. The CASCADE
# the earlier note described (FUSE_HEAD fed off FUSE_A's Bl/W) does not
# exist - the box has no internal bus. See the backbone sheet.

connectors:
  LH:
    <<: *lh_cluster
    pinlabels: [R/BK HI, Bl COMMON, R/Y LO, G, O, Gy, BK HORN, HORN GND]
    notes: |-
      DIMMER CLOSED 28 Aug 2026 - metered on the unplugged cluster, Bl common (0.1 ohm to R/BK in HI,
      0.1 ohm to R/Y in LO, R/BK to R/Y open in both), confirming the 19 Aug printed table. The wiper
      is MAKE-BEFORE-BREAK - both beam outputs blip together while the switch moves. Turn switch - R
      is O to Gy, L is G to O. The horn BK and the button's ground-side lead run separately from the
      cluster 6P at the headstock.
      ** THE OVER-SUBSCRIBED WAY LIST IS RESOLVED, 29 Aug 2026, AND THIS NOTE HAD IT WRONG. ** It
      said the 6P carries G, O, Gy, Bl, R/BK, R/Y, and then could not find a way for the switched
      brown that the ring-out had reached this junction on. The 6P was read at the bench and carries
      R/BK, Br, Gy, R/Y, Or, Gn - BROWN IS IN IT AND BLUE IS NOT. Blue arrives on its own flying
      lead, B02.2, a female bullet alongside the connector. There was never a seventh conductor; Bl
      was assigned to the wrong one.
      Layout is 3 rows of 2. Ways, top row first, are R/BK and Br, then Gy and R/Y, then Or and Gn.
      ** WHAT THE BROWN FEEDS IS STILL OPEN. ** It occupies the position this note guessed was the
      horn button's ground side. That would mean there is no horn-ground wire and the button grounds
      through the cluster body - but it is inference from a way count, and an argument from way count
      is exactly what inverted the R/R conclusion on 28 Aug. Ring it out before drawing it.
      Pin 8's colour was guessed BK/W off a hatched swatch in the printed table. B02.1 is a plain BK
      spade ringing 0.1 ohm to the horn, so that guess looks wrong as well.
  HEAD:
    <<: *headlight
    notes: Feeds read off the scan 19 Aug 2026 - R/BK to HI, R/Y to LO, BK/Y ground. Polarity matters for the LED rebuild - this drawing is the feed/ground reference.
  HORN:
    type: Horn
    subtype: 12V 2A
    pinlabels: [FEED, SW]
    notes: Br feed off the accessory bus; the button switches the GROUND side, exactly the topology K_HORN in the rebuild assumes. 2A nominal - the relay case rests on the measured 3-5 ohm cluster contacts, not the load.
  SP_HI:
    style: simple
    type: Splice
    subtype: high-beam net
    notes: R/BK from the dimmer feeds the HI filament and the high-beam indicator from this net.

cables:
  # --- dimmer feed and beams -----------------------------------------
  W_DIM_FEED:
    <<: *w16
    colors: [BU]
    notes: CONFIRMED END TO END 28 Aug 2026. Blue is two nets in this harness - this one and the brake feed - and they are open to each other. This is the fused headlight supply, fuse box to the left-bar junction on the harness side, dimmer common on the switch side, each measured separately the same day. Repinned onto the fuse panel's identified Bl way.
  W_HI:      {<<: *w18, colors: [RDBK]}
  W_HI_HEAD: {<<: *w18, colors: [RDBK]}
  W_LO:      {<<: *w18, colors: [RDYE]}
  W_GND_HEAD: {<<: *w18, colors: [BKYE]}

  # --- horn -----------------------------------------------------------
  W_HORN_FEED: {<<: *w18, colors: [BN]}
  W_HORN_SW:
    <<: *w18
    colors: [BK]
    notes: CONFIRMED 28 Aug 2026 by continuity - the horn button return is its own black net, left-bar junction to horn, open to the starter-trigger black. Corroborated from two independent directions that were not used to steer each other - this ring-out, and a switch table transcribed weeks earlier from an unrelated source giving the horn button as BK to ground. Two of the four black roles the models warn about are now separated by measurement.
  W_HORN_GND:
    <<: *w18
    colors: [BKWH]
    notes: TBD COLOUR. The horn button's ground-side lead - the printed table shows a hatched swatch where the colour code should be, unreadable at 600 dpi. Drawn BK/W as the best guess. Identify on the bench before ordering wire.

connections:
  # --- headlight through the dimmer -----------------------------------
  - - FUSE_4P: [1]
    - W_DIM_FEED: [1]
    - LH: [2]
  - - LH: [1]
    - W_HI: [1]
    - SP_HI: [1]
  - - SP_HI: [1]
    - W_HI_HEAD: [1]
    - HEAD: [1]
  - - LH: [3]
    - W_LO: [1]
    - HEAD: [2]
  - - HEAD: [3]
    - W_GND_HEAD: [1]
    - GND_CHASSIS: [1]

  # --- horn, ground-side switched --------------------------------------
  - - SP_BR: [1]
    - W_HORN_FEED: [1]
    - HORN: [1]
  - - HORN: [2]
    - W_HORN_SW: [1]
    - LH: [7]
  - - LH: [8]
    - W_HORN_GND: [1]
    - GND_CHASSIS: [1]
