# INSTRUMENTS — Meter lamps, indicator pod, neutral switch, 6P junction.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.
#
# The pod's four lamps (right turn, high beam, neutral, left turn)
# share a common ground bus formed in the pod PIGTAIL; their feeds
# cross the instrument 6P. The two meter illumination lamps sit
# OUTSIDE the 6P span and route on their own bullets at B00.11.

connectors:
  NSW:
    <<: *neutral_switch
  IND_N:
    <<: *indicator
    subtype: neutral indicator, 12V 3.4W
  IND_HB:
    <<: *indicator
    subtype: high-beam indicator, 12V 3.4W
  LAMP_SPD:
    <<: *indicator
    subtype: speedometer light, 12V 3.4W
  LAMP_TAC:
    <<: *indicator
    subtype: tachometer light, 12V 3.4W
  SP_POD_GND:
    style: simple
    type: Splice
    subtype: 1 to 3, BK/Y - pod common ground bus
    notes: |-
      The BK/Y from cavity 6 splits into three BK/Y legs inside the pod PIGTAIL, not in the pod
      [bench 29 Aug 2026].
      THE COUNT CLOSES IT AT EXACTLY THREE. Six ways cross the 6P and EIGHT wires leave the pigtail
      into the pod. Five of the six ways are signal (Gn, Gy, Br, LG, R/BK), so 5 + 3 = 8. A four-way
      split would need nine wires and a two-way seven. [arith 29 Aug 2026]
      AND IT DETERMINES WHICH LAMPS. Three of the pod's four lamps ground locally - IND_L on Gn,
      IND_R on Gy, IND_HB on R/BK. IND_N does not need one: its return is the LG lead on cavity 4
      running to the neutral switch, which grounds through the engine case in neutral.
  INSTR_6P:
    <<: *junction6p
    subtype: 6P connector, instrument pod
    pinlabels: [Gn, Gy, Br, LG, R/BK, BK/Y]
    notes: |-
      The SECOND 6P on the bike - instrument pod side, distinct from the left-cluster 6P at the
      headstock. Layout is 3 rows of 2, mating face, keyway up, top row first. Harness side carries
      FEMALE terminals; the left-bar 6P is the same series in male, so both genders are in the
      harness. All six ways read [bench 29 Aug 2026]:
        1 Gn    left-turn indicator
        2 Gy    right-turn indicator
        3 Br    neutral indicator feed, off the switched bus
        4 LG    neutral SWITCH lead
        5 R/BK  high-beam indicator
        6 BK/Y  pod ground
      ⚠️ CAVITY 5 IS R/BK, RED base with a BLACK tracer - not plain R. That single tracer is the
      difference between the high-beam indicator feed and a meter lamp feed.
      CAVITY 6 is the pod's common ground bus, formed by SP_POD_GND in the pigtail, and its harness
      side is NET B - 0.1 ohm to B10.5 [meter 29 Aug 2026], not inferred from black base. The pod's
      lamps return on the net that earths outside the harness entirely.

cables:
  # --- meter illumination - switched Br/W off B00.11 -----------------
  W_MTR_SPD:
    <<: *w18
    colors: [BNWH]
    notes: |-
      The speedometer and tachometer each carry a two-wire pigtail, Br/W and BK/Y on male bullets,
      landing one per slot on B00.11's double-female - two lamps, two slots, matching colour,
      matching gender [photo 2 Sep 2026]. See BRW_HL.
      ** THESE LAMPS ARE SWITCHED. ** Br/W is switched power, so they light with the KEY and NOT in
      park. Their BK/Y grounds land on Net B, which is where the black half of each pigtail goes.
      ⚠️ THIS IS ONE OF THE FIVE PHOTO-ONLY CLOSURES. Nothing here has been metered - see the
      Session A block in docs/verification-plan.md.
  W_MTR_TAC: {<<: *w18, colors: [BNWH]}

  # --- pod indicator feeds crossing the 6P ---------------------------
  W_IND_HB:  {<<: *w18, colors: [RDBK]}
  W_IND_HB2: {<<: *w18, colors: [RDBK]}
  W_IND_N_FEED:
    <<: *w18
    colors: [BN]
    notes: The neutral indicator feed - Br off the accessory bus, crossing the instrument 6P on cavity 3 [scan 19 Aug 2026, corroborated bench 29 Aug].
  W_IND_N_FEED2: {<<: *w18, colors: [BN]}
  W_NSW:
    <<: *w18
    colors: [GN]
    notes: |-
      ⚠️ LIGHT GREEN. WireViz cannot render LG distinctly from G, so this is drawn GN - do NOT read it
      as plain green.
      The HARNESS-SIDE leg, 6P cavity 4 to the switch. B01.4 is the LG branch running 900 mm to the
      neutral switch [bench 29 Aug 2026]. The neutral circuit is complete end to end: switched brown
      feeds the lamp on cavity 3, and the lamp returns on cavity 4 to the switch, which grounds
      through the engine case when in neutral.
  W_NSW2:
    <<: *w18
    colors: [GN]
    notes: The pod-side leg of the light-green neutral-switch lead, pod lamp to the 6P. Same LG-drawn-as-GN caveat as W_NSW.

  # --- lamp grounds ---------------------------------------------------
  W_GND_SPD: {<<: *w18, colors: [BKYE]}
  W_GND_TAC: {<<: *w18, colors: [BKYE]}
  W_GND_HB:  {<<: *w18, colors: [BKYE]}
  W_POD_GND2:
    <<: *w18
    colors: [BKYE]
    notes: The pod-side leg - three lamp grounds onto one conductor at SP_POD_GND, out to cavity 6.
  W_POD_GND:
    <<: *w18
    colors: [BKYE]
    notes: |-
      The harness-side leg of the pod ground. IT IS NET B - 0.1 ohm from B00.1's BK/Y to B10.5
      [meter 29 Aug 2026]. Settled by meter rather than by colour, which matters: black base made
      Net B the obvious guess, and guesses off colour have been wrong repeatedly on this harness.
      NOT a blocker 2 case. The pod already HAS a ground wire in the harness; blocker 2 counts
      components with none, earthing through their own mounting hardware. The pod's return simply
      needs re-terminating on the new bus.

connections:
  # --- meter illumination off B00.11, switched -----------------------
  - - BRW_HL: [1]
    - W_MTR_SPD: [1]
    - LAMP_SPD: [1]
  - - BRW_HL: [1]
    - W_MTR_TAC: [1]
    - LAMP_TAC: [1]
  - - LAMP_SPD: [2]
    - W_GND_SPD: [1]
    - GND_NETB: [1]
  - - LAMP_TAC: [2]
    - W_GND_TAC: [1]
    - GND_NETB: [1]

  # --- high-beam indicator off the HI net -----------------------------
  - - SP_HI: [1]
    - W_IND_HB: [1]
    - INSTR_6P: [5]
  - - INSTR_6P: [5]
    - W_IND_HB2: [1]
    - IND_HB: [1]
  - - IND_HB: [2]
    - W_GND_HB: [1]
    - SP_POD_GND: [1]
  - - SP_POD_GND: [1]
    - W_POD_GND2: [1]
    - INSTR_6P: [6]
  - - INSTR_6P: [6]
    - W_POD_GND: [1]
    - GND_NETB: [1]

  # --- neutral indicator ----------------------------------------------
  - - SP_BR: [1]
    - W_IND_N_FEED: [1]
    - INSTR_6P: [3]
  - - INSTR_6P: [3]
    - W_IND_N_FEED2: [1]
    - IND_N: [1]
  - - IND_N: [2]
    - W_NSW2: [1]
    - INSTR_6P: [4]
  - - INSTR_6P: [4]
    - W_NSW: [1]
    - NSW: [1]
  - - NSW: [1]
    - '-->'
    - GND_ENG: [1]
