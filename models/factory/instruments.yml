# INSTRUMENTS — Meter lamps, indicator pod, neutral switch, 6P junction.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/kz305-factory.yml for the model-wide notes.
#
# Pod transcribed 19 Aug 2026 off the 600 dpi scan. The four pod lamps
# (right turn, high beam, neutral, left turn) share a common ground bus
# out of the pod; their feeds cross the instrument 6P connector.
# The meter illumination lamps (speedo, tacho) sit outside the 6P span
# and route on their own bullets.

connectors:
  NSW:
    <<: *neutral_switch
  IND_N:
    <<: *indicator
    subtype: neutral indicator, 12V 3.4W
  IND_HB:
    <<: *indicator
    subtype: high-beam indicator, 12V 3.4W
  LAMP_SPD:
    <<: *indicator
    subtype: speedometer light, 12V 3.4W
  LAMP_TAC:
    <<: *indicator
    subtype: tachometer light, 12V 3.4W
  SP_POD_GND:
    style: simple
    type: Splice
    subtype: 1 to 3, BK/Y - pod common ground bus
    notes: |-
      OBSERVED 29 Aug 2026, inside the pod pigtail's sleeve: the BK/Y from cavity 6 splits into
      three BK/Y legs. This is the "common ground bus out of the pod" this file's header has claimed
      since 19 Aug, now located - it is in the PIGTAIL, not in the pod.
      ** THE COUNT CLOSES IT AT EXACTLY THREE. ** Six ways cross the 6P and EIGHT wires leave the
      pigtail into the pod. Five of the six ways are signal (Gn, Gy, Br, LG, R/BK), so 5 + 3 = 8. A
      four-way split would need nine wires and a two-way seven. The bench read "at least three"; the
      arithmetic makes it three.
      ** AND IT DETERMINES WHICH LAMPS. ** Three of the pod's four lamps ground locally - IND_L on
      Gn, IND_R on Gy, IND_HB on R/BK. IND_N does NOT need one: its return is the LG lead on cavity 4
      running to the neutral switch, which grounds through the engine case in neutral. Four lamps,
      three grounds, and the arithmetic only works this way round.
      Same shape of argument as the right-bar 4P, where a conductor count corroborated two splices
      from outside the sleeve.
  INSTR_6P:
    <<: *junction6p
    subtype: 6P connector, instrument pod
    pinlabels: [Gn, Gy, Br, LG, R/BK, BK/Y]
    notes: |-
      The SECOND 6P on the bike - instrument pod side, distinct from the left-cluster 6P at the
      headstock. Four ways were read off the scan 19 Aug 2026 and three corroborated from the harness
      side on 28 Aug - the cluster sits on the green, grey and switched-brown nets, exactly as drawn.
      ** ALL SIX WAYS NOW READ, AND RENUMBERED TO PHYSICAL CAVITIES, 29 Aug 2026. ** Layout is 3 rows
      of 2, mating face, keyway up, top row first. Harness side carries FEMALE terminals; the series
      is the same as the left-bar 6P, which is male - both genders of this family are in the harness.
        1 Gn    left-turn indicator
        2 Gy    right-turn indicator
        3 Br    neutral indicator feed, off the switched bus
        4 LG    neutral SWITCH lead - see below
        5 R/BK  high-beam indicator
        6 BK/Y  pod ground - see below
      The way list was previously ordered off the printed table, which is not the connector's order,
      and its two TBD ways were guessed as "the meter lamp R and the pod ground". Half right: the pod
      ground is there, but the other is LG, and the meter lamps are NOT in this connector at all -
      they stay outside the 6P span on their own bullets, as this file's header says.
      ** COLOUR CORRECTION: cavity 5 is R/BK, not R. ** The 28 Aug harness-side record listed a plain
      "red" among these six. It is RED base with a BLACK tracer, re-read 29 Aug. That single letter
      is the difference between the high-beam indicator feed and a meter lamp feed, and it is exactly
      the base-colour hazard the project has now been bitten by three times.
      ** CAVITY 6 IS DRAWN ON THE POD SIDE ONLY. ** BK/Y is the pod's common ground bus; the splice
      that forms it was seen in the pigtail on 29 Aug and is drawn as SP_POD_GND. Its HARNESS-SIDE
      destination is still NOT measured, so nothing leaves this connector on cavity 6. Black base
      makes Net B the strong candidate, and GND_CHASSIS's own note says most of its inherited leads
      probably belong to Net B, but that is a colour argument and this project has been burned by
      those. Ring B00.1's BK/Y against Net B before drawing the other half.

cables:
  # --- meter illumination - tail/city net ----------------------------
  W_MTR_SPD:
    <<: *w18
    colors: [RD]
    notes: Reads R (solid) off the scan - meter lamps live with the tail, so they light in PARK too. The tach read is clean; the speedo read is partly obscured by a connector symbol. R vs Br is scan-marginal - confirm at the ring-out.
  W_MTR_TAC: {<<: *w18, colors: [RD]}

  # --- pod indicator feeds crossing the 6P ---------------------------
  W_IND_HB:  {<<: *w18, colors: [RDBK]}
  W_IND_HB2: {<<: *w18, colors: [RDBK]}
  W_IND_N_FEED:
    <<: *w18
    colors: [BN]
    notes: CONFIRMED 19 Aug 2026 off the 600 dpi scan - the neutral indicator feed is Br off the accessory bus, crossing the instrument 6P. Was previously an assumption.
  W_IND_N_FEED2: {<<: *w18, colors: [BN]}
  W_NSW:
    <<: *w18
    colors: [GN]
    notes: |-
      LIGHT GREEN. WireViz cannot render LG distinctly from G, so this is drawn GN - do NOT read it
      as plain green. CONFIRMED at the bench 29 Aug 2026 rather than assumed: LG is cavity 4 of the
      instrument 6P, and B01.4 is the LG branch running 900 mm to the neutral switch.
      This is the HARNESS-SIDE leg, 6P to the switch. ROUTE CORRECTED 29 Aug 2026 - it was drawn
      running from the pod straight to the switch without crossing the 6P, which the cavity map
      disproves. The neutral circuit is now complete end to end: switched brown feeds the lamp on
      cavity 3, and the lamp returns on cavity 4 to the switch, which grounds through the engine case
      when in neutral.
  W_NSW2:
    <<: *w18
    colors: [GN]
    notes: The pod-side leg of the light-green neutral-switch lead, pod lamp to the 6P. Same LG-drawn-as-GN caveat as W_NSW.

  # --- lamp grounds ---------------------------------------------------
  W_GND_SPD: {<<: *w18, colors: [BKYE]}
  W_GND_TAC: {<<: *w18, colors: [BKYE]}
  W_GND_HB:  {<<: *w18, colors: [BKYE]}
  W_POD_GND:
    <<: *w18
    colors: [BKYE]
    notes: |-
      The pod's combined ground leaving on cavity 6 of the instrument 6P - three lamp grounds onto
      one conductor at SP_POD_GND.
      ** ITS HARNESS-SIDE DESTINATION IS STILL NOT MEASURED, so it is drawn ending at the connector
      and no further. ** Black base makes Net B the strong candidate, and GND_CHASSIS's own note says
      most of its inherited leads probably belong to Net B - but that is a colour argument and colour
      has been wrong on this harness repeatedly. Ring B00.1's BK/Y against Net B (B00.2, B10.5,
      B04.3, B04.5). If it is Net B, this pod earths outside the harness through component mounting
      like the rest of that net, and the star ground gains another wire to account for.

connections:
  # --- meter illumination off the tail R net -------------------------
  - - SP_R: [1]
    - W_MTR_SPD: [1]
    - LAMP_SPD: [1]
  - - SP_R: [1]
    - W_MTR_TAC: [1]
    - LAMP_TAC: [1]
  - - LAMP_SPD: [2]
    - W_GND_SPD: [1]
    - GND_CHASSIS: [1]
  - - LAMP_TAC: [2]
    - W_GND_TAC: [1]
    - GND_CHASSIS: [1]

  # --- high-beam indicator off the HI net -----------------------------
  - - SP_HI: [1]
    - W_IND_HB: [1]
    - INSTR_6P: [5]
  - - INSTR_6P: [5]
    - W_IND_HB2: [1]
    - IND_HB: [1]
  - - IND_HB: [2]
    - W_GND_HB: [1]
    - SP_POD_GND: [1]
  - - SP_POD_GND: [1]
    - W_POD_GND: [1]
    - INSTR_6P: [6]

  # --- neutral indicator ----------------------------------------------
  - - SP_BR: [1]
    - W_IND_N_FEED: [1]
    - INSTR_6P: [3]
  - - INSTR_6P: [3]
    - W_IND_N_FEED2: [1]
    - IND_N: [1]
  - - IND_N: [2]
    - W_NSW2: [1]
    - INSTR_6P: [4]
  - - INSTR_6P: [4]
    - W_NSW: [1]
    - NSW: [1]
  - - NSW: [1]
    - '-->'
    - GND_ENG: [1]
