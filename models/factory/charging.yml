# CHARGING — Alternator and regulator/rectifier.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/kz305-factory.yml for the model-wide notes.
#
# CONNECTOR IDENTITY ESTABLISHED 28 Aug 2026. The yellow collision -
# alternator phases versus the left points lead - could not be settled
# by gauge, because both yellow candidates look like the rest of the
# harness on the bench. Continuity settled it: both wires of the trunk's
# yellow pair ring through to slots in one 4-pin connector and are not
# continuous with each other. So that pair is W_ALT and that 4P is the
# R/R connector. The left points and condenser leads are elsewhere and
# remain unlocated.

connectors:
  ALT:
    <<: *alternator
  RR:
    <<: *regrec
    pinlabels: [AC1, AC2, DC OUT, GND]
    notes: |-
      Shunt type - it dumps surplus as heat, so LED load reduction makes it run HOTTER. Check
      14.0-14.5V at 3-5k AND check body temperature. Never disconnect with the ignition on.
      PART IDENTIFIED 29 Aug 2026: SHINDENGEN SH221-12, named off the unit itself, and stock.
      CONNECTOR CONFIRMED 28 Aug 2026 by continuity from the alternator phase pair.
      ** THE "NO SPARE PIN" ARGUMENT IS WITHDRAWN 29 Aug 2026. ** It ran: single phase, four ways,
      therefore brown must be the DC output. The premise is false. The R/R half of the 4P is
      populated on THREE cavities only and the brown cavity is EMPTY, so there IS a spare way.
      The R/R carries FOUR leads - in physical order off the body, Y, BK, Y, W/R - and only three
      enter the housing. THE DC OUTPUT LEAVES ON A SEPARATE MALE BULLET, outside this connector.
      This connector's four ways, by harness cavity number (mating face, keyway up, left to right,
      top row first - see measurements/README):
        1  Br     harness wire present, R/R SIDE EMPTY. Dead at this connector.
        2  BK/Y   ground, Net B.
        3  Y      alternator phase, branch B05.1.1.
        4  Y      alternator phase, branch B05.1.2.
      Pin numbering below is by FUNCTION (component lead), not by cavity - DC OUT is lead 3 here and
      is not in the housing at all. Cavity order is the table above.
      OPEN, and not a fault: why a stock harness runs brown into a cavity the stock R/R never
      populates. Likely a housing shared across model variants, or a sense lead unused on this unit.
      SCOPE: not reused. An SH775 series regulator replaces it - see docs/part-selection.md.

cables:
  # --- charging -----------------------------------------------------
  W_ALT:
    <<: *w14
    colors: [YE, YE]
    notes: GAUGE NOT ESTABLISHED. At the bench 28 Aug 2026 both yellows looked like the harness's common size rather than heavier, which would make them 18 AWG - but no wire in this harness has had its gauge measured with a tool, and "the common size" is itself an unverified label. An eyeball comparison against an unverified reference is not a bench finding, so the modelled 14 AWG stands. Recheck during the gauge pass; if the yellows are 18 AWG this is wrong and gets corrected then.
  W_RR_OUT:
    <<: *w14
    colors: [WHRD]
    notes: |-
      RESTORED 29 Aug 2026 TO WHITE/RED AND THE MAIN POWER NET, which is what this model drew before
      28 Aug. The 28 Aug "correction" to brown, running to the switched-ignition bus, is WITHDRAWN on
      both counts. The original reading off the 600 dpi scan was right.
      WHY IT WAS WRONG: it rested on the R/R 4P having no spare pin, so brown had to be the DC
      output. At the bench 29 Aug the R/R half of that connector is populated on THREE cavities only
      - the brown cavity is EMPTY - and the SH221-12's fourth lead leaves the body as a W/R MALE
      BULLET, outside the housing.
      WHERE IT LANDS, established by ELIMINATION rather than by continuity: the harness contains
      exactly TWO W/R terminals, B04.6 (female) and B06.4 (male). A male bullet can only mate a
      female, so B04.6 is the only candidate that exists. B04.6 and the R/R's own 4P branch B04.3
      also break out at the same point (B04 + 200 mm), so the R/R's two connections leave the loom
      together - which closes the loophole that the lead might reach a child harness instead.
      Continuity could NOT have settled this: two unmated halves prove nothing and two mated halves
      prove only that they are touching. It rests on the branch tagging being complete. IF AN
      UNTAGGED W/R FEMALE BULLET IS EVER FOUND, THIS REOPENS.
      WHAT SURVIVES FROM 28 Aug: the brown at the R/R connector really is continuous 0.0 ohm with the
      switched-ignition net. That was a meter reading and it stands. What falls is the inference that
      the R/R drives it.
      DESIGN CONSEQUENCE WITHDRAWN: charging does NOT return through the ignition switch contacts.
      That claim drove a rebuild blocker and has been removed there too.
      GAUGE: 14 AWG is inherited, NOT measured - the harness-wide gauge caveat applies.
  W_RR_GND:
    <<: *w14
    colors: [BKYE]
    notes: MOVED TO NET B 28 Aug 2026, and it is the only ground lead in this model whose net is actually measured. Black base, BK/Y - it rings continuous with every other black-base point in the harness and OPEN to the chassis ring terminal. Colour corrected from plain BK at the same time.

connections:
  # --- charging ------------------------------------------------------
  - - ALT: [1,2]
    - W_ALT: [1,2]
    - RR: [1,2]
  - - RR: [3]
    - W_RR_OUT: [1]
    - SP_WR: [1]
  - - RR: [4]
    - W_RR_GND: [1]
    - GND_NETB: [1]
