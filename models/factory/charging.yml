# CHARGING — Alternator and regulator/rectifier.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.

connectors:
  ALT:
    <<: *alternator
  RR:
    <<: *regrec
    pinlabels: [AC1, AC2, DC OUT, GND]
    notes: |-
      Shunt type - it dumps surplus as heat, so LED load reduction makes it run HOTTER. Check
      14.0-14.5V at 3-5k AND check body temperature. Never disconnect with the ignition on.
      SHINDENGEN SH221-12, stock, named off the unit itself [bench 29 Aug 2026].
      The R/R carries FOUR leads - in physical order off the body, Y, BK, Y, W/R - and only three
      enter the 4P housing. THE DC OUTPUT LEAVES ON A SEPARATE MALE BULLET, outside this connector
      [bench 29 Aug 2026]. The connector was identified by continuity from the alternator phase pair
      [meter 28 Aug 2026].
      Four ways, by HARNESS cavity number (mating face, keyway up, left to right, top row first):
        1  Br     harness wire present, R/R SIDE EMPTY. Dead at this connector.
        2  BK/Y   ground, Net B.
        3  Y      alternator phase, branch B05.1.1.
        4  Y      alternator phase, branch B05.1.2.
      Pin numbering below is by FUNCTION (component lead), not by cavity - DC OUT is lead 3 here and
      is not in the housing at all.
      ⚠️ CAVITY 1 IS A LIVE HARNESS WIRE INTO AN EMPTY MATE. The brown is soundly on the switched bus
      at 0.0 ohm and the R/R end goes nowhere. One of two such ways on this bike - see LH. Hypothesis:
      the loom serves A1/A2/B1/C1/D1 and this way is live on another variant. [OPEN]
      SCOPE: not reused. An SH775 series regulator replaces it - see docs/part-selection.md.

cables:
  # --- charging -----------------------------------------------------
  W_ALT:
    <<: *w14
    colors: [YE, YE]
    notes: |-
      ⚠️ GAUGE NOT ESTABLISHED. Both yellows look like the harness's common size rather than heavier,
      which would make them 18 AWG - but no wire in this harness has had its gauge measured with a
      tool, and "the common size" is itself an unverified label. The modelled 14 AWG stands until the
      gauge pass. [OPEN]
  W_RR_OUT:
    <<: *w14
    colors: [WHRD]
    notes: |-
      The R/R's DC output - W/R, white base, onto the main power net [bench 29 Aug 2026].
      IT LANDS ON B04.6 BY ELIMINATION, not by continuity: the harness contains exactly TWO W/R
      terminals, B04.6 (female) and B06.4 (male), and a male bullet can only mate a female. B04.6
      and the R/R's own 4P branch B04.3 break out at the same point (B04 + 200 mm), so the R/R's two
      connections leave the loom together [arith 29 Aug 2026].
      ⚠️ IT RESTS ON THE BRANCH TAGGING BEING COMPLETE. Continuity could not settle this - two unmated
      halves prove nothing. IF AN UNTAGGED W/R FEMALE BULLET IS EVER FOUND, THIS REOPENS.
      CHARGING DOES NOT PASS THE IGNITION SWITCH. The brown at the R/R connector IS continuous with
      the switched bus [meter 28 Aug 2026], but the R/R does not drive it - that cavity is dead.
      GAUGE: 14 AWG is inherited, NOT measured. [OPEN]
  W_RR_GND:
    <<: *w14
    colors: [BKYE]
    notes: Net B - it rings continuous with every other black-base point in the harness and OPEN to the chassis ring terminal [meter 28 Aug 2026]. The only ground lead in this model whose net is actually measured.

connections:
  # --- charging ------------------------------------------------------
  - - ALT: [1,2]
    - W_ALT: [1,2]
    - RR: [1,2]
  - - RR: [3]
    - W_RR_OUT: [1]
    - SP_WR: [1]
  - - RR: [4]
    - W_RR_GND: [1]
    - GND_NETB: [1]
