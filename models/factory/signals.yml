# SIGNALS — Turn signals, flasher and indicators.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.
#
# The left cluster (LH) is defined on the lighting sheet now that the
# dimmer and horn are transcribed; the turn-switch circuits below reach
# it cross-sheet.

connectors:
  FLASHER:
    type: Turn signal relay
    subtype: 2-pin, thermal
    pinlabels: [Br IN, O OUT]
    notes: 2-pin - brown in, orange out, NO ground terminal [scan 17 Aug 2026]. This is why an electronic 3-pin flasher needs a wire the stock harness does not have; the rebuild runs a ground wire here regardless. Labelled "Turn Signal Light Relay" on the factory diagram and drawn REAR, beside the rear brake switch - the stock unit lives under the seat area, not at the headstock.
  SIG_FL: {<<: *signal_lamp, subtype: "front left, 12V 23W"}
  SIG_FR: {<<: *signal_lamp, subtype: "front right, 12V 23W"}
  SIG_RL: {<<: *signal_lamp, subtype: "rear left, 12V 23W"}
  SIG_RR: {<<: *signal_lamp, subtype: "rear right, 12V 23W"}
  IND_L: {<<: *indicator, subtype: "left turn indicator, 12V 3.4W"}
  IND_R: {<<: *indicator, subtype: "right turn indicator, 12V 3.4W"}
  SP_SIG_L:
    style: simple
    type: Splice
    subtype: left turn feed - and it is B00.10
    notes: |-
      A physical two-into-one crimp at the headlight junction, not a modelling convenience - the
      green net rings four points through it and the grey net mirrors it exactly [meter 28 Aug 2026].
      THIS NODE IS B00.10, and SP_SIG_R is B00.4. The front turn signals carry a two-wire pigtail - a
      coloured lead and a black - plugging in here [photo 2 Sep 2026], which is the front-signal half
      read directly rather than deduced from the conductor count.
  SP_SIG_R:
    style: simple
    type: Splice
    subtype: right turn feed - and it is B00.4
    notes: Mirrors SP_SIG_L. Green and grey came back structurally identical [meter 28 Aug 2026].

cables:
  # --- turn signals: O common from the flasher, G left / Gy right ----
  W_FLASH_IN:  {<<: *w18, colors: [BN]}
  W_FLASH_OUT: {<<: *w18, colors: [OG]}
  W_SIG_L:
    <<: *w18
    colors: [GN]
    notes: |-
      G feeds BOTH left lamps and the left indicator - the switch has only two signal outputs for
      four lamps. Four points on the net, matching this model, and its grey mirror is structurally
      identical - left-bar switch, then a two-into-one crimp at the headlight junction, then the
      instrument cluster and the tail [meter 28 Aug 2026].
  W_SIG_R:  {<<: *w18, colors: [GY]}
  W_SIG_FL: {<<: *w18, colors: [GN]}
  W_SIG_RL: {<<: *w18, colors: [GN]}
  W_SIG_FR: {<<: *w18, colors: [GY]}
  W_SIG_RR: {<<: *w18, colors: [GY]}
  W_IND_L:  {<<: *w18, colors: [GN]}
  W_IND_L2: {<<: *w18, colors: [GN]}
  W_IND_R:  {<<: *w18, colors: [GY]}
  W_IND_R2: {<<: *w18, colors: [GY]}

  # --- lamp grounds ---------------------------------------------------
  # ⚠️ DRAWN ON NET B BY COLOUR, NOT BY CONTINUITY. All six are BKYE,
  # which is Net B, and they land there - but no individual lead below
  # has been rung to it. The scan draws local ground symbols at the
  # front lamps and the headstock. Ring each before terminating it on
  # the rebuild's star bus. [OPEN]
  W_GND_SIG_FL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_FR: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RR: {<<: *w18, colors: [BKYE]}
  W_GND_IND_L:  {<<: *w18, colors: [BKYE]}
  W_GND_IND_R:  {<<: *w18, colors: [BKYE]}

connections:
  # --- turn signal circuit ------------------------------------------
  - - SP_BR: [1]
    - W_FLASH_IN: [1]
    - FLASHER: [1]
  - - FLASHER: [2]
    - W_FLASH_OUT: [1]
    - LH: [5]
  - - LH: [4]
    - W_SIG_L: [1]
    - SP_SIG_L: [1]
  - - LH: [6]
    - W_SIG_R: [1]
    - SP_SIG_R: [1]
  - - SP_SIG_L: [1]
    - W_SIG_FL: [1]
    - SIG_FL: [1]
  - - SP_SIG_L: [1]
    - W_SIG_RL: [1]
    - SIG_RL: [1]
  - - SP_SIG_R: [1]
    - W_SIG_FR: [1]
    - SIG_FR: [1]
  - - SP_SIG_R: [1]
    - W_SIG_RR: [1]
    - SIG_RR: [1]

  # --- pod indicators, through the instrument 6P ---------------------
  - - SP_SIG_L: [1]
    - W_IND_L: [1]
    - INSTR_6P: [1]
  - - INSTR_6P: [1]
    - W_IND_L2: [1]
    - IND_L: [1]
  - - SP_SIG_R: [1]
    - W_IND_R: [1]
    - INSTR_6P: [2]
  - - INSTR_6P: [2]
    - W_IND_R2: [1]
    - IND_R: [1]

  # --- lamp grounds - see the note above on which net ----------------
  - - SIG_FL: [2]
    - W_GND_SIG_FL: [1]
    - GND_NETB: [1]
  - - SIG_FR: [2]
    - W_GND_SIG_FR: [1]
    - GND_NETB: [1]
  - - SIG_RL: [2]
    - W_GND_SIG_RL: [1]
    - GND_NETB: [1]
  - - SIG_RR: [2]
    - W_GND_SIG_RR: [1]
    - GND_NETB: [1]
  # Both pod indicator grounds join the pod's own bus - see SP_POD_GND.
  - - IND_L: [2]
    - W_GND_IND_L: [1]
    - SP_POD_GND: [1]
  - - IND_R: [2]
    - W_GND_IND_R: [1]
    - SP_POD_GND: [1]


# =====================================================================
# OPEN ITEMS — the factory model's remaining unknowns
#
# Everything closed has been folded into the notes it belongs to. This
# is only what is still unresolved, with what would settle it.
# The full record of closed and withdrawn claims is in
# docs/overturned-claims.md and archive/models-2026-09-02/.
#
# NEEDS THE METER, harness still intact (verification session A):
#   - THE FIVE PHOTO-ONLY CLOSURES. B00.11's two meter lamps, the two
#     brake-switch feeds, and both front-signal pigtails rest on the
#     pre-teardown photographs alone. Nothing in that group has been
#     rung. `photo` has one recorded failure and no meter has ever
#     confirmed it. See docs/verification-plan.md.
#   - THE STARTER RELAY COIL. Which of its two leads is COIL-, and
#     where the return goes. "COIL- grounds directly" is withdrawn and
#     nothing has replaced it. W_SOL_GND is drawn but must not be
#     built. Y/R Net 2 is identified as the coil feed by gender
#     complement only.
#   - WHICH GROUND NET EACH LEAD IS ON. Only the R/R's ground is
#     measured. Every other BKYE lead is drawn on Net B by colour.
#     ⚠️ THE GROUND COUNT MUST BE SETTLED BEFORE THE FRAME IS COATED.
#   - THE HEADLIGHT'S GROUND. Drawn BK/Y, presumably onto B00.2, never
#     recorded as a mate.
#
# NEEDS THE UNWRAP (step 3, irreversible - run the meter items first):
#   - THE TWO HIDDEN SPLICES. SP_BRW (Br/W, three endpoints) and
#     SP_NETA (Y/BK, three endpoints) are inferred from conductor
#     arithmetic and have never been seen. Both are under the tape.
#   - B04 / B05 / B06 WIRE COUNTS. Not visible under the wrap.
#   - THE POINTS AND CONDENSER LEADS. Never located.
#   - B00.2's SPLICE COUNT. "Several splices downstream" was never a
#     number; two are now named (both meter lamp grounds), so it is at
#     least two.
#   - SP_R. It has one consumer and may not be a physical node at all.
#
# NEEDS CALIPERS:
#   - GAUGE, HARNESS-WIDE. Not one wire has had its gauge taken with a
#     tool. Every value in these models is inherited or eyeballed.
#   - THE RETAINED CONNECTOR SERIES. The right-bar 4P and both 6Ps are
#     reproduced by the rebuild and none is identified by part number
#     or measured.
#
# CANNOT BE VERIFIED - the evidence left the bike at teardown:
#   - W/BK, the second fuse box's other output. No recorded mate, and
#     the colour appears nowhere else in this project's map.
#   - THE BROWN AT THE LEFT-BAR 6P AND AT THE R/R. Both are live wires
#     into cavities their mates do not populate. The variant
#     hypothesis (this loom serves A1/A2/B1/C1/D1) explains both and
#     predicts more, which makes it testable against the remaining
#     connectors - but nothing on this bike can confirm it.
#   - THE THREE NEVER-CONNECTED ACCESSORY POINTS. B00.7, B08 and the
#     W/BK bullet. Provisioned and never used, so there is nothing to
#     find.
# =====================================================================
