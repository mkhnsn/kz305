# SIGNALS — Turn signals, flasher and indicators.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/kz305-factory.yml for the model-wide notes.
#
# The left cluster (LH) is defined on the lighting sheet now that the
# dimmer and horn are transcribed; the turn-switch circuits below reach
# it cross-sheet.

connectors:
  FLASHER:
    type: Turn signal relay
    subtype: 2-pin, thermal
    pinlabels: [Br IN, O OUT]
    notes: CONFIRMED 2-PIN off the diagram, 17 Aug 2026 - brown in, orange out, NO ground terminal. This is why an electronic 3-pin flasher needs a wire the stock harness does not have. The rebuild runs a ground wire here regardless, so a 3-pin electronic unit is fine - see docs/part-selection.md. Labelled "Turn Signal Light Relay" on the factory diagram and drawn REAR, beside the rear brake switch - the stock unit lives under the seat area, not at the headstock.
  SIG_FL: {<<: *signal_lamp, subtype: "front left, 12V 23W"}
  SIG_FR: {<<: *signal_lamp, subtype: "front right, 12V 23W"}
  SIG_RL: {<<: *signal_lamp, subtype: "rear left, 12V 23W"}
  SIG_RR: {<<: *signal_lamp, subtype: "rear right, 12V 23W"}
  IND_L: {<<: *indicator, subtype: "left turn indicator, 12V 3.4W"}
  IND_R: {<<: *indicator, subtype: "right turn indicator, 12V 3.4W"}
  SP_SIG_L:
    style: simple
    type: Splice
    subtype: left turn feed
    notes: CONFIRMED 28 Aug 2026 - a physical two-into-one crimp at the headlight junction, not a modelling convenience. The green net rings four points through it, and the grey net mirrors it exactly.
  SP_SIG_R:
    style: simple
    type: Splice
    subtype: right turn feed
    notes: CONFIRMED 28 Aug 2026 - mirrors SP_SIG_L. Green and grey came back structurally identical on the meter.

cables:
  # --- turn signals: O common from the flasher, G left / Gy right ----
  W_FLASH_IN:  {<<: *w18, colors: [BN]}
  W_FLASH_OUT: {<<: *w18, colors: [OG]}
  W_SIG_L:
    <<: *w18
    colors: [GN]
    notes: G feeds BOTH left lamps and the left indicator. Forced by wire count, not assumed - the switch has only two signal outputs for four lamps. CONFIRMED 28 Aug 2026 by ring-out, and so is its grey mirror - the green and grey nets are structurally identical, which is what a symmetric signal pair should be - left-bar switch, then a two-into-one crimp at the headlight junction, then the instrument cluster and the tail. Four points each, matching this model.
  W_SIG_R:  {<<: *w18, colors: [GY]}
  W_SIG_FL: {<<: *w18, colors: [GN]}
  W_SIG_RL: {<<: *w18, colors: [GN]}
  W_SIG_FR: {<<: *w18, colors: [GY]}
  W_SIG_RR: {<<: *w18, colors: [GY]}
  W_IND_L:  {<<: *w18, colors: [GN]}
  W_IND_L2: {<<: *w18, colors: [GN]}
  W_IND_R:  {<<: *w18, colors: [GY]}
  W_IND_R2: {<<: *w18, colors: [GY]}

  # --- lamp grounds - net NOT established -----------------------------
  # The scan draws local ground symbols at the front lamps and the
  # headstock. These are still drawn to GND_CHASSIS, but 28 Aug 2026
  # found TWO ground nets and only the small one reaches that ring, so
  # every lead below is on an unmeasured net - drawn by inheritance
  # from the diagram, not by continuity. Ring each before terminating
  # it on the rebuild's star bus; see GND_CHASSIS and GND_NETB.
  W_GND_SIG_FL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_FR: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RR: {<<: *w18, colors: [BKYE]}
  W_GND_IND_L:  {<<: *w18, colors: [BKYE]}
  W_GND_IND_R:  {<<: *w18, colors: [BKYE]}

connections:
  # --- turn signal circuit ------------------------------------------
  - - SP_BR: [1]
    - W_FLASH_IN: [1]
    - FLASHER: [1]
  - - FLASHER: [2]
    - W_FLASH_OUT: [1]
    - LH: [5]
  - - LH: [4]
    - W_SIG_L: [1]
    - SP_SIG_L: [1]
  - - LH: [6]
    - W_SIG_R: [1]
    - SP_SIG_R: [1]
  - - SP_SIG_L: [1]
    - W_SIG_FL: [1]
    - SIG_FL: [1]
  - - SP_SIG_L: [1]
    - W_SIG_RL: [1]
    - SIG_RL: [1]
  - - SP_SIG_R: [1]
    - W_SIG_FR: [1]
    - SIG_FR: [1]
  - - SP_SIG_R: [1]
    - W_SIG_RR: [1]
    - SIG_RR: [1]

  # --- pod indicators, through the instrument 6P ---------------------
  - - SP_SIG_L: [1]
    - W_IND_L: [1]
    - INSTR_6P: [4]
  - - INSTR_6P: [4]
    - W_IND_L2: [1]
    - IND_L: [1]
  - - SP_SIG_R: [1]
    - W_IND_R: [1]
    - INSTR_6P: [1]
  - - INSTR_6P: [1]
    - W_IND_R2: [1]
    - IND_R: [1]

  # --- lamp grounds - see the note above on which net ----------------
  - - SIG_FL: [2]
    - W_GND_SIG_FL: [1]
    - GND_CHASSIS: [1]
  - - SIG_FR: [2]
    - W_GND_SIG_FR: [1]
    - GND_CHASSIS: [1]
  - - SIG_RL: [2]
    - W_GND_SIG_RL: [1]
    - GND_CHASSIS: [1]
  - - SIG_RR: [2]
    - W_GND_SIG_RR: [1]
    - GND_CHASSIS: [1]
  - - IND_L: [2]
    - W_GND_IND_L: [1]
    - GND_CHASSIS: [1]
  - - IND_R: [2]
    - W_GND_IND_R: [1]
    - GND_CHASSIS: [1]

