# SIGNALS — Turn signals, flasher and indicators.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/kz305-factory.yml for the model-wide notes.
#
# The left cluster (LH) is defined on the lighting sheet now that the
# dimmer and horn are transcribed; the turn-switch circuits below reach
# it cross-sheet.

connectors:
  FLASHER:
    type: Turn signal relay
    subtype: 2-pin, thermal
    pinlabels: [Br IN, O OUT]
    notes: CONFIRMED 2-PIN off the diagram, 17 Aug 2026 - brown in, orange out, NO ground terminal. This is why an electronic 3-pin flasher needs a wire the stock harness does not have. The rebuild runs a ground wire here regardless, so a 3-pin electronic unit is fine - see docs/part-selection.md. Labelled "Turn Signal Light Relay" on the factory diagram and drawn REAR, beside the rear brake switch - the stock unit lives under the seat area, not at the headstock.
  SIG_FL: {<<: *signal_lamp, subtype: "front left, 12V 23W"}
  SIG_FR: {<<: *signal_lamp, subtype: "front right, 12V 23W"}
  SIG_RL: {<<: *signal_lamp, subtype: "rear left, 12V 23W"}
  SIG_RR: {<<: *signal_lamp, subtype: "rear right, 12V 23W"}
  IND_L: {<<: *indicator, subtype: "left turn indicator, 12V 3.4W"}
  IND_R: {<<: *indicator, subtype: "right turn indicator, 12V 3.4W"}
  SP_SIG_L:
    style: simple
    type: Splice
    subtype: left turn feed
    notes: CONFIRMED 28 Aug 2026 - a physical two-into-one crimp at the headlight junction, not a modelling convenience. The green net rings four points through it, and the grey net mirrors it exactly.
  SP_SIG_R:
    style: simple
    type: Splice
    subtype: right turn feed
    notes: CONFIRMED 28 Aug 2026 - mirrors SP_SIG_L. Green and grey came back structurally identical on the meter.

cables:
  # --- turn signals: O common from the flasher, G left / Gy right ----
  W_FLASH_IN:  {<<: *w18, colors: [BN]}
  W_FLASH_OUT: {<<: *w18, colors: [OG]}
  W_SIG_L:
    <<: *w18
    colors: [GN]
    notes: G feeds BOTH left lamps and the left indicator. Forced by wire count, not assumed - the switch has only two signal outputs for four lamps. CONFIRMED 28 Aug 2026 by ring-out, and so is its grey mirror - the green and grey nets are structurally identical, which is what a symmetric signal pair should be - left-bar switch, then a two-into-one crimp at the headlight junction, then the instrument cluster and the tail. Four points each, matching this model.
  W_SIG_R:  {<<: *w18, colors: [GY]}
  W_SIG_FL: {<<: *w18, colors: [GN]}
  W_SIG_RL: {<<: *w18, colors: [GN]}
  W_SIG_FR: {<<: *w18, colors: [GY]}
  W_SIG_RR: {<<: *w18, colors: [GY]}
  W_IND_L:  {<<: *w18, colors: [GN]}
  W_IND_L2: {<<: *w18, colors: [GN]}
  W_IND_R:  {<<: *w18, colors: [GY]}
  W_IND_R2: {<<: *w18, colors: [GY]}

  # --- lamp grounds - net NOT established -----------------------------
  # The scan draws local ground symbols at the front lamps and the
  # headstock. These are still drawn to GND_CHASSIS, but 28 Aug 2026
  # found TWO ground nets and only the small one reaches that ring, so
  # every lead below is on an unmeasured net - drawn by inheritance
  # from the diagram, not by continuity. Ring each before terminating
  # it on the rebuild's star bus; see GND_CHASSIS and GND_NETB.
  W_GND_SIG_FL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_FR: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RR: {<<: *w18, colors: [BKYE]}
  W_GND_IND_L:  {<<: *w18, colors: [BKYE]}
  W_GND_IND_R:  {<<: *w18, colors: [BKYE]}

connections:
  # --- turn signal circuit ------------------------------------------
  - - SP_BR: [1]
    - W_FLASH_IN: [1]
    - FLASHER: [1]
  - - FLASHER: [2]
    - W_FLASH_OUT: [1]
    - LH: [5]
  - - LH: [4]
    - W_SIG_L: [1]
    - SP_SIG_L: [1]
  - - LH: [6]
    - W_SIG_R: [1]
    - SP_SIG_R: [1]
  - - SP_SIG_L: [1]
    - W_SIG_FL: [1]
    - SIG_FL: [1]
  - - SP_SIG_L: [1]
    - W_SIG_RL: [1]
    - SIG_RL: [1]
  - - SP_SIG_R: [1]
    - W_SIG_FR: [1]
    - SIG_FR: [1]
  - - SP_SIG_R: [1]
    - W_SIG_RR: [1]
    - SIG_RR: [1]

  # --- pod indicators, through the instrument 6P ---------------------
  - - SP_SIG_L: [1]
    - W_IND_L: [1]
    - INSTR_6P: [4]
  - - INSTR_6P: [4]
    - W_IND_L2: [1]
    - IND_L: [1]
  - - SP_SIG_R: [1]
    - W_IND_R: [1]
    - INSTR_6P: [1]
  - - INSTR_6P: [1]
    - W_IND_R2: [1]
    - IND_R: [1]

  # --- lamp grounds - see the note above on which net ----------------
  - - SIG_FL: [2]
    - W_GND_SIG_FL: [1]
    - GND_CHASSIS: [1]
  - - SIG_FR: [2]
    - W_GND_SIG_FR: [1]
    - GND_CHASSIS: [1]
  - - SIG_RL: [2]
    - W_GND_SIG_RL: [1]
    - GND_CHASSIS: [1]
  - - SIG_RR: [2]
    - W_GND_SIG_RR: [1]
    - GND_CHASSIS: [1]
  - - IND_L: [2]
    - W_GND_IND_L: [1]
    - GND_CHASSIS: [1]
  - - IND_R: [2]
    - W_GND_IND_R: [1]
    - GND_CHASSIS: [1]

# =====================================================================
# STILL TO TRANSCRIBE / RESOLVE - the short list, revised 28 Aug 2026
#
# CLOSED by the ring-out and the fuse-box session:
#   - which physical holder is which. All three, off the box's own
#     printed labels, cross-checked against the harness net map.
#   - the dimmer common. Metered on the switch: Bl common, R/BK HI,
#     R/Y LO. (procedure 5.6, open since 13 Aug)
#   - the fourth fuse-panel conductor. It reads R/Bl, and the same
#     R/Bl appears at the ignition switch 4P.
#   - Y/BK versus BK/Y. Both wires exist; they are different nets.
#
# CLOSED 29 Aug 2026, by reading the R/R half of its connector:
#   - THE R/R OUTPUT, colour and route. It is W/R onto the main power
#     net, NOT brown onto the switched bus. The 28 Aug reading was
#     inverted by an argument from pin count; the R/R half of the 4P is
#     populated on three cavities only. This model is back to what it
#     drew before 28 Aug. See RR, W_RR_OUT, SP_WR.
#   - THE IGNITION-SWITCH CHARGING PATH. Withdrawn - it never existed.
#   - WHAT W/R IS. It was absent from the cable index because it was the
#     charging output, undrawn. Now W_RR_OUT plus W_MAIN_OUT.
#   - THE R/R PART. Shindengen SH221-12, stock. Its 4P cavity map is
#     recorded in measurements/connector-inventory.csv.
#
# CLOSED 29 Aug 2026, by unsleeving the right-bar pigtail a second time:
#   - SP_RH_BR IS AS MAPPED. Bl/W, Br and Br/W join and leave as one
#     brown. Four legs, exactly as drawn. SP_RH_YR confirmed with it,
#     and BK is continuous to the switches with no splice.
#   - HOLDER 3's ORIENTATION. Reading (b): Br/W in, R/Bl out. Forced,
#     not preferred - with the splice confirmed, reading (a) would feed
#     the TAIL fuse from a switch pin that ON connects to nothing but
#     its own pair, and the tail lamp could never light.
#   - WHERE THE IGNITION SWITCH'S TAIL1 PIN GETS ITS POWER. From that
#     fuse's output. Open since 19 Aug.
#   - WHAT FEEDS Bl/W, and which way it runs. The switched brown bus,
#     via SP_RH_BR, running DOWN from the handlebar into the HEAD fuse.
#   - Both 10A fuse feeds therefore leave the bus, go UP TO THE
#     HANDLEBAR, and come back down. That is the stock design and it is
#     why Br/W and Bl/W both run between the fuse box and the right-bar
#     branch - a pairing this model circled for weeks.
#   - WHICH YELLOW IS WHICH. Cavity 3 is branch B05.1.1, cavity 4 is
#     B05.1.2. The two AC legs are interchangeable into a single-phase
#     bridge, so this is completeness, not correctness - but it is
#     unrecoverable once the loom is cut.
#
# STILL OPEN, and the ring-out added to the list as well as subtracting:
#
#   - horn button ground-side colour: prints as a hatched swatch in the
#     switch table, unreadable. Drawn BK/W as a guess. (bench, #8)
#   - instrument 6P: two of six ways unread. (bench, #8)
#   - electric accessory leads: TWO pairs drawn (one at the meters, one
#     at the tail), colours too marginal to model - they read white-ish
#     with one possibly Bl at the front. Deliberately NOT modelled; an
#     unreferenced connector is dropped from the drawing, so declaring
#     them would imply coverage that does not exist. (bench, #8)
#   - meter lamp feed: reads R; R vs Br marginal at the speedo. (#8)
#
#   NEW 28 Aug 2026, all from the meter:
#   - A SECOND Y/R NET exists, on the fuse-box and starter-relay branch,
#     open to the modelled coil-feed Y/R. It is a circuit this model
#     does not carry AT ALL. Not drawn, because nothing yet says what it
#     is - find both its ends before inventing a cable for it.
#   - THE IGNITION FEED. The 20A fuse's output leg is W/R and the W/R
#     net never reaches the headlight junction, so the white drawn from
#     MF to the ignition switch is either the wrong colour or the wrong
#     route. See the MF notes.
#   - BROWN AT THE LEFT-BAR 6P - HALF CLOSED 29 Aug 2026. The way list
#     DOES have room: the 6P reads R/BK, Br, Gy, R/Y, Or, Gn, and the
#     blue this model put in it is actually a separate flying lead
#     (B02.2). So the count closes and there is no seventh conductor.
#     WHAT THE BROWN FEEDS IS STILL UNKNOWN. It sits where this model
#     guessed a horn ground, which would mean the button grounds
#     through the cluster body - but that is an argument from way
#     count, and one of those already inverted the R/R conclusion
#     once. Ring it out. (see LH)
#   - TWO UNMODELLED BROWN ENDPOINTS, one at the headlight junction and
#     one mid-harness, both on the switched bus.
#   - WHICH GROUND NET each modelled ground lead belongs to. Only one
#     (the R/R ground) is measured. See GND_CHASSIS and GND_NETB.
#   - A SPLICE UNDER THE TAPE on the Br/W net - three endpoints, and
#     the bullet at one of them holds a single wire. Step 3.
#
#   NEW 29 Aug 2026:
#   - W/Bl IS THE LAST WHOLLY UNMODELLED NET. White base, blue tracer,
#     two measured points 0.3 ohm apart - B00.8 at the headlight
#     junction and B09 at 1060 mm on the trunk. It appears NOWHERE in
#     these models and nowhere in the cable index. With W/R now
#     resolved as the charging output, this is the only net on the
#     bench map with no drawn counterpart at all. Find both ends.
#     Note it is NOT Bl/W - that is a different wire, already drawn as
#     W_FUSE_HEAD_IN. Base colour first; the two have been confused
#     before.
#   - THE BROWN WAY AT THE R/R CONNECTOR. The harness runs brown into
#     a cavity the stock R/R never populates. Not a fault, and not a
#     loose end in the harness - the brown is soundly on the switched
#     bus at 0.0 ohm. But the R/R end goes nowhere, so either the
#     housing is shared across model variants or the pin served a
#     function this unit does not use. Worth knowing before the
#     rebuild decides whether to carry the way forward at all.
#   - THE STARTER-RELAY LEG OF THE W/R NET. Seen mated at the bench on
#     28 Aug, running off the double-female bullet node, but WHICH
#     RELAY TERMINAL was not identified, so SP_WR draws two legs and
#     not three. One look at the relay closes it.
# =====================================================================
