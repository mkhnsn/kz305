# BACKBONE — Power distribution and grounds. Included by every sheet.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/factory/00-notes.yml for the model-wide notes.
#
# FUSE TOPOLOGY. Three independent holders, NO INTERNAL BUS - all six
# terminals traced individually and every one is open to the other five.
# Each carries its own printed circuit name [bench 28 Aug 2026]:
#
#     holder 1   20A  MAIN    W/R in (battery side)  ->  W out
#     holder 2   10A  HEAD    Bl/W in                ->  Bl out
#     holder 3   10A  TAIL    Br/W in                ->  R/Bl out
#
# Every one of those six wires was identified from the harness side by
# continuity BEFORE the printed labels were read, and no label
# contradicts one. NO BROWN REACHES THE BOX.
#
# The two 10A holders are NOT fed at the fuse box - both take their
# supply from SP_RH_BR, inside the right-bar switch pigtail. See the
# controls sheet.
#
# GROUNDS. There are TWO ground nets, not one, and only the small one
# reaches the ring terminal. See GND_CHASSIS and GND_NETB.

connectors:
  BATT:
    <<: *battery
  GND_CHASSIS:
    type: Chassis ground
    subtype: single Y/BK ring terminal — ground Net A
    pinlabels: [RING]
    notes: |-
      The ring terminal is Y/BK - YELLOW base with a black tracer - and 16-18 AWG, not the 6 AWG the
      model once assumed. The battery earth strap is separate hardware and is NOT part of this loom.
      [bench 28 Aug 2026]
      NET A IS SMALL AND CARRIES NO LOAD. Reference lead on this ring, all pigtails off: only two
      other harness points ring to it, B00.7 and B08 [meter 28 Aug 2026], and BOTH were never
      connected to anything [photo + bench 29 Aug 2026]. Every BK/Y point measures OPEN to it.
      So this is the PROVISIONED, UNUSED accessory earth. It powers nothing and never did.
      ⚠️ ONLY W_BAT_GND AND W_SOL_GND LAND HERE, and both are exceptions with their own notes. Every
      BKYE lead in this model belongs on GND_NETB - a BKYE cable landing here would contradict its
      own colour, which is a defect the guards now catch.
  GND_NETB:
    type: Distributed earth
    subtype: BK/Y harness return net — ground Net B
    pinlabels: [NET]
    notes: |-
      A SINGLE harness-wide return net - every black-base point rings continuous with every other,
      0.0-0.3 ohm from the tail to the R/R to the headlight junction - and it is OPEN TO THE CHASSIS
      RING ENTIRELY. [meter 28 Aug 2026]
      It does not return through the main harness at all. It reaches earth through the CHILD
      HARNESSES, at whatever each component is bolted to: some engine block, some frame, some
      elsewhere. That is why every point on it reads open with the harness on the bench - its returns
      are all outside the thing being measured. The harness has ONE ring terminal and MANY earth
      points.
      SCOPE CONSEQUENCE FOR THE REBUILD: every component earthing through its own mounting hardware
      needs a NEW ground wire back to the star bus - wire that does not exist in this harness and
      appears nowhere in these models. ⚠️ THE COUNT IS NOT YET KNOWN. Each has to be traced through
      its own child harness. See blocker 2 in the rebuild. [OPEN]
  GND_ENG:
    type: Engine case ground
    subtype: internal, no harness wire
    pinlabels: [CASE]
    notes: |-
      Components that ground through their own MOUNTING rather than a harness lead - starter motor,
      points, capacitors, neutral switch, and the LEFT-BAR CLUSTER, whose horn button grounds through
      the cluster body, bar to frame [bench 29 Aug 2026].
      The node means "grounds through its own mounting"; the name says engine case, which is
      narrower than the node is. Net B earths this way too, but through child-harness pigtails rather
      than at the component body - see GND_NETB.
      REBUILD: every one of these is a component that gets a NEW wire back to the star bus. See
      blocker 2.
  MF:
    <<: *main_fuse
    subtype: 20A glass — fuse box holder 1, printed MAIN
    pinlabels: [W, W/R]
    notes: |-
      Holder 1 of the original three-holder glass box, printed MAIN [bench 28 Aug 2026].
      ORIENTATION: W/R IN from the battery, WHITE OUT to the ignition switch. Settled from the two
      ends rather than from the box, which has no bus and cannot tell you its own orientation:
      B00.3's white rings 0.1 ohm to B06.3, which mates the pigtail white on this holder's W
      terminal, so W is the LOAD side [meter 29 Aug 2026]. B06.4's node carries W/R to the starter
      relay's battery stud, so W/R is the BATTERY side.
      ** WHAT THE 20A MAIN ACTUALLY PROTECTS: ** the ignition switch and everything downstream of it
      - the brown bus, both 10A fuses, and their loads. It does NOT protect the charging path or the
      starter relay, which sit on the battery side with it. A design property to decide about rather
      than reproduce unexamined.
      ** DESIGN FINDING: the melted, corroded bullet is on this holder's W/R INPUT leg ** - the
      battery side, where the charging current joins as well. The highest-current joint on the bike,
      failing where conductor size steps. See SP_WR for the mechanism.
  FUSE_HEAD:
    <<: *fuse10
    subtype: 10A glass — fuse box holder 2, printed HEAD
    pinlabels: [Bl/W IN, Bl OUT]
    notes: |-
      Holder 2, printed HEAD. Bl/W IN, Bl OUT [bench 28 Aug 2026]. Bl is the dimmer's supply - metered
      on the switch, Bl common, R/BK HI, R/Y LO - so it must sit downstream of its own fuse.
      Corroborated independently from the harness side: Blue Net 2 runs from this box to the left-bar
      junction [meter 28 Aug 2026].
      Bl/W is fed from the switched brown bus by way of SP_RH_BR, so its supply goes UP TO THE
      HANDLEBAR AND BACK [bench 29 Aug 2026]. So does the TAIL fuse's.
      DESIGN CONSEQUENCE: headlight current is fused, then run up to the handlebar and switched
      there, so the full lamp load passes through the bar-switch contacts. That is the standard case
      for a headlight relay, and it rests on the harness rather than on assumption.
  FUSE_TAIL:
    <<: *fuse10
    subtype: 10A glass — fuse box holder 3, printed TAIL
    pinlabels: [Br/W IN, R/Bl OUT]
    notes: |-
      Holder 3, printed TAIL. Br/W IN, R/Bl OUT [bench 28 Aug 2026 for the terminals; orientation
      arith 29 Aug 2026].
      The box cannot answer the orientation - no bus, nothing inside distinguishing input from
      output - so it was settled from the two ends, and the alternative is not merely less likely but
      IMPOSSIBLE. R/Bl in from the ignition switch would feed this fuse from a pin that ON connects
      to nothing but its own pair, and the tail lamp could never light. The metered switch table has
      ON connecting R/BK to R and nothing else to either.
      THE CIRCUIT CLOSES END TO END: ignition switch Br, switched brown bus, up to the right bar,
      SP_RH_BR, back down as Br/W, THIS FUSE, R/Bl, switch TAIL1, bridged to R in ON, tail lamp.
      PARK corroborates it independently - W straight to R feeds the lamp end directly, so R is the
      lamp end and R/Bl is the feed end.
      Measured: B00.3's R/Bl rings 0.2 ohm to B06.5 cavity 4 [meter 29 Aug 2026].
  FUSE_4P:
    type: Junction
    subtype: 4-pin connector, fuse panel
    pinlabels: [Bl, Br/W, Bl/W, R/Bl]
    notes: |-
      The fuse box joins the harness on a fixed pigtail - the 20A main's two wires leave on bullets
      (B06.3, B06.4) and the four 10A conductors come through this connector. All four are named from
      the box's own terminals [bench 28 Aug 2026].
      ⚠️ PIN NUMBERS ARE THE HARNESS-SIDE PHYSICAL CAVITIES, matching
      measurements/connector-inventory.csv, so there is only one numbering in the project. Cavity
      numbering is mating face, KEYWAY UP, left to right, top row first [bench 29 Aug 2026]:
        1  Bl     fused headlight supply, holder 2 HEAD out
        2  Br/W   holder 3 TAIL in, and the leg of the Br/W net that reaches SP_BRW
        3  Bl/W   holder 2 HEAD in
        4  R/Bl   holder 3 TAIL out
      The housing's moulded marks - a '4' and a flower logo - read UPSIDE DOWN in that orientation
      and are mould marks, not cavity numbers and not an orientation reference.
      Both halves read, mirror 4-of-4: all four cavities populated on each side, every mated pair
      matching on colour. Male spades on the fuse-box pigtail, female terminals in the harness. No
      dead way here. [bench 29 Aug 2026]
      ⚠️ A DIFFERENT, SMALLER CONNECTOR THAN THE R/R's 4P - same way count, unrelated part, different
      mould marks. Its depth and terminal width are NOT measured, and the R/R connector's must not be
      borrowed for it.
      SCOPE: the rebuild replaces this box and its pigtail with a blade block, so these wires are the
      baseline for laying that block out, not a set to reproduce.
  IGN:
    <<: *ign_switch
  SOL:
    <<: *starter_relay
  SP_BRW:
    style: simple
    type: Splice
    subtype: Br/W junction - location unknown
    notes: |-
      Br/W rings continuous across THREE endpoints - the fuse-box pigtail, the right-bar 4P and
      BRW_HL at the headlight junction - with the right-bar 4P disconnected [meter 28 Aug 2026].
      BRW_HL holds ONE wire, and one wire cannot reach three endpoints, so something joins these runs
      UNDER THE TAPE [arith 28 Aug 2026].
      ⚠️ INFERRED, NEVER SEEN. The three-way net is measured; its POSITION on the trunk is not, so do
      not read the placement here as a location. Step 3 unwraps the loom and should find it - that is
      the whole reason the procedure unwraps before ringing out rather than after. [OPEN]
  BRW_HL:
    type: Junction
    subtype: double-female bullet - branch B00.11, both slots empty
    pinlabels: [Br/W]
    notes: |-
      BOTH SLOTS FED A METER LAMP. The speedometer and tachometer each carry a two-wire pigtail -
      Br/W and BK/Y on male bullets - two lamps, two slots, matching colour, matching gender [photo
      2 Sep 2026]. Their BK/Y grounds land on the B00.2 collection.
      CONSEQUENCE: THE METER LAMPS ARE ON Br/W, WHICH IS SWITCHED. They light with the KEY and NOT in
      park. See W_MTR_SPD.
      ⚠️ THE SLOTS ARE EMPTY ON THE BENCH - whatever plugged in came off at teardown, before this
      project's tagging existed. This closure rests on the photographs alone; nothing here has been
      metered. See the Session A block in docs/verification-plan.md.
  SP_WR:
    style: simple
    type: Splice
    subtype: W/R main power net - bullet node on the starter relay assembly
    notes: |-
      The main power path, and it has an identified source: the regulator/rectifier's DC output.
      Three things sit on it -
        - MF holder 1's W/R terminal (the 20A MAIN's battery side), via the fuse-box pigtail;
        - the R/R's DC output, arriving on a male bullet at B04.6 (see W_RR_OUT);
        - a W/R leg to the STARTER RELAY'S BATTERY STUD.
      Two-point W/R net measured B04.6 to B06.4 at 0.1 ohm [meter 28 Aug 2026].
      ** THE NODE IS NOT IN THE HARNESS. ** It is a double-female bullet on the STARTER RELAY
      ASSEMBLY [bench 2 Sep 2026]; the harness side of B06.4 is a plain single male bullet. The loom
      contributes one wire. So this node is inherited only if the rebuild chooses to build one - and
      the rebuild does not.
      ** DESIGN: THE MELTED, CORRODED JOINT IS HERE, and the mechanism is located. ** The gauge step
      sits at this double-female, where a larger W/R meets a smaller one, on the highest-current
      circuit on the bike, TWO CONNECTIONS FROM THE BATTERY POST. The joint disappears with the
      assembly; the TOPOLOGY is what must not be reproduced - charging output, main-fuse feed and
      starter-relay feed all meeting at one bullet junction with a conductor-size step in it.
  FUSE_AUX:
    type: Fuse box
    subtype: SECOND box, 2 fuses - factory part, relocated
    pinlabels: [R/W IN, W/Bl OUT, W/BK OUT]
    notes: |-
      A FACTORY part, just not where the bike carries it now [bench 29 Aug 2026]. A single large R/W
      feeds in on a MALE bullet and splits to both fuses. One fuse comes out as W/Bl on a single
      FEMALE bullet showing evidence of having been mated - to B09, the rear accessory feed. The
      other comes out as W/BK on a double-female bullet that is oxidised and looks unused.
      ⚠️ R/W IS RED BASE, AND IT IS NOT W/R. The main power path is W/R, WHITE base. Both wires exist
      on this bike - see the reversed-pairs warning in kz305-common.yml.
      ** ITS FEED IS PERMANENTLY LIVE. ** The R/W inbound bullet mates a jumper whose ring bolts to
      the STARTER RELAY'S BATTERY STUD, under the boot - so this box is hot whenever the battery is,
      and the run is unfused for those two inches [bench 2 Sep 2026]. The diagram's "switched" call
      for the accessory leads is wrong.
      NOT DRAWN INTO THE CIRCUIT: only the W/Bl output has a known destination. W/BK has no recorded
      mate at all, and W/BK is a colour that appears NOWHERE else in this project's map. [OPEN]
  SP_NETA:
    style: simple
    type: Splice
    subtype: Y/BK - ground Net A, location unknown
    notes: |-
      Net A has THREE endpoints - the B04.1 chassis ring, B00.7 and B08 - and each holds exactly ONE
      wire, so something joins them under the tape [arith 29 Aug 2026]. Same argument that located
      SP_BRW.
      ⚠️ INFERRED, NEVER SEEN. The three-way net is measured; its POSITION is not. Step 3 should find
      it. [OPEN]
  ACC_F:
    type: Junction
    subtype: double-female bullet - branch B00.7, front accessory earth
    pinlabels: [Y/BK]
    notes: |-
      One harness wire in the crimp, TWO receptacle slots, BOTH EMPTY - and NOTHING EVER PLUGGED IN.
      The pre-teardown photographs show it unmated [photo 29 Aug 2026], and the oxidation inside the
      slots matches the outside, which is independent evidence: a mated slot ages differently from an
      open one [bench 29 Aug 2026].
      The GROUND half of the front "Electric Accessory Leads" pickup that the diagram carries - see
      ACC_F_PWR, which is the same length, the same terminal type, and leaves at the same point.
  ACC_F_PWR:
    type: Junction
    subtype: double-female bullet - branch B00.8, front accessory feed
    pinlabels: [W/Bl]
    notes: |-
      Alongside ACC_F and the same 240 mm from the datum. Both slots empty.
      W/Bl is the "blue-family wire" of the diagram's accessory pair, and its source is the second
      fuse box - see FUSE_AUX. B09's mate is that box's W/Bl output bullet, which shows evidence of
      having been mated, so the accessory FEED was in service even though the accessory EARTHS at
      ACC_F and ACC_R never were.
  ACC_R:
    type: Junction
    subtype: double-female bullet - branch B08, rear accessory earth
    pinlabels: [Y/BK]
    notes: At 975 mm. Both slots empty, and never connected - same photographic and oxidation evidence as ACC_F. The ground half of the rear accessory pair.
  ACC_R_PWR:
    type: Bullet connector
    subtype: male - branch B09, rear accessory feed
    pinlabels: [W/Bl]
    notes: At 1060 mm. A MALE bullet, unlike the three double-females of this group. Same net as ACC_F_PWR, 0.3 ohm [meter 28 Aug 2026]. Its mate is the W/Bl output of FUSE_AUX, whose female bullet shows evidence of having been mated - unlike everything else in this accessory group.
  SP_BR:
    style: simple
    type: Splice
    subtype: brown switched-ignition bus
    notes: |-
      ONE net, NINE harness points, 0.0-0.7 ohm with no splits - unlike Y/R, blue and black, which
      each turned out to be two nets. A trunk with taps, modelled as one node. Reference on the
      instrument cluster's brown, all pigtails off. [meter 28 Aug 2026]
      THE IGNITION SWITCH IS THE SOURCE - its brown output is on this net at 0.0 ohm, so the
      right-bar brown is a tap off it rather than what energises it.
      ⚠️ THE BENCH NET IS WIDER THAN THIS MODEL. Nine points against the six drawn: the extras are the
      horn feed, BOTH bar-switch connectors and one unmodelled endpoint at the headlight junction.
      [OPEN]
      One point reads 0.7 ohm against 0.0-0.1 everywhere else. Under the 1 ohm threshold - a
      condition matter on wire being replaced, recorded so the outlier is not mistaken for a slip.

cables:
  # --- battery main and chassis ground ---------------------------
  W_BAT_SOL:  {<<: *w6, colors: [RD]}
  # Net A is YELLOW base - YEBK, not BKYE. These are the only ground cables in
  # this model drawn that way, and they are the only ones measured to be on it.
  W_ACC_GND_F: {<<: *w16, colors: [YEBK]}
  W_ACC_GND_R: {<<: *w16, colors: [YEBK]}
  W_ACC_RING:
    <<: *w16
    colors: [YEBK]
    notes: |-
      The chassis ring terminal's own lead, B04.1. YELLOW base with a black tracer [bench 28 Aug
      2026]. Every other ground in this model is BKYE, black base, which is Net B.
      Gauge reads heavier than the harness's common wire, 16-18 by eye and DEFINITIVELY not 6 AWG -
      so this is not the battery earth strap. See W_BAT_GND.
  W_ACC_FUSED:
    <<: *w18
    colors: [WHBU]
    notes: The second fuse box's W/Bl output, to B09. Its female bullet shows evidence of having been mated - the only terminal in the accessory group that does. So the accessory FEED was in service while both accessory EARTHS sat unused.
  W_ACC_PWR:
    <<: *w18
    colors: [WHBU]
    notes: |-
      The accessory feed, front pickup to rear pickup - one net, 0.3 ohm [meter 28 Aug 2026]. It is
      the "blue-family wire" of the diagram's Electric Accessory Leads.
      ⚠️ WHITE base with a BLUE tracer - NOT Bl/W, which is a different wire on this bike and is drawn
      as W_FUSE_HEAD_IN. Base colour first.
  W_BAT_GND:
    <<: *w6
    colors: [BKYE]
    notes: |-
      The battery earth strap, NOT a harness lead - the harness's own ring terminal is 16-18 AWG Y/BK
      [bench 28 Aug 2026]. This strap is separate hardware that lands on the same mount. Drawn
      because it is a real path, not because the loom carries it.
      ⚠️ IT LANDS ON GND_CHASSIS AS THE CHASSIS CONNECTION ITSELF, not as a Net A member, and its
      BKYE colour is a modelling convenience that reads as a net claim it does not mean. A 6 AWG
      battery strap is not a BK/Y harness wire.
      THE UNDERLYING ISSUE IS THAT GND_CHASSIS DOES TWO JOBS: it is the Net A ring terminal AND the
      physical chassis mount those two things share. Those are different objects and the model uses
      one node for both. Splitting them is a real change and has not been made. [OPEN]
  # --- main feed ----------------------------------------------------
  W_MAIN:
    <<: *w14
    colors: [WHRD]
    notes: The starter relay's battery stud to the W/R bullet node. See SP_WR - the node is on the relay assembly, not in the loom.
  W_MAIN_OUT:
    <<: *w14
    colors: [WHRD]
    notes: |-
      The 20A MAIN fuse's BATTERY-side leg - W/R off holder 1, into the bullet node.
      ** DESIGN FINDING, the most important thing on this sheet: THIS IS THE MELTED, CORRODED
      BULLET. ** A larger-gauge W/R from the fuse meets a smaller W/R at this joint, on the
      highest-current circuit on the bike. A new harness built to the same topology puts the same
      gauge step on the same 20A node.
      ⚠️ GAUGE IS EYEBALLED, not measured - "larger" is a bench comparison. Size the rebuild from the
      load, not from this.
  W_IGN_FEED:
    <<: *w14
    colors: [WH]
    notes: |-
      The 20A MAIN fuse's OUTPUT - white, holder 1's W terminal to the ignition switch. Route and
      colour both correct: B00.3's white rings 0.1 ohm to B06.3, which mates the pigtail white on the
      W terminal [meter 29 Aug 2026].
      That reading is also what settled the fuse's orientation - see MF. W is the load side.
      GAUGE: 14 AWG is inherited, NOT measured. The BATT white is visibly heavier than the harness's
      common wire, but that is an eyeball comparison. [OPEN]

  # --- ignition Br: the switched bus, fed straight off the switch ----
  W_BR_MAIN:
    <<: *w16
    colors: [BN]
    notes: The bus feed. The ignition switch's brown output is on the switched bus at 0.0 ohm, with no brown anywhere on the fuse-box pigtail [meter 28 Aug 2026].

  # --- fuse box internals: three independent holders, no bus ---------
  W_FUSE_HEAD_IN: {<<: *w18, colors: [BUWH]}
  W_BL_UP:        {<<: *w18, colors: [BU]}
  W_TAIL_RBL:
    <<: *w18
    colors: [RDBU]
    notes: |-
      The TAIL fuse's R/Bl leg, and its OUTPUT. Runs to the ignition switch's TAIL1 pin, which is
      where that pin gets its power - 0.2 ohm, B00.3 to B06.5 cavity 4 [meter 29 Aug 2026].
      Named by COLOUR rather than by direction on purpose: this one has already flipped once.
  W_TAIL_BRW:
    <<: *w18
    colors: [BNWH]
    notes: |-
      The TAIL fuse's Br/W leg, and its INPUT. Fed from the switched brown bus by way of SP_RH_BR,
      the splice inside the RIGHT-BAR switch pigtail.
      That is the stock design and it is worth reading twice: the feed for this fuse goes UP TO THE
      HANDLEBAR AND BACK DOWN. Named by colour rather than direction, like W_TAIL_RBL.
  W_BRW_HARNESS:
    <<: *w18
    colors: [BNWH]
    notes: The fuse-panel leg of the three-way Br/W net. See SP_BRW for why a node sits between the three endpoints.
  W_BRW_RH:
    <<: *w18
    colors: [BNWH]
    notes: The right-bar leg of the Br/W net. Rings 0.0 ohm to the fuse-panel and headlight-junction legs with the right-bar 4P DISCONNECTED, which is what makes the reading meaningful - probing the switch side would ring the whole branch through SP_RH_BR [meter 28 Aug 2026].
  W_BRW_HL:
    <<: *w18
    colors: [BNWH]
    notes: The headlight-junction leg of the Br/W net, ending at BRW_HL and feeding the two meter lamps.

connections:
  # --- 20A MAIN output onto the W/R main power net --------------------
  - - MF: [2]
    - W_MAIN_OUT: [1]
    - SP_WR: [1]

  # --- main feed to the ignition switch ------------------------------
  - - SOL: [1]
    - W_MAIN: [1]
    - SP_WR: [1]
  - - MF: [1]
    - W_IGN_FEED: [1]
    - IGN: [1]

  # --- ignition switch ON: W to Br, Br onto the switched bus ---------
  - - IGN: [3]
    - W_BR_MAIN: [1]
    - SP_BR: [1]

  # --- fuse box: holder 2 HEAD, holder 3 TAIL, no bus between them ---
  - - FUSE_4P: [3]
    - W_FUSE_HEAD_IN: [1]
    - FUSE_HEAD: [1]
  - - FUSE_HEAD: [2]
    - W_BL_UP: [1]
    - FUSE_4P: [1]
  - - FUSE_4P: [2]
    - W_TAIL_BRW: [1]
    - FUSE_TAIL: [1]
  - - FUSE_TAIL: [2]
    - W_TAIL_RBL: [1]
    - FUSE_4P: [4]
  # --- Br/W: three measured endpoints, junction location unknown -----
  - - FUSE_4P: [2]
    - W_BRW_HARNESS: [1]
    - SP_BRW: [1]
  - - SP_BRW: [1]
    - W_BRW_RH: [1]
    - RH_4P: [2]
  - - SP_BRW: [1]
    - W_BRW_HL: [1]
    - BRW_HL: [1]

  # --- accessory pickups: provisioned, never used ---------------------
  - - GND_CHASSIS: [1]
    - W_ACC_RING: [1]
    - SP_NETA: [1]
  - - SP_NETA: [1]
    - W_ACC_GND_F: [1]
    - ACC_F: [1]
  - - SP_NETA: [1]
    - W_ACC_GND_R: [1]
    - ACC_R: [1]
  - - ACC_F_PWR: [1]
    - W_ACC_PWR: [1]
    - ACC_R_PWR: [1]
  - - FUSE_AUX: [2]
    - W_ACC_FUSED: [1]
    - ACC_R_PWR: [1]

  # --- battery main and chassis ground ----------------------------
  - - BATT: [1]
    - W_BAT_SOL: [1]
    - SOL: [1]
  - - BATT: [2]
    - W_BAT_GND: [1]
    - GND_CHASSIS: [1]
