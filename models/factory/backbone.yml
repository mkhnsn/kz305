# BACKBONE — Power distribution and grounds. Included by every sheet.
#
# Part of the factory reference model. Rendered as a sheet on its own,
# and merged with the other subsystems for the combined drawing.
# See models/kz305-factory.yml for the model-wide notes.
#
# FUSE TOPOLOGY — REWRITTEN 28 Aug 2026 from the fuse box on the bench,
# disconnected, every fuse pulled. It supersedes the cascade read off
# the 600 dpi scan on 19 Aug, which was wrong:
#
#   - THERE IS NO INTERNAL BUS. All six terminals were traced
#     individually and every one is open to the other five. The scan
#     draws the two 10A holders sharing a common red feed; no such
#     node exists. Three independent circuits, which is what the
#     13 Aug bench note said. Working rule 1 applies.
#   - THE BOX CARRIES ITS OWN PRINTED CIRCUIT NAMES, which beat a
#     44-year-old scan: 20A MAIN, 10A HEAD, 10A TAIL.
#   - NO BROWN REACHES THE BOX. The switched brown is one net of nine
#     harness points and the fuse-box pigtail is not among them, so
#     the modelled FUSE_A — a 10A fed Br, out Bl/W — does not exist
#     and has been deleted along with the SP_BLW cascade node.
#
#         holder 1   20A  MAIN    W      <->  W/R
#         holder 2   10A  HEAD    Bl/W   <->  Bl
#         holder 3   10A  TAIL    R/Bl   <->  Br/W
#
#   Every one of those six wires had already been identified from the
#   harness side by continuity BEFORE the printed labels were read,
#   and no label contradicts one.
#
# So the "one 10A fuse carries the whole bike" argument is withdrawn.
# The rebuild's per-circuit cavity map still stands, but on the
# findings that replaced it: a distributed earth that never reaches
# the ring terminal, and a gauge step at a bullet on the 20A main.
#
# GROUNDS — there are TWO ground nets, not one. See GND_CHASSIS and
# GND_NETB below. This is the structural correction of the session.

connectors:
  BATT:
    <<: *battery
  GND_CHASSIS:
    type: Chassis ground
    subtype: single Y/BK ring terminal — ground Net A
    pinlabels: [RING]
    notes: |-
      COLOUR SETTLED 28 Aug 2026 - the ring terminal is Y/BK, YELLOW base with a black tracer, and
      16-18 AWG. Not BK/Y, and not the 6 AWG the model assumed: the battery earth strap is separate
      hardware and is NOT part of this loom. The old "dispute" was a false premise - both wires exist
      and they are different nets.
      NET A IS SMALL. Reference lead on this ring, all pigtails off: only two other harness points ring
      to it (both double-female bullets, contents lost at teardown). Every BK/Y point measured OPEN to
      it - see GND_NETB.
      WHICH NET EACH REMAINING GROUND LEAD BELONGS TO IS NOT MEASURED. The BKYE grounds still drawn to
      this node are drawn here by inheritance from the diagram, not by continuity, and most of them are
      more likely to be Net B. Do not read this node as "the harness ground" - ring each lead before
      terminating it on the rebuild's star bus.
  GND_NETB:
    type: Distributed earth
    subtype: BK/Y harness return net — ground Net B
    pinlabels: [NET]
    notes: |-
      NEW 28 Aug 2026, and it is a finding, not a drawing convenience. Net B is a SINGLE harness-wide
      return net - every black-base point rings continuous with every other, 0.0-0.3 ohm from the tail
      to the R/R to the headlight junction - and it is OPEN TO THE CHASSIS RING ENTIRELY.
      It does not return through the main harness at all. It reaches earth through the CHILD HARNESSES,
      at whatever each component is bolted to: some engine block, some frame, some elsewhere. That is
      why every point on it reads open with the harness on the bench - its returns are all outside the
      thing being measured.
      This disproves docs/kz305-b1-wiring.md's 13 Aug claim that everything returns through one ring
      terminal. The harness has ONE ring terminal and MANY earth points.
      SCOPE CONSEQUENCE FOR THE REBUILD: every component earthing through its own mounting hardware
      needs a NEW ground wire back to the star bus - wire that does not exist in this harness and
      appears nowhere in these models. The count of those wires is the count of Net B earth points,
      and it is not yet known. Each has to be traced through its own child harness.
  GND_ENG:
    type: Engine case ground
    subtype: internal, no harness wire
    pinlabels: [CASE]
    notes: |-
      Components that ground through their own mounting rather than a harness lead - starter motor,
      points, capacitors, neutral switch. Net B earths this way too, but through child-harness
      pigtails rather than at the component body - see GND_NETB.
      BROADER THAN ITS NAME, 29 Aug 2026. The LEFT-BAR CLUSTER now earths here as well: its horn
      button grounds through the cluster body, bar to frame, not through the engine and not through
      a harness wire. The node means "grounds through its own mounting"; the name says engine case.
      Rename it when something else forces a sweep of these files - not worth churning references
      for on its own.
      REBUILD: every one of these is a component that gets a NEW wire back to the star bus, and the
      count of them is not yet known. See blocker 5.
  MF:
    <<: *main_fuse
    subtype: 20A glass — fuse box holder 1, printed MAIN
    pinlabels: [W, W/R]
    notes: |-
      IDENTIFIED 28 Aug 2026 - holder 1 of the original three-holder glass box, printed MAIN, W on one
      terminal and W/R on the other. White mates B06.3; W/R is the main power net,
      so the bench reading is white in from the solenoid and W/R out to the main bus.
      UPDATED 29 Aug 2026: that net is no longer two anonymous points. Its W/R output leg is now
      drawn (W_MAIN_OUT) into SP_WR, and the REGULATOR/RECTIFIER'S DC OUTPUT lands on the same node,
      so the main power net has an identified SOURCE as well as an identified fuse. This also
      explains why W/R never appeared in the cable index: it was the charging output all along,
      and between 28 and 29 Aug it was mis-drawn onto the brown bus.
      CONFLICT WITH THE DRAWN ROUTE, NOT YET RESOLVED. This model runs the fuse OUTPUT on to the
      ignition switch as white (W_IGN_FEED). The W/R net does not reach the headlight junction at all,
      so whatever feeds the ignition switch's white BATT pin, it is not this fuse's W/R output leg.
      Either the ignition feed is a tap on the WHITE side, ahead of the fuse, or the drawn route is
      wrong. Ring B00.3's white against holder 1's white terminal before redrawing; the route is left as
      drawn rather than guessed.
      DESIGN FINDING: the melted, corroded bullet on the fuse-box pigtail is this holder's W/R output.
      The highest-current circuit on the bike, failing at a joint where conductor size steps. A new
      harness built to the same topology puts the same step on the same 20A circuit - see the rebuild.
  FUSE_HEAD:
    <<: *fuse10
    subtype: 10A glass — fuse box holder 2, printed HEAD
    pinlabels: [Bl/W IN, Bl OUT]
    notes: |-
      IDENTIFIED 28 Aug 2026 and its ORIENTATION IS SETTLED. Bl is the dimmer's supply (meter-confirmed
      on the switch: Bl common, R/BK HI, R/Y LO), so Bl must sit downstream of its own fuse - Bl/W in,
      Bl out. Corroborated from the harness side the same day and independently: Blue Net 2 runs from
      this box to the left-bar junction, and the box prints this holder HEAD.
      The whole path is now established leg by leg, each measured separately:
      HEAD fuse, Bl, dimmer common, then R/BK (HI) or R/Y (LO) to the headlight.
      DESIGN CONSEQUENCE: headlight current is fused, then run up to the handlebar and switched there,
      so the full lamp load passes through the bar-switch contacts. That is the standard case for a
      headlight relay, and it now rests on the harness rather than on assumption.
      ** CLOSED 29 Aug 2026: WHAT FEEDS Bl/W IS THE SWITCHED BROWN BUS. ** The right-bar pigtail was
      unsleeved a second time and Bl/W sits on SP_RH_BR together with the brown arriving from the bus.
      So Bl/W carries bus power DOWN from the handlebar into this fuse - a feed OUT of the right-bar
      branch, which is what this holder's settled orientation predicted and the opposite of the
      17 Aug trace. Both readings stay in the record; the deciding evidence is the unsleeving.
      DESIGN: this fuse's supply goes up to the handlebar and back before reaching it. So does the
      TAIL fuse's. See SP_RH_BR.
  FUSE_TAIL:
    <<: *fuse10
    subtype: 10A glass — fuse box holder 3, printed TAIL
    pinlabels: [Br/W IN, R/Bl OUT]
    notes: |-
      NEW 28 Aug 2026 - holder 3, printed TAIL, R/Bl on one terminal and Br/W on the other. This closes
      the standing question of what the fourth conductor at the fuse-panel 4P is: it reads R/Bl, not
      "R or R/BK", and the same R/Bl appears at B00.3, the ignition switch 4P.
      ** ORIENTATION SETTLED 29 Aug 2026 - READING (b). Br/W IN, R/Bl OUT. ** Drawn that way now.
      The box itself still cannot answer it - no bus, no fuses in, nothing inside distinguishing an
      input from an output. It was settled from the two ends instead, and reading (a) is not merely
      less likely but IMPOSSIBLE:
        (a) R/Bl in from the ignition switch, fused Br/W out. ELIMINATED. The metered switch table
            has ON connecting R/BK to R and NOTHING ELSE to either - the tail pair is a bridge
            between TAIL1 and TAIL2 that touches neither battery nor ignition. Under (a) this fuse
            would be fed from a pin with no source and the tail lamp could never light.
        (b) Br/W in, R/Bl out to the switch's TAIL1 pin. STANDS, and every end now has a source.
      What forced it: the right-bar splice was UNSLEEVED A SECOND TIME on 29 Aug and SP_RH_BR is
      confirmed as mapped - Bl/W, Br and Br/W join and leave as a single brown. The splice is not
      misread, so of the disjunction this model posed, the other horn holds.
      THE CIRCUIT NOW CLOSES END TO END: ignition switch Br, switched brown bus, up to the right bar,
      SP_RH_BR, back down as Br/W, THIS FUSE, R/Bl, switch TAIL1, bridged to R in ON, tail lamp.
      PARK's W-to-R corroborates it independently: it feeds the R side directly, so R is the lamp end
      and R/Bl is the feed end.
      This also closes, from 19 Aug, WHERE THE IGNITION SWITCH'S TAIL1 PIN PICKS UP ITS POWER: from
      this fuse's output.
      CONFIRMING READING, not required but cheap: ring B06.5's R/Bl to B00.3's.
  FUSE_4P:
    type: Junction
    subtype: 4-pin connector, fuse panel
    pinlabels: [Bl, Br/W, Bl/W, R/Bl]
    notes: |-
      WAYS IDENTIFIED 28 Aug 2026. The fuse box joins the harness on a fixed pigtail - the 20A main's
      two wires leave on bullets (B06.3, B06.4) and the four 10A conductors come through this connector.
      All four are now named from the box's own terminals: Bl/W and Bl on holder 2 (HEAD), R/Bl and
      Br/W on holder 3 (TAIL). The previously drawn "Br IN" way does not exist - no brown reaches this
      box.
      The R/Bl way is drawn terminating at the fuse; its harness-side partner is the standing candidate
      B00.3 at the ignition switch, unrung, so it is deliberately left unconnected rather than assumed.
      ** WAYS RENUMBERED TO PHYSICAL CAVITIES 29 Aug 2026. ** They were previously listed grouped by
      holder - Bl/W and Bl, then R/Bl and Br/W - which was a logical convention, not a record of the
      connector. The bench order is different, and the pin numbers here are now the HARNESS-SIDE
      cavities, matching measurements/connector-inventory.csv so there is only one numbering in the
      project:
        1  Bl     fused headlight supply, holder 2 HEAD out
        2  Br/W   holder 3 TAIL, and the leg of the Br/W net that reaches SP_BRW
        3  Bl/W   holder 2 HEAD in
        4  R/Bl   holder 3 TAIL
      Cavity numbering is mating face, KEYWAY UP, left to right, top row first. The housing's moulded
      marks - a '4' and a flower logo - read UPSIDE DOWN in that orientation and are mould marks, not
      cavity numbers and not an orientation reference. See measurements/README.
      ** BOTH HALVES READ AND THE MIRROR CHECKS OUT 4-of-4, 29 Aug 2026. ** All four cavities are
      populated on each side and every mated pair matches on colour. Male spades on the fuse-box
      pigtail, female terminals in the harness. NOTE THIS IS A DIFFERENT, SMALLER CONNECTOR THAN THE
      R/R's 4P - same way count, unrelated part, different mould marks. Its depth and terminal width
      are NOT measured, and the R/R connector's must not be borrowed for it. Unlike the R/R connector there is no unpopulated way
      here and nothing to overturn - the check was run because of what it found at B04.3, and it
      passed.
      SCOPE: the rebuild replaces this box and its pigtail with a blade block, so these wires are the
      baseline for laying that block out, not a set to reproduce.
  IGN:
    <<: *ign_switch
  SOL:
    <<: *starter_relay
  SP_BRW:
    style: simple
    type: Splice
    subtype: Br/W junction - location unknown
    notes: |-
      INFERRED 28 Aug 2026, and it is a deduction rather than a sighting. Br/W rings continuous across
      THREE endpoints - the fuse-box pigtail, the right-bar 4P and BRW_HL at the headlight junction -
      with the right-bar 4P disconnected. BRW_HL holds ONE wire with both its receptacle slots empty,
      so the junction is not there, and one wire cannot reach three endpoints. Something joins these
      runs UNDER THE TAPE.
      Drawn as a node because the three-way net is measured; its POSITION on the trunk is not, so do
      not read the placement here as a location. Step 3 unwraps the loom and should find it - that is
      the whole reason the procedure unwraps before ringing out rather than after.
  BRW_HL:
    type: Junction
    subtype: double-female bullet, both slots empty
    pinlabels: [Br/W]
    notes: |-
      The Br/W endpoint at the headlight junction (branch B00.11). One harness wire in the crimp and
      TWO receptacle slots, BOTH EMPTY - whatever plugged in came off at teardown, before this
      project's tagging existed, and is recorded nowhere. Modelled so the drawing carries the third
      endpoint the meter found; what it fed is a permanent gap in the as-built record, recoverable
      only from the on-bike photographs or from the components themselves.
  SP_WR:
    style: simple
    type: Splice
    subtype: W/R main power net - double-female bullet node at B06.4
    notes: |-
      NEW 29 Aug 2026. The W/R net is the main power path and it now has a SOURCE: the regulator/
      rectifier's DC output. Three things sit on it -
        - MF holder 1's W/R output terminal (the 20A MAIN), via the fuse-box pigtail;
        - the R/R's DC output, arriving on a male bullet at B04.6 (see W_RR_OUT);
        - a W/R leg running off to the STARTER RELAY, seen at the bench 28 Aug 2026 while the node
          was still mated, but WHICH RELAY TERMINAL IT LANDS ON WAS NOT IDENTIFIED, so it is
          deliberately not drawn. Ring it before treating the relay end as known.
      Physically this node is a DOUBLE-FEMALE BULLET on the fuse-box pigtail, so "splice" here is a
      separable junction, not a crimp under the tape - unlike SP_BRW, which is genuinely hidden.
      ** THE NODE IS NOT IN THE HARNESS AT ALL. ** Confirmed 29 Aug 2026 with the starter and
      fuse-block cables disconnected: the harness side of B06.4 is a PLAIN SINGLE MALE BULLET. The
      loom contributes one wire; the junction itself belongs to the fuse-box pigtail, which the
      rebuild replaces outright. So this node is inherited only if the rebuild chooses to build one.
      The 28 Aug mate observation was taken while everything was still plugged together and CANNOT
      BE REPEATED now. It is the one bullet node on this harness whose contents were captured before
      teardown - the other six lost theirs, and that gap is permanent.
      DESIGN: the melted, corroded joint is HERE, and the mechanism is now precisely located - the
      gauge step sits at the pigtail's double-female, where the fuse's larger W/R meets the smaller
      harness W/R, on the highest-current circuit on the bike. The joint disappears with the pigtail;
      the TOPOLOGY is what must not be reproduced - charging output, main-fuse output and
      starter-relay feed all meeting at one bullet junction with a conductor-size step in it.
      The two-point W/R net recorded on 28 Aug (B04.6 to B06.4, 0.1 ohm) is unchanged as a
      measurement; what changed is that one of those points is now identified as the charging output
      rather than an unexplained white-base wire absent from the cable index.
  SP_BR:
    style: simple
    type: Splice
    subtype: brown switched-ignition bus
    notes: |-
      MEASURED 28 Aug 2026 and the direction is now the other way round. Reference on the instrument
      cluster's brown, all pigtails off: ONE net, NINE harness points, 0.0-0.7 ohm with no splits -
      unlike Y/R, blue and black, which each turned out to be two nets. It is a trunk with taps,
      modelled as one node.
      This supersedes the 19 Aug scan reading that the bus is energised through the right-bar branch's
      Br return leg and is NOT fed directly by the ignition switch. The ignition switch's brown output
      is ON THIS NET at 0.0 ohm, so it is the source and the right-bar brown is a tap off it.
      THE BENCH NET IS WIDER THAN THIS MODEL. Nine points against the six drawn: the extras are the
      horn feed, BOTH bar-switch connectors and one unmodelled endpoint at the headlight junction. The
      brown at the LEFT-bar 6P has no home in the modelled way list, which accounts for all six ways
      without one. Ring out what it feeds.
      One point reads 0.7 ohm against 0.0-0.1 everywhere else. Under the 1 ohm threshold, a condition
      matter on wire being replaced, recorded only so the outlier is not mistaken for a slip.

cables:
  # --- battery main and chassis ground ---------------------------
  W_BAT_SOL:  {<<: *w6, colors: [RD]}
  W_BAT_GND:
    <<: *w6
    colors: [BKYE]
    notes: The battery earth strap, NOT a harness lead - established 28 Aug 2026 when the harness's own ring terminal turned out to be 16-18 AWG Y/BK. This strap is separate hardware that lands on the same mount. Drawn because it is a real path, not because the loom carries it.
  # --- main feed ----------------------------------------------------
  W_MAIN:     {<<: *w14, colors: [WH]}
  W_MAIN_OUT:
    <<: *w14
    colors: [WHRD]
    notes: |-
      NEW 29 Aug 2026. The 20A MAIN fuse's OUTPUT leg - W/R off holder 1, into the double-female
      bullet node on the fuse-box pigtail. Drawn now because the node has a second identified leg
      (the R/R's DC output) and a net with two named ends is worth a wire rather than prose.
      DESIGN FINDING, unchanged and still the most important thing on this sheet: THIS is the melted,
      corroded bullet. The larger-gauge W/R from the fuse meets a smaller harness W/R at this joint,
      on the highest-current circuit on the bike. A new harness built to the same topology puts the
      same gauge step on the same 20A node. GAUGE IS EYEBALLED, not measured - "larger" is a bench
      comparison, so size the rebuild from the load, not from this.
  W_IGN_FEED:
    <<: *w14
    colors: [WH]
    notes: |-
      LEFT AS DRAWN, AND CONTRADICTED - see the MF notes. The 20A fuse's output terminal carries W/R
      on the bench, and no point on the W/R net is at the headlight junction where the ignition
      switch is. So this cable is either the wrong colour or the wrong route. One ring-out settles
      it; guessing which would put a fabricated topology in a reference drawing.
      STILL CONTRADICTED, AND MORE SHARPLY, 29 Aug 2026. The W/R net's membership is now better
      known rather than worse: MF's output terminal, the R/R's DC output at B04.6, and an
      unidentified leg to the starter relay. None of them is the ignition switch. The open question
      is unchanged - ring B00.3's white against holder 1's white terminal - but of the two live
      readings, "the ignition feed taps the WHITE side, ahead of the fuse" is now the likelier.

  # --- ignition Br: the switched bus, fed straight off the switch ----
  W_BR_MAIN:
    <<: *w16
    colors: [BN]
    notes: RE-ROUTED 28 Aug 2026. Was drawn as a short link from the switch into the fuse panel, feeding a 10A that does not exist. Continuity puts the ignition switch's brown output on the switched bus itself at 0.0 ohm, with no brown anywhere on the fuse-box pigtail, so this is the bus feed.

  # --- fuse box internals: three independent holders, no bus ---------
  W_FUSE_HEAD_IN: {<<: *w18, colors: [BUWH]}
  W_BL_UP:        {<<: *w18, colors: [BU]}
  W_TAIL_RBL:
    <<: *w18
    colors: [RDBU]
    notes: |-
      The TAIL fuse's R/Bl leg. RENAMED 29 Aug 2026 from W_FUSE_TAIL_IN: the holder's orientation is
      settled as Br/W in and R/Bl out, so this is the OUTPUT, and a name encoding the old direction
      would have been actively misleading. Named by colour rather than by direction on purpose -
      this one has already flipped once.
      Runs to the ignition switch's TAIL1 pin, which is where that pin gets its power. Its
      harness-side partner at B00.3 is unrung, so it is still drawn terminating here.
  W_TAIL_BRW:
    <<: *w18
    colors: [BNWH]
    notes: |-
      The TAIL fuse's Br/W leg, and its INPUT. RENAMED 29 Aug 2026 from W_BRW_OUT for the same reason
      as W_TAIL_RBL - it was named for a direction that turned out to be backwards.
      Fed from the switched brown bus by way of SP_RH_BR, the splice inside the RIGHT-BAR switch
      pigtail. That is the stock design and it is worth reading twice: the feed for this fuse goes
      UP TO THE HANDLEBAR AND BACK DOWN.
  W_BRW_HARNESS:
    <<: *w18
    colors: [BNWH]
    notes: NEW 28 Aug 2026. Br/W is continuous from the fuse-box pigtail to the right-bar 4P (item 0b), which this model did not carry - it drew Br/W as generated at the right-bar splice. This is the fuse-panel leg of the three-way net; see SP_BRW for why a node sits between the three endpoints.
  W_BRW_RH:
    <<: *w18
    colors: [BNWH]
    notes: The right-bar leg of the Br/W net. Rings 0.0 ohm to the fuse-panel and headlight-junction legs with the right-bar 4P DISCONNECTED, which is what makes the reading meaningful - probing the switch side would ring the whole branch through the confirmed 1-to-3 splice.
  W_BRW_HL:
    <<: *w18
    colors: [BNWH]
    notes: The headlight-junction leg of the Br/W net, ending at BRW_HL. Measured as part of the three-endpoint net; drawn so the sheet shows what the meter found rather than leaving the endpoint in prose only.

connections:
  # --- 20A MAIN output onto the W/R main power net --------------------
  - - MF: [2]
    - W_MAIN_OUT: [1]
    - SP_WR: [1]

  # --- main feed to the ignition switch ------------------------------
  - - SOL: [1]
    - W_MAIN: [1]
    - MF: [1]
  - - MF: [2]
    - W_IGN_FEED: [1]
    - IGN: [1]

  # --- ignition switch ON: W to Br, Br onto the switched bus ---------
  - - IGN: [3]
    - W_BR_MAIN: [1]
    - SP_BR: [1]

  # --- fuse box: holder 2 HEAD, holder 3 TAIL, no bus between them ---
  - - FUSE_4P: [3]
    - W_FUSE_HEAD_IN: [1]
    - FUSE_HEAD: [1]
  - - FUSE_HEAD: [2]
    - W_BL_UP: [1]
    - FUSE_4P: [1]
  - - FUSE_4P: [2]
    - W_TAIL_BRW: [1]
    - FUSE_TAIL: [1]
  - - FUSE_TAIL: [2]
    - W_TAIL_RBL: [1]
    - FUSE_4P: [4]
  # --- Br/W: three measured endpoints, junction location unknown -----
  - - FUSE_4P: [2]
    - W_BRW_HARNESS: [1]
    - SP_BRW: [1]
  - - SP_BRW: [1]
    - W_BRW_RH: [1]
    - RH_4P: [2]
  - - SP_BRW: [1]
    - W_BRW_HL: [1]
    - BRW_HL: [1]

  # --- battery main and chassis ground ----------------------------
  - - BATT: [1]
    - W_BAT_SOL: [1]
    - SOL: [1]
  - - BATT: [2]
    - W_BAT_GND: [1]
    - GND_CHASSIS: [1]
