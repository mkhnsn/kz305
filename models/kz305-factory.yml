# =====================================================================
# STILL TO TRANSCRIBE - full-vehicle coverage is not complete
#
#   front brake light switch - leads believed Br/W + Bl/W. Diagram shows
#     two leads, one brownish and one light blue; the 15 Aug inventory
#     found Br/W in the right-bar 4P and a loose Bl/W alongside, which
#     fits. Which is feed and which is output is UNVERIFIED. Deliberately
#     NOT modeled: an unreferenced connector is dropped from the drawing
#     entirely, so declaring it would imply coverage that does not exist.
#   headlight + dimmer (LH cluster common still unresolved by meter)
#   turn signals x4 + flasher + LH turn switch + 2 indicators
#   horn + horn button
#   tail / brake light, license lamp, front + rear brake switches
#   speedo + tacho lamps, high-beam indicator
#   the two 10A fuses and what each actually feeds
#   6P junction connectors and the meter accessory leads
#
# The 10A fuse assignments matter most - they determine which circuits
# survive a fault, and the rebuild's cavity map depends on them.
# =====================================================================
