# =====================================================================
# KZ305-B1 — FACTORY HARNESS, AS BUILT
#
# Reference model of the stock harness. This file describes what
# Kawasaki did, NOT what we are building. Do not "improve" anything
# here - corrections belong in kz305-rebuild.yml, so the diff between
# the two files stays an honest list of our modifications.
#
#   wireviz -f hps -p kz305-common.yml kz305-factory.yml
#
# Render with -f hps (no TSV). WireViz always defaults a missing length
# to 0, so a BOM for this file would report "0 m" for every wire. There
# is no BOM for a harness we are not building - that belongs to
# kz305-rebuild.yml.
#
# Source: KZ305-A1/A2/B1/C1/D1 wiring diagram, 1981 KZ305A supplement
# printed p.255, read at 600 dpi, plus bench work 13-15 Aug 2026.
#
# NO LENGTHS. This is a reference drawing, not a cut list. Inventing
# placeholder lengths for a harness we are not building would put fake
# numbers in the BOM.
#
# COVERAGE: run-critical core is transcribed and largely confirmed.
# Lighting, turn signals, horn and instruments are NOT yet transcribed
# - see "still to transcribe" at the foot of this file.
#
# Anything marked TBD is unverified. The harness is on the bench; ring
# it out rather than trusting this drawing.
#
# !! IN-SLEEVE SPLICES WITH COLOUR CHANGES
#
# CONFIRMED 17 Aug 2026, in ONE place: inside the RIGHT-BAR switchgear
# branch, a wire changes colour at a splice within the sleeve. Not
# observed in the main trunk. Elsewhere is UNKNOWN, not clean - nobody
# has unwrapped the rest yet.
#
# Every circuit below is drawn as a single wire end to end, which is how
# the diagram presents it. Wherever an in-sleeve splice exists that is
# not how the harness is built, so:
#   - a cable's single colour here may be two colours on the bike
#   - a "wire" here may physically be a junction
#   - the rebuild BOM would be wrong about wire count and colour
#
# The right-bar branch is MAPPED as of 17 Aug 2026 and is drawn below
# with its real splices - SP_RH_YR and SP_RH_BR. The rest of the harness
# has not been unwrapped. Do not treat these cable colours
# as a shopping list until harness-ringout-procedure.md steps 3-4 are
# done.
# =====================================================================

connectors:

  BATT:
    <<: *battery

  GND_CHASSIS:
    type: Chassis ground
    subtype: single BK/Y ring terminal
    pinlabels: [RING]
    notes: Stock returns the ENTIRE harness through one ring terminal - the single point of failure the rebuild replaces with a star bus. COLOUR DISPUTED - recorded BK/Y (black, yellow stripe) 17 Aug 2026 from the physical harness. The 13 Aug bench note said Y/BK and the 600 dpi diagram reads yellow-primary. Newest hands-on observation wins for now but it was hedged. Settle it by cutting a fresh end and identifying the BASE colour.

  GND_ENG:
    type: Engine case ground
    subtype: internal, no harness wire
    pinlabels: [CASE]
    notes: Components that ground through their own mounting rather than a harness lead - starter motor, points, capacitors, neutral switch.

  MF:
    <<: *main_fuse

  FUSE_A:
    <<: *fuse10
    subtype: 10A glass - WHICH holder is TBD
    notes: Feeds the right-bar branch on Bl/W, per bench trace 17 Aug 2026. WHICH of the two 10A holders this is has NOT been established, and it matters - this one fuse protects the kill switch, both ignition coils, the starter trigger and whatever Br and Br/W feed onward. That is the whole run-critical half of the bike on one fuse.

  IGN:
    <<: *ign_switch

  RH:
    <<: *rh_cluster
    pinlabels: [Br STOP IN, Y/R STOP OUT, Y/R BTN IN, BK BTN OUT]
    notes: Four leads leave the switch housing directly - no connector at the switch. MAPPED by unsleeving 17 Aug 2026. Contacts degraded - button 5 ohm, kill 3 ohm; clean before reuse.

  SP_RH_YR:
    style: simple
    type: Splice
    subtype: 2 to 1, Y/R
    notes: MAPPED 17 Aug 2026. The two Y/R leads from the switch housing join here and continue as a single Y/R to the 4P. This is the shared node - kill switch output and starter button input are the same net - and it is what carries the coil feed out of the branch. Confirms the topology the models already assumed.

  SP_RH_BR:
    style: simple
    type: Splice
    subtype: 1 to 3, Br
    notes: MAPPED 17 Aug 2026. Four legs - Bl/W IN from a fuse, then out to the kill switch (Br), and onward into the harness as Br and Br/W via the 4P. So the right bar is a DISTRIBUTION POINT fed from a fuse, not a set of taps hanging off a bus. Br/W's onward destination is still UNTRACED - it is a live fused circuit feeding something nobody has identified.

  RH_4P:
    type: Junction
    subtype: 4-pin connector, right bar
    pinlabels: [Br, Br/W, Y/R, BK]
    notes: Wire count now reconciles - 4 leads at the switch become 4 pins here plus one bullet. The two Y/R merge 2-to-1; the single Br expands to Br plus Br/W, with Bl/W leaving separately.

  RH_BLW:
    type: Bullet connector
    subtype: Bl/W, right bar
    pinlabels: [Bl/W]
    notes: THE FEED INTO THIS BRANCH, not a tap out - traced to a fuse 17 Aug 2026. Mates Bl/W to Bl/W across the bullet. Supersedes the accessory-lead guess, which was wrong about direction. Fused switched power arrives here, and the branch splice distributes it to the kill switch and out again as Br and Br/W.

  SOL:
    <<: *starter_relay

  SM:
    <<: *starter_motor

  ALT:
    <<: *alternator

  RR:
    <<: *regrec
    pinlabels: [AC1, AC2, DC OUT, GND]

  COIL_L:
    <<: *coil
    subtype: LEFT
  COIL_R:
    <<: *coil
    subtype: RIGHT

  PTS_L:
    <<: *points
    subtype: LEFT
  PTS_R:
    <<: *points
    subtype: RIGHT

  CAP_L:
    <<: *capacitor
    subtype: LEFT
  CAP_R:
    <<: *capacitor
    subtype: RIGHT

  NSW:
    <<: *neutral_switch

  IND_N:
    <<: *indicator
    subtype: neutral indicator, 12V 3.4W

  SP_BR:
    style: simple
    type: Splice
    subtype: brown switched bus
    notes: TBD - stock junction point for the switched brown feed not positively located on the scan. Modeled as a splice because the feed demonstrably serves more than one branch.

  SP_YR:
    style: simple
    type: Splice
    subtype: Y/R coil feed
    notes: The kill switch output feeds BOTH ignition coils and the starter button from this node. Killing the engine works by cutting coil power here.

  FLASHER:
    type: Turn signal relay
    subtype: 2-pin, thermal
    pinlabels: [Br IN, O OUT]
    notes: CONFIRMED 2-PIN off the diagram, 17 Aug 2026 - brown in, orange out, NO ground terminal. This is why an electronic 3-pin flasher needs a wire the stock harness does not have. A 2-wire series unit such as the motogadget mo.flash needs no ground and drops straight into this socket - see docs/part-selection.md.

  LH:
    <<: *lh_cluster
    pinlabels: [R/BK, Bl, R/Y, G, O, Gy, BK HORN]
    notes: See RH for the right-bar colour-change finding. Pins named by COLOUR, not function, because the dimmer common is still unresolved by meter. Do not infer that Bl is the feed from this drawing. Turn switch is known - R = O to Gy, L = G to O. The 6P carries G, O, Gy, Bl and two reds; the horn BK is separate.

  TAIL:
    <<: *taillight
    notes: CONFIRMED off the diagram 17 Aug 2026 - RED feeds the tail filament, BLUE the brake filament, BK/Y grounds. Blue brake circuit ties to the Bl/W found loose at the right cluster and the light blue lead on the front brake switch.

  SIG_FL: {<<: *signal_lamp, subtype: "front left, 12V 23W"}
  SIG_FR: {<<: *signal_lamp, subtype: "front right, 12V 23W"}
  SIG_RL: {<<: *signal_lamp, subtype: "rear left, 12V 23W"}
  SIG_RR: {<<: *signal_lamp, subtype: "rear right, 12V 23W"}

  IND_L: {<<: *indicator, subtype: "left turn indicator, 12V 3.4W"}
  IND_R: {<<: *indicator, subtype: "right turn indicator, 12V 3.4W"}

  FBRK:
    <<: *brake_switch
    subtype: front, at the lever perch
    pinlabels: [Br IN, Bl OUT]
    notes: CONFIRMED 17 Aug 2026 - NOT part of the right-bar switchgear branch. It has its own pair of bullet connectors, BLUE and BROWN. Consistent across three reads - the diagram shows a brownish and a light blue lead here, and blue feeds the brake filament at the tail lamp.
  RBRK:
    <<: *brake_switch
    subtype: rear, frame mounted
    pinlabels: [Br IN, Bl OUT]
    notes: TBD - not transcribed. Modeled in parallel with the front switch, and assumed Br in / Bl out to match it, because that is the only arrangement that lights the brake lamp from either control. Verify.

  SP_SIG_L:
    style: simple
    type: Splice
    subtype: left turn feed
  SP_SIG_R:
    style: simple
    type: Splice
    subtype: right turn feed
  SP_BRAKE:
    style: simple
    type: Splice
    subtype: brake lamp feed

cables:

  # --- heavy starter path -------------------------------------------
  W_BAT_SOL:  {<<: *w6, colors: [RD]}
  W_SOL_SM:   {<<: *w6, colors: [BK]}
  W_BAT_GND:  {<<: *w6, colors: [BKYE]}

  # --- main feed ----------------------------------------------------
  W_MAIN:     {<<: *w14, colors: [WH]}
  W_IGN_FEED: {<<: *w14, colors: [WH]}

  # --- switched brown bus -------------------------------------------
  W_BR_MAIN:  {<<: *w16, colors: [BN]}
  W_FUSE_A_IN: {<<: *w18, colors: [BN]}
  W_RH_IN:
    <<: *w18
    colors: [BUWH]
    notes: Fuse output to the right-bar branch. This is the FEED, traced 17 Aug 2026 - it is not a tap.

  # --- kill switch output: coils AND starter button -----------------
  W_YR_OUT:
    <<: *w16
    colors: [YERD]
    notes: THE critical stock detail. Kill switch output. Feeds the coil splice and, internally to the cluster, the starter button. Cutting this is how the engine stop switch stops the engine.
  W_COIL_L_FEED: {<<: *w16, colors: [YERD]}
  W_COIL_R_FEED: {<<: *w16, colors: [YERD]}

  # --- starter trigger ----------------------------------------------
  W_START:
    <<: *w18
    colors: [BK]
    notes: Starter button output to relay COIL+. BK but NOT a ground.
  W_SOL_GND:
    <<: *w18
    colors: [BK]
    notes: CONFIRMED direct to ground 15 Aug 2026. No neutral-switch interlock in this circuit.

  # --- points -------------------------------------------------------
  W_PTS_L:
    <<: *w18
    colors: [YE]
    notes: Yellow serves LEFT - confirmed from the stamped plate 15 Aug 2026 and corroborated by the diagram at the coil block. YE also carries the alternator phases.
  W_PTS_R:
    <<: *w18
    colors: [BK]
    notes: Black serves RIGHT - confirmed from the stamped plate 15 Aug 2026 and corroborated by the diagram at the coil block. BK also serves the starter trigger and the grounds.
  W_CAP_L: {<<: *w18, colors: [YE]}
  W_CAP_R: {<<: *w18, colors: [BK]}

  # --- charging -----------------------------------------------------
  W_ALT:    {<<: *w14, colors: [YE, YE]}
  W_RR_OUT:
    <<: *w14
    colors: [WH]
    notes: TBD - the DC output is modeled as returning to the battery stud. Where it physically lands in the stock harness is NOT confirmed off the scan.
  W_RR_GND: {<<: *w14, colors: [BK]}

  # --- neutral indicator --------------------------------------------
  W_IND_N_FEED:
    <<: *w18
    colors: [BN]
    notes: TBD - lamp feed assumed off the switched brown bus. Not confirmed.
  W_NSW:
    <<: *w18
    colors: [GN]
    notes: TBD colour. Stock is light green (LG), which WireViz cannot render distinctly from G. Do not read this as plain green.

  # --- right-bar branch internals, mapped by unsleeving 17 Aug -------
  W_RH_BR_SW:  {<<: *w18, colors: [BN]}
  W_RH_BR:     {<<: *w18, colors: [BN]}
  W_RH_BRW:
    <<: *w18
    colors: [BNWH]
    notes: Same net as the kill switch feed. Destination beyond the 4P not yet traced.
  W_RH_BLW:
    <<: *w18
    colors: [BUWH]
    notes: Same net as the kill switch feed, leaving on a bullet rather than the 4P. Destination not traced.
  W_RH_YR1:    {<<: *w18, colors: [YERD]}
  W_RH_YR2:    {<<: *w18, colors: [YERD]}
  W_RH_YR_OUT: {<<: *w18, colors: [YERD]}
  W_RH_BK:     {<<: *w18, colors: [BK]}

  # --- turn signals: O common from the flasher, G left / Gy right ----
  W_FLASH_IN:  {<<: *w18, colors: [BN]}
  W_FLASH_OUT: {<<: *w18, colors: [OG]}
  W_SIG_L:
    <<: *w18
    colors: [GN]
    notes: G feeds BOTH left lamps and the left indicator. Forced by wire count, not assumed - the switch has only two signal outputs for four lamps.
  W_SIG_R:  {<<: *w18, colors: [GY]}
  W_SIG_FL: {<<: *w18, colors: [GN]}
  W_SIG_RL: {<<: *w18, colors: [GN]}
  W_SIG_FR: {<<: *w18, colors: [GY]}
  W_SIG_RR: {<<: *w18, colors: [GY]}
  W_IND_L:  {<<: *w18, colors: [GN]}
  W_IND_R:  {<<: *w18, colors: [GY]}

  # --- tail / brake --------------------------------------------------
  W_TAIL:
    <<: *w18
    colors: [RD]
    notes: Tail filament feed off the ignition switch R pin. In ON it is fed through R/BK; in PARK straight off W. Preserve that.
  W_BRAKE:     {<<: *w18, colors: [BU]}
  W_BRK_FEED_F: {<<: *w18, colors: [BN]}
  W_BRK_FEED_R: {<<: *w18, colors: [BN]}
  W_BRK_OUT_F:  {<<: *w18, colors: [BU]}
  W_BRK_OUT_R:  {<<: *w18, colors: [BU]}

  # --- rear lamp grounds - all to the single BK/Y bus ----------------
  W_GND_TAIL:   {<<: *w18, colors: [BKYE]}
  W_GND_SIG_FL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_FR: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RL: {<<: *w18, colors: [BKYE]}
  W_GND_SIG_RR: {<<: *w18, colors: [BKYE]}
  W_GND_IND_L:  {<<: *w18, colors: [BKYE]}
  W_GND_IND_R:  {<<: *w18, colors: [BKYE]}

