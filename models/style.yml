# Shared drawing style, merged into every model.
#
# The fork has since transposed the connector/cable tables under
# options.rankdir: TB (pins on top/bottom edges, ports on the faces the graph
# flows through), which fixes the wires-through-nodes problem that forced the
# earlier revert to LR. TB turns the ~15:1 LR ribbon into roughly 2:1, which
# actually prints.
#
# ranksep/nodesep are now first-class options in the fork, replacing the raw
# GraphViz tweak that used to live here.

options:
  rankdir: TB
  ranksep: 1.2
  nodesep: 0.4
  # Straighten wire rows whose connection sets are written against pin order;
  # display order only, wire numbers/colors/BOM untouched.
  sort_wires: by_pin
  # Drop the redundant pinlabel from in-cable endpoint labels; the connector's
  # own pinlabel cell still shows it. Keeps dense cable nodes narrow.
  wirelabel_detail: pin
  # Label the dashed mate arrows (mate/into) so they read without a legend.
  mate_labels: true
  # Safety net for long notes: wrap at render time so a new single-line note
  # can never stretch its node full-width again. Existing literal-block notes
  # keep their author-typed breaks (treated as paragraph breaks); those stay
  # hand-wrapped because sub-100-column YAML is also nicer to edit.
  note_wrap: 100
  # routing: orthogonal is NOT enabled. The Manhattan look is right for a
  # schematic, but the router does one turn per wire and does not avoid node
  # boxes, so on the dense controls sheet the long vertical runs cut straight
  # through intermediate nodes and their note text -- the exact artifact that
  # forced the original revert to LR. Revisit when the fork's router learns
  # node avoidance (unstable-studios/WireViz issue pending).
