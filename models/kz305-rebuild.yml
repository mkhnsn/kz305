# =====================================================================
# KZ305-B1 — REPLACEMENT HARNESS, AS BUILT
#
#   ./render rebuild
#
# The harness fitted to the bike in October 2026. This file states the
# harness as it is; the design history, blockers and rejected
# alternatives that produced it are in archive/models-2026-10-26/ and
# in the closed issues.
#
# Every circuit in the factory model (models/factory/) is reproduced
# here, or deliberately not - see "NOT REPRODUCED" at the foot.
#
# ---------------------------------------------------------------------
# TO CONFIRM AGAINST THE BIKE - delete each line as it is checked
#
#   - HS_GND membership: which returns go through the headstock bullet
#     is drawn as everything in the headlight shell and the pod.
#   - Which of the three GND rings each return is crimped into.
#   - Whether W_RR_GND lands on the star point or at the engine.
#   - Where W_TDR_GND (the SAE return) lands now that MF_TDR is at
#     the solenoid stud.
#   - The connectors added at the coils and condensers: type, ways.
#   - The tail 6-way: housing type, and the tail-side wire colours.
#   - Which bullets are sealed, and with what.
#   - The LED headlight, flasher, USB charger and SAE socket parts.
#   - Whether a suppression diode was fitted across the SOL coil.
# ---------------------------------------------------------------------
#
# ---------------------------------------------------------------------
# DESIGN, IN BRIEF
#
#   CONNECTORS: HYBRID. Sealed 090 where exposed or run-critical -
#     charging, ignition, grounds, main power, starter, anything under
#     the tank or at the headstock. Bullets where the run is sheltered
#     and serviceable - inside the headlight shell, instrument lamps,
#     inside signal housings. Water in the sleeve killed the original,
#     so sealing follows exposure, not circuit importance.
#   LIGHTING: FULL LED. Polarity matters, so every lamp branch is drawn
#     with feed and ground identified. Fuses are sized for incandescent
#     so a filament lamp can go back in without touching a rating.
#   IGNITION: POINTS, EI-READY. Stock circuit unchanged; SP_YR stays an
#     accessible tap so an EI module is a plug-in later.
#   REGULATOR: Shindengen SH775, series type. DC runs direct to the
#     battery, fused at the battery end.
#   RELAYS: five, all in the PDM - K_MAIN, K_COIL, K_HORN, K_HI, K_LO.
#     Anything that used to run through switch contacts directly now
#     drives a coil instead. The case is the contacts, not the load:
#     every cluster contact on this bike measured 3-5 ohm, and a relay
#     coil at ~0.1A does not care.
#   FUSING: eleven MiniVal positions in the PDM, split HOT / SWITCHED -
#     see the PDM notes. Main, charging and tender fuses are ATC in
#     sealed MP630 holders outside it.
#   GROUNDS: battery negative runs 6 AWG direct to the engine block.
#     The block is bonded to the frame and feeds a 12 AWG run up to a
#     STAR POINT under the tank, near the coils, where every other
#     return lands - three ring terminals under one bolt, several
#     wires crimped into each. The frame is powder coated, so nothing
#     earths through its mounting.
#   COLOUR SCHEME: by role, not by stock colour.
#     RD always-hot    BG switched power    GY relay coil drive / signal
#     YE ignition      BU lamp feed         GN lamp feed / left
#     WH main feed     BK ground, and NOTHING ELSE
# ---------------------------------------------------------------------

connectors:

  BATT:
    <<: *battery

  GND:
    type: Star ground point
    subtype: under the tank near the coils - three ring terminals under one bolt
    pinlabels: [STAR]
    notes: |-
      THE HARNESS STAR POINT. Three ring terminals under one bolt, several wires crimped into each
      ring. Every signal return in the harness lands here, and so does W_ENG_GND, the 12 AWG run
      down to the engine block that is this node's path to the battery negative.
      It branches off the trunk about 60 mm datum-side of the LH 8-way branch.
      THE CRANKING RETURN IS NOT HERE. The battery negative runs 6 AWG straight to the engine block
      - see GND_ENG - so this bolt sees the lamp, relay and charging returns only.
      Acceptance to the battery negative post is 0.0-0.1 ohm REL-zeroed on a Fluke 87V - pass/fail.

  MF:
    <<: *main_fuse
    subtype: 20A ATC, Metri-Pack 630 sealed pull-to-seat holder
    mpn: MP630 1214 ATC Set
    additional_components:
      - type: Fuse
        subtype: ATC / ATO regular blade, 20A yellow - NOT MiniVal
        qty: 1
    notes: |-
      Main fuse. W_MAIN_IN 12 AWG in, W_MAIN_OUT 14 AWG out, both in the terminal's 12-14 AWG band.
      ⚠️ ATC (REGULAR BLADE), NOT MiniVal. The PDM is MiniVal throughout, so the bike carries two
      fuse form factors. Spares: 20A and 30A ATC, separate from the MiniVal kit.
      ⚠️ PULL-TO-SEAT: the wire threads through seal and housing before it is crimped. Seal first,
      label first, crimp last. A crimped terminal will not pass back through.
      THIS FUSE PROTECTS THE 14 AWG MAIN FEED, NOT THE LOADS - every circuit downstream has its own
      fuse. 20A is the wire's rating; going up means W_MAIN_OUT to 12 AWG first.
      Worst realistic sustained load on filament lamps is about 16-17A, and about 12-13A on LED.

  PDM:
    type: Power distribution module
    subtype: Sealed modular, 60 cavities on the 280 footprint
    manufacturer: MTA
    mpn: "0301370"
    additional_components:
      - type: Top cover
        manufacturer: MTA
        mpn: "0301371"
        qty: 1
      - type: Secondary lock
        subtype: SIX PER MODULE, not one
        manufacturer: MTA
        mpn: "0301372"
        qty: 6
      - type: Mounting leg - male
        subtype: 2 pcs reqd per module
        manufacturer: MTA
        mpn: "0300690"
        qty: 2
      - type: Mounting leg - female
        subtype: 2 pcs reqd per module
        manufacturer: MTA
        mpn: "0300691"
        qty: 2
      # 42 wire-ends enter the module: 11 fuses x 2 + 5 relays x 4. One
      # terminal and one seal per wire - a relay pin is a cavity a
      # terminated wire enters from below, exactly like a fuse leg.
      # Gauge split: 16 AWG x41, 14 AWG x1 (W_MAIN_SW_FEED to K_MAIN's 30).
      - type: Terminal
        subtype: Sealed 2.8mm, 1.0-2.0 sq mm (18-16 AWG) - 41x 16 AWG
        manufacturer: MTA
        mpn: 1708338-L
        qty: 41
      - type: Terminal
        subtype: Sealed 2.8mm, 2.5-4.0 sq mm (14-12 AWG) - W_MAIN_SW_FEED only
        manufacturer: MTA
        mpn: 1708339-L
        qty: 1
      # 60 cavities less the 42 populated. The module seals at the wire-entry
      # face, so every unwired cavity needs a plug or the module is not sealed.
      - type: Cavity plug
        subtype: 2.8mm black - 60 cavities less 42 wired. REQUIRED or the module is not sealed
        manufacturer: MTA
        mpn: "4550750"
        qty: 18
      # Both 16 and 14 AWG TXL take the green seal. No 18 AWG in the harness.
      - type: Wire seal - red
        subtype: NOT USED - no 18 AWG in the harness
        manufacturer: MTA
        mpn: "4550748"
        qty: 0
      - type: Wire seal - green
        subtype: 2.8mm, insul dia 2.2-3.0mm - for 16 AWG TXL (2.26mm) and 14 AWG TXL (2.59mm)
        manufacturer: MTA
        mpn: "4550747"
        qty: 42
    # ⚠️ WAYS ARE APPENDED, NEVER INSERTED. Connection sets reference this
    # connector BY INDEX, so inserting a way silently repoints every
    # reference after it. This list is ALLOCATION order, not physical
    # cavity order; the physical cavity map is docs/pdm-cavity-map.md.
    pinlabels: [MAIN STUD - VESTIGIAL, F1 OUT, F2 OUT, F3 OUT, F4 OUT, F5 OUT, F6 OUT, SW IN - VESTIGIAL, SW OUT - VESTIGIAL, SW AUX - VESTIGIAL, F7 OUT, F8 OUT, F9 OUT, F1 IN (HOT), F4 IN (HOT), F5 IN (HOT), F2 IN (SW), F3 IN (SW), F6 IN (SW), F7 IN (SW), F8 IN (SW), F9 IN (SW), F10 OUT, F10 IN (SW), F11 OUT, F11 IN (SW)]
    notes: |-
      Replaces the stock 20A main plus two 10A glass fuses and their fixed pigtail. The pin list is
      the CIRCUIT LIST in a stable order; the physical cavity map is docs/pdm-cavity-map.md.
      MTA 0301370: 60 sealed 2.8mm cavities taking MiniVal fuses or micro 280 relays in any mix. It
      has NO INTERNAL BUSBAR - every cavity is wired separately, so the hot and switched feed
      junctions are crimped splices OUTSIDE the module: SP_HOT and SP_SW.
      ONE WIRE PER CAVITY. A sealed cavity takes one seal on one wire. Do not daisy-chain.
      HOT and SWITCHED positions sit at OPPOSITE ENDS of the block, so a mis-landed feed wire cannot
      put a switched fuse on permanent power.
      ** THE HOT / SWITCHED SPLIT **
        HOT  - fed from SP_HOT, live whenever the battery is:
          F1 IGN SW FEED  - feeds the switch that drives K_MAIN
          F4 HORN PWR     - K_HORN's 30; the coil is switched, so the horn is still dead key-out
          F5 HEADLAMP PWR - K_HI and K_LO commons, same arrangement
        SW   - fed from SP_SW, downstream of K_MAIN, dead with the key out:
          F2 KILL FEED, F3 COIL PWR, F6 TAIL/PARK, F7 INSTR, F8 BRAKE, F9 SIGNAL, F10 USB,
          F11 RELAY COILS
      ** F3 IS NOT NEGOTIABLE. ** If it were hot and K_COIL's contact welded, the engine would keep
      running with the key out and the kill switch would have no effect, because the kill switch
      only drives that coil.
      A welded K_HORN leaves the horn sounding and a welded K_HI or K_LO leaves that beam lit, and
      the key does not clear either because F4 and F5 are hot. A relay welds at the moment it
      switches, so the rider is there. THE REMEDY IS TO PULL THE STUCK RELAY AND FIT THE SPARE - not
      to pull F4 or F5, which takes both beams. Carry a spare relay.
      K_MAIN and K_COIL both welded leaves no electrical way to stop the engine short of pulling F3.
      The pre-ride stop check in docs/pre-ride-check.md catches a latent weld in either one.
      ** FUSE RATINGS, SIZED FOR INCANDESCENT ** so a filament lamp can go back in:
        F1   5A   ign switch feed - K_MAIN coil, plus the tail lamp in PARK
        F2   5A   kill switch feed - K_COIL coil only
        F3  10A   both ignition coils, ~6A on points
        F4  10A   horn, 2A nominal plus inrush
        F5  15A   headlamp - both beams lit during the dimmer's make-before-break blip
        F6   5A   tail / park
        F7   5A   instruments
        F8  7.5A  brake
        F9  10A   signals
        F10 7.5A  USB-C PD, ~4.4A at 45W plus capacitive inrush
        F11  5A   relay coil supply, ~0.45A worst case
      MiniVal part numbers are in docs/part-selection.md.
      ** RELAYS: ALL FIVE ARE 4-WAY MICRO 280 AND SEAT IN THE MODULE. ** 30 and 87 are one diagonal,
      85 and 86 the other, so a relay fitted 180 degrees round lands contact-to-contact and
      coil-to-coil and simply works. That is what makes the -R1 resistor type load-bearing: a -D1
      diode relay fitted backwards is a dead short across the coil. Before fitting any relay, read
      its coil with a DMM both ways round - a resistor reads the same both ways, a diode does not.
      Anything asymmetric does not go in.

  SP_HOT:
    style: simple
    type: Splice
    subtype: always-hot bus - 1 in, 4 out
    notes: |-
      The hot feed junction, outside the module because the module has no busbar. FIVE CONDUCTORS:
      W_MAIN_OUT in from the 20A fuse, then W_MAIN_SW_FEED to K_MAIN's 30 and the F1, F4 and F5
      inputs. One crimped parallel splice, Molex Versakrimp 19205-0004, 8 GA, under adhesive
      heat-shrink. The highest-current node in the harness, about 16A.
      A CRIMP, NOT A CONNECTOR. A crimp has zero mated interfaces; the old harness failed at a
      separable bullet with a gauge step in it, on exactly this path.
      MEMBERSHIP IS FIXED IN COPPER. A sixth hot circuit does not join this crimp.
  SP_SW:
    style: simple
    type: Splice
    subtype: switched bus - 1 in, 8 out - FUSE INPUTS ONLY
    notes: |-
      The switched feed junction. K_MAIN's 87 feeds it on W_SW_BUS and eight branches leave - the
      F2, F3, F6, F7, F8, F9, F10 and F11 inputs. Nine conductors in one parallel splice, crimped
      then flooded with solder, under adhesive heat-shrink that runs past the stiff section, and
      tied so the bundle cannot flex there.
      IT FEEDS FUSE INPUTS AND NOTHING ELSE. Anything tapped straight off it would be protected by
      nothing smaller than MF. A tenth switched circuit shares an existing fuse or the node is cut
      and rebuilt.
      Carries the whole switched load through its first segment - about 12A sustained on filament
      lamps with USB at 45W, about 11A on LED.

  MF_RR:
    type: Charging fuse
    subtype: 30A ATC, Metri-Pack 630 sealed pull-to-seat holder - AT THE BATTERY END
    mpn: MP630 1214 ATC Set
    pinlabels: [IN, OUT]
    additional_components:
      - type: Fuse
        subtype: ATC / ATO regular blade, 30A green - NOT MiniVal
        qty: 1
    notes: |-
      Fuses the charging output, which stock fused nowhere. It protects the 12 AWG pair, not the
      regulator. Its IN side lands on the SOLENOID'S BATTERY STUD, one 6 AWG lug from the battery
      positive, so the whole run is covered.
      30A on a working stator figure of 20A: above normal charging, below the SH775's 35A. Size up
      only if the charging test says so - target 14.0-14.5V at 3-5k rpm.

  IGN:
    <<: *ign_switch

  # THREE WAYS AGAINST THE FACTORY 4P's FOUR. Br/W is gone because both brake switches are fed from
  # PDM F8, and Bl/W is gone because the headlight is fed from F5. The cluster's two Y/R leads still
  # merge at the stock 2-to-1 splice on the cluster side.
  RH:
    <<: *rh_cluster
    pinlabels: [START OUT (BK), STOP IN (Br), LINK (Y/R)]
    notes: |-
      ⚠️ CAVITY ORDER IS BK, Br, Y/R - READ OFF THE PART AT THE BENCH, and it is NOT the order the
      design assumed (Br, Y/R, BK). The harness side was first pinned to the assumed order and the
      bike died the moment the starter button was released: the F2 feed had landed on the BUTTON
      OUTPUT, so the kill switch and K_COIL were only live while the button bridged it. Re-pinned
      to the order above: feed into STOP IN, K_COIL off LINK, the starter trigger off START OUT.
      The circuit is the one designed; only the cavity numbers moved.

  SOL:
    type: Starter relay
    subtype: Cyleto, Kawasaki KLF220 Bayou pattern - two M6 studs, 2-pin coil plug. Integral fuse holder removed
    pinlabels: [BAT STUD, MOTOR STUD, COIL+, COIL-]
    notes: |-
      REPLACES THE STOCK RELAY. Honda/Kawasaki-pattern solenoid with two studs and a 2-pin coil
      plug. The coil floats: COIL+ is driven by the starter button off START OUT, COIL- returns to
      the star point on W_SOL_GND.
      THE INTEGRAL FUSE HOLDER IS REMOVED - MF is the main fuse. The relay's fused output terminal
      is not used.
      THE BATTERY STUD IS THE HOT DISTRIBUTION POINT: W_BAT_SOL's 6 AWG lug plus the three 12 AWG
      rings feeding MF, MF_RR and MF_TDR.
  SM:
    <<: *starter_motor
  ALT:
    <<: *alternator
    notes: |-
      The stator's two fixed leads were EXTENDED at the bench so they clear the chaincase, and end
      at ALT_SVC. The extended leads are drawn as W_STATOR_A/B - not harness wire.
  ALT_SVC:
    type: Service disconnect
    subtype: Deutsch DT 2-way, inline - stator jumper harness
    pinlabels: [PHASE A, PHASE B]
    notes: |-
      THE STATOR JUMPER. From here 12 AWG yellow runs straight to the regulator's AC housing. The
      jumper is a separate short harness zip-tied to the main loom for retention only; it does not
      enter the sleeve. Both legs are AC and interchangeable, so there is nothing to get backwards.
  FRAME:
    type: Frame bond
    subtype: jumper from the engine block ground point
    pinlabels: [BOND]
    notes: The frame is powder coated. This bond exists so the frame is not floating; nothing in the harness returns through it.
  HS_GND:
    type: Headstock ground
    subtype: bullet disconnect - front returns, one lead back to the star point
    pinlabels: [GND]
    notes: |-
      The returns from the headlight shell and the pod collect here and go back to the star point
      on one wire, W_HS_GND, through a bullet so the front end can be unplugged.
  TAIL_6P:
    type: Junction
    subtype: 6-way connector at the tail - mates the tail-end lighting harness
    pinlabels: [L TURN, R TURN, BRAKE, RUNNING, GND, SPARE]
    notes: |-
      The main harness ends here at the rear. The tail lamp and both rear signals hang off a
      separate tail-end harness that plugs into this. Way 6 is blank.
  SP_TAIL_GND:
    style: simple
    type: Splice
    subtype: tail-end harness ground - 1 to 3
    notes: On the tail-end harness side of TAIL_6P. One ground way in, three lamp returns out.
  RR:
    type: Regulator / rectifier
    subtype: 3-phase 35A SERIES type - see docs/part-selection.md
    manufacturer: Shindengen
    mpn: SH775
    pn: "4012941"
    pinlabels: [AC1, AC2, AC3, DC+, GND]
    additional_components:
      - type: Connector kit
        subtype: Cycle Terminal SH775 kit - Furukawa QLW 250 housings, terminals and seals, AC (grey) and DC (black)
        qty: 1
      - type: Cavity plug
        subtype: seals the unterminated AC3 - from the kit
        qty_multiplier: unpopulated
        qty: 1
    notes: |-
      A SERIES regulator: it open-circuits the stator rather than shorting it, so regulator and
      stator both run cooler. Polaris ORV takeoff.
      The alternator is single-phase; it connects to ANY TWO of the three AC inputs. AC3 is
      unterminated and plugged. The AC pair arrives on its own jumper harness - see ALT_SVC.
      Mated with the Cycle Terminal kit, Furukawa QLW 250: grey housing AC, black housing DC.
      DC+ runs heavy and direct to the battery with MF_RR at the battery end - see W_RR_OUT.
      Mounted where the old battery box was, in the fabricated box with the PDM and the ATZ-7.
      Check body temperature on the first run - it sits beside a lithium battery.
      Target 14.0-14.5V at 3-5k rpm. Never disconnect with the ignition on, and never disconnect
      the battery while running.

  K_MAIN:
    type: Relay
    subtype: Song Chuan 303-1AH-C-R1, Ultra Micro 280, 20A - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      Song Chuan 303-1AH-C-R1, Ultra Micro 280, SPNO, 20A, sold by Cycle Terminal as SCMR20. The
      -R1 suffix is the RESISTOR suppression variant, 1.1k across the coil, no polarity constraint -
      see the PDM notes for why that matters. Coil 91 mA.
      Keeps the whole switched load out of the ignition switch, which now drives this coil only.
      The heaviest-loaded relay, about 12A sustained on filament lamps; the lamp rating is 16A
      steady. Fails safe: open = bike dead.
      Do not load any relay toward 20A without 12 AWG wire, which also needs the grey seal.

  K_COIL:
    type: Relay
    subtype: Song Chuan 303-1AH-C-R1, Ultra Micro 280, 20A - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      Keeps coil current out of the kill switch, which drives this coil instead of passing ~6A
      through 44-year-old contacts. If it fails there is no spark. Fails safe: open = engine stops.

  K_HORN:
    type: Relay
    subtype: Song Chuan 303-1AH-C-R1, Ultra Micro 280, 20A - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      Keeps horn current out of the left cluster. Stock switched the horn's RETURN through the
      button, so this relay drops into that shape: 86 takes switched supply from SP_RLY, the button
      pulls 85 to ground, the contacts pass horn current. Behaviour at the bar is unchanged.

  K_HI:
    type: Relay
    subtype: Song Chuan 303-1AH-C-R1, Ultra Micro 280, 20A - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      High beam. See K_LO for the pair's notes; they are one decision, not two.

  K_LO:
    type: Relay
    subtype: Song Chuan 303-1AH-C-R1, Ultra Micro 280, 20A - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      Low beam. TWO RELAYS RATHER THAN A CHANGEOVER: the dimmer SELECTS between beams instead of
      switching one, so a single NO relay cannot do it.
      THE DIMMER WIPER IS MAKE-BEFORE-BREAK: both coils energise together for the instant of the
      change, so BOTH BEAMS MAY BE LIT FOR A FRACTION OF A SECOND and F5, SP_HEAD and W_HEAD_SUPPLY
      are sized for both at once.
      Bl is the dimmer's common and supply. The dimmer now steers relay coils instead of passing
      the lamp load through the bar contacts.

  LH:
    <<: *lh_cluster
    pinlabels: [Bl COMMON, R/BK HI, R/Y LO, O TURN FEED, G LEFT, Gy RIGHT, BK HORN, GND]
    notes: |-
      8-WAY SEALED 090, both halves ours. The stock housing was cut off the retained cluster
      pigtail and the new housing fitted to each end. 7 cluster conductors + 1 new earth lead = 8.
      WAY 8 IS A NEW CLUSTER-SIDE LEAD. Stock, the horn button earthed through the cluster body to
      the bar and frame; the powder coat removes the frame end. The cluster side of way 8 is a
      short BK lead to a ring terminal and star washer under one of the cluster's own screws. It
      carries K_HORN's coil return only, about 0.09A.
      ⚠️ THE WAY NUMBERS HERE ARE THE REBUILD'S, NOT THE FACTORY MODEL'S. The housing is a new part
      and its numbering is ours; it does not match models/factory/lighting.yml's LH. Cross-refer by
      the LABEL - Bl COMMON, G LEFT - never by way number.

  USB:
    type: USB-C PD charger
    subtype: 12V in - part not selected
    pinlabels: ["+12V", GND]
    notes: |-
      Replaces the stock accessory provision, which was a permanently live, unfused feed with no
      return. None of that is reproduced.
      SWITCHED, fed from F10, so it dies with the key. This bike has no parasitic load at all - points
      ignition, no ECU, no clock - and a phone left plugged in overnight on a hot socket would run
      the ATZ-7 down to its cut-off. Making it hot is a one-wire change at the PDM if ever wanted.
      ITS OWN FUSE. A USB socket is the circuit most likely to meet a failed cable or an unknown
      device, and that must not take the instruments with it.
      The unit's input current sizes F10 - roughly output watts over 12V times efficiency, so a 45W
      unit draws about 4.4A in. F10 is sized for inrush as well as steady draw.
  MF_TDR:
    type: Tender fuse
    subtype: 10A ATC, Metri-Pack 630 sealed pull-to-seat holder - AT THE BATTERY END
    mpn: MP630 1214 ATC Set
    pinlabels: [IN, OUT]
    additional_components:
      - type: Fuse
        subtype: ATC / ATO regular blade, 10A red - NOT MiniVal
        qty: 1
    notes: |-
      Fuses the battery tender / 12V accessory lead. Third MP630 holder on the bike, same seal,
      terminal and pull-to-seat discipline as MF and MF_RR.
      Its IN side lands on the SOLENOID'S BATTERY STUD beside MF and MF_RR, so the only unfused
      length is W_TDR_HOT from the stud to this holder.
      10A ATC: sized to the SAE contacts, the weakest thing in the circuit. A tender draws 0.75-5A;
      10A leaves about 120W for an accessory. Carry a spare 10A ATC - the PDM spares are MiniVal.
      NOT THROUGH THE PDM, so a tender can charge the battery with MF pulled or the harness off the
      bike, which is exactly when it is wanted.

  SAE:
    type: SAE socket
    subtype: 2-pin, capped, 12 AWG pigtail - part not selected
    pinlabels: ["+12V", GND]
    notes: |-
      The battery tender and 12V accessory point. ALWAYS HOT, AND MEANT TO BE - the one always-live
      outlet on the bike. The USB charger stays switched because a socket someone can leave a phone
      in must die with the key; an SAE socket only feeds what is deliberately plugged into it.
      Built into the harness: fused in MF_TDR, both post rings 1/4 inch for the M6 posts, printed
      labels, dressed into the loom with the charging pair and capped where it can be reached
      without lifting the seat.
      The socket's own 12 AWG leads are W_TDR_SAE and W_TDR_GND - existing conductors, not harness
      wire. The RD lead is pulled to seat in MF_TDR; the BK lead is re-terminated with our ring at
      the negative post. The pigtail is UNFUSED - the fuse lives in MF_TDR.
      BATTERY POSTS carry the 6 AWG lugs only. The three 12 AWG fuse feeds - W_MAIN_IN,
      W_RR_BATT, W_TDR_HOT - all ring onto the SOLENOID'S BATTERY STUD instead. Heavy lug against
      the stud, then the rings, one nut.
      ⚠️ THE BATTERY IS LITHIUM (Antigravity ATZ-7 RE-START) - ONLY A LITHIUM-MODE CHARGER GOES ON
      THIS SOCKET. A lead-acid tender's desulfation or pulse mode, or a float above about 13.6V,
      damages it. Antigravity's own charger or any unit with a stated LiFePO4 mode.

  HORN:
    type: Horn
    subtype: 12V 2A
    pinlabels: [FEED, GND]
    notes: |-
      ⚠️ WAY 2 IS GND HERE, NOT SW as in the factory model. Stock switched the horn's RETURN through
      the left cluster; the rebuild moves that switching to K_HORN's coil side, so this terminal is
      a permanent return to the star point.

  HEAD:
    type: Headlight
    subtype: LED - part not selected
    pinlabels: [HI, LO, GND]
    notes: |-
      LED, so polarity matters: feed and ground are as drawn. Its measured draw sizes F5; stock was
      4.2A per filament beam.

  FLASHER:
    type: Turn signal flasher
    subtype: load-independent solid-state, 3-pin - on bullets
    pinlabels: [B+, LOAD, GND]
    notes: |-
      LOAD-INDEPENDENT solid-state, because LED lamps make a thermal flasher flash far too fast or
      not at all. Wide current range so it would still drive filament on a revert, and with
      reverse-polarity protection.
      THREE PIN, with a dedicated ground wire drawn whether the chosen part needs it or not, so
      3-pin parts stay on the table.
      This bike has SEPARATE left and right dash indicators, so there is no shared-indicator
      backfeed to worry about.

  SIG_FL: {<<: *signal_lamp, subtype: "front left - LED"}
  SIG_FR: {<<: *signal_lamp, subtype: "front right - LED"}
  SIG_RL: {<<: *signal_lamp, subtype: "rear left - LED"}
  SIG_RR: {<<: *signal_lamp, subtype: "rear right - LED"}
  IND_L: {<<: *indicator, subtype: "left turn indicator - LED"}
  IND_R: {<<: *indicator, subtype: "right turn indicator - LED"}

  SP_SIG_L:
    style: simple
    type: Splice
    subtype: left turn net - 1 to 3
    notes: One switch output feeds the front lamp, the rear lamp and the dash indicator. Same on the right.
  SP_SIG_R:
    style: simple
    type: Splice
    subtype: right turn net - 1 to 3

  TAIL:
    <<: *taillight
    subtype: tail / brake - LED
    notes: |-
      Dual intensity: TAIL lights continuously and BRAKE on top of it, driven simultaneously, as
      stock. No license lamp on the US/Canada bike; this lamp lights the plate.

  FBRK:
    <<: *brake_switch
    subtype: front, at the lever perch
    pinlabels: [FEED, OUT]
    notes: RETAINED STOCK PART, on its own pair of bullets. Ways renamed from the factory model's colour labels - the rebuild's colours are different.
  RBRK:
    <<: *brake_switch
    subtype: rear, frame mounted - on bullets
    pinlabels: [FEED, OUT]
    notes: RETAINED STOCK PART, in parallel with the front switch. Mates on bullets.

  SP_BRK_FEED:
    style: simple
    type: Splice
    subtype: brake switch feed - 1 to 2
    notes: |-
      Both brake switches fed from F8, the brake circuit's OWN fuse. Stock fed them upstream of
      the tail fuse, so the brake lamp was protected by nothing smaller than the 20A main, and one
      blown fuse took tail and brake together.

  SP_BRAKE:
    style: simple
    type: Splice
    subtype: brake lamp feed - two switches, one lamp
    notes: Front and rear switches are in parallel; either one lights the lamp.

  INSTR_6P:
    <<: *junction6p
    subtype: 6P connector, instrument pod
    pinlabels: [L TURN, R TURN, NEUTRAL FEED, NEUTRAL SW, HIGH BEAM, POD GND]
    notes: |-
      6-WAY SEALED 090, both halves ours. The stock housing was cut off the retained pod pigtail
      and the new housing fitted to each end.
      THE NUMBERING IS THE STOCK CAVITY ORDER - 3 rows of 2, mating face, keyway up, top row
      first; harness side FEMALE. Kept by choice so the bench record of where the pod's own leads
      land still reads.
      All six ways carry a circuit.

  IND_N:
    <<: *indicator
    subtype: neutral indicator - LED
  IND_HB:
    <<: *indicator
    subtype: high-beam indicator - LED
  LAMP_SPD:
    <<: *indicator
    subtype: speedometer light - LED, on bullets
  LAMP_TAC:
    <<: *indicator
    subtype: tachometer light - LED, on bullets

  NSW:
    <<: *neutral_switch

  GND_ENG:
    type: Engine ground point
    subtype: block - battery negative lands here
    pinlabels: [STUD]
    notes: |-
      THE BATTERY NEGATIVE LANDS HERE, 6 AWG, DIRECT. The starter motor grounds through its case
      into the engine, so this is the cranking return - well over 100A - and it never goes near
      the harness star point.
      From this stud: a jumper to the frame (FRAME), and W_ENG_GND, 12 AWG, up to the star point
      under the tank. That 12 AWG run is the whole harness's path to the battery negative.
      It is also the neutral switch's only return: NSW earths through the engine case.

  SP_HI:
    style: simple
    type: Splice
    subtype: high-beam net - lamp plus indicator
    notes: The HI output feeds the headlight AND the dash indicator, so the indicator follows the beam rather than the switch. Same shape as stock.

  SP_TAIL:
    style: simple
    type: Splice
    subtype: tail / park net
    notes: |-
      THIS IS WHAT PRESERVES PARK. Fed from IGN way 2, which the switch puts on battery in PARK and
      on the fused tail feed in ON. So the tail lights in PARK with everything else dead, as stock.
      THE TAIL LAMP ONLY. The meter lamps are switched and hang on SP_MTR.

  SP_MTR:
    style: simple
    type: Splice
    subtype: meter lamp feed - 1 to 2
    notes: |-
      The meter lamps are SWITCHED, not park-fed - as stock, where they died with the key.

  SP_RLY:
    style: simple
    type: Splice
    subtype: relay coil supply - F11 out, 1 to 2
    notes: |-
      Fused supply for the K_HORN coil and the dimmer common. One fuse for both: they are one
      functional group, and F11 opening drops both beams exactly as F5 would, so splitting them
      buys nothing. About 0.45A worst case - three coils live for the instant of the dimmer blip.
      The dimmer common runs up to the handlebar, the longest and most-flexed run on the bike,
      which is why it is behind a 5A fuse and not the 20A main.

  SP_INSTR:
    style: simple
    type: Splice
    subtype: instrument feed - 1 to 2
    notes: |-
      F7 feeds both the meter lamps and the neutral lamp. One wire leaves the cavity and splits
      here - one wire per cavity. Load is three LED lamps.

  SP_POD_GND:
    style: simple
    type: Splice
    subtype: pod common ground bus - 1 to 3
    notes: |-
      RETAINED - this splice is inside the pod PIGTAIL, which survives. Three indicator returns onto
      one conductor, out through way 6 to the headstock ground.

  COIL_L:
    <<: *coil
    subtype: LEFT
    notes: A connector was added at the coil during the build so it can be unhooked - type and way count not yet recorded.
  COIL_R:
    <<: *coil
    subtype: RIGHT
    notes: A connector was added at the coil during the build - see COIL_L.
  PTS_L:
    <<: *points
    subtype: LEFT
  PTS_R:
    <<: *points
    subtype: RIGHT
  CAP_L:
    <<: *capacitor
    subtype: LEFT - STOCK PART
    notes: |-
      ONE PART, NOT TWO: a single bracket carrying two cans, with a shared two-wire pigtail about 8
      inches long - YELLOW and BLUE, each ending in a male bullet. 0.24 uF, 1000 V DC, parallel
      across the points. Drawn as two connectors because they are electrically independent; ONE
      line in the BOM.
      IT EARTHED THROUGH ITS MOUNTING TABS TO THE FRAME, AND THAT PATH IS GONE under the powder
      coat. So it gets a ground wire, W_CAP_GND: a ring terminal under one of the two mounting
      bolts, to the star point. One tab is enough - both cans share the bracket, so the bracket is the node.
      This is an ignition earth: a points ignition with no condenser return burns its contacts.
      THESE LEADS ARE NOT HARNESS WIRE - a factory pigtail on a retained part. Not cut, not
      labelled, not in the wire order.
      A connector was added here during the build so the condensers can be unhooked - type and
      way count not yet recorded.
  CAP_R:
    <<: *capacitor
    subtype: RIGHT - STOCK PART
    notes: Stock part, parallel across the right points. Same as CAP_L - factory pigtail, not harness wire.

  SP_HEAD:
    style: simple
    type: Splice
    subtype: headlamp supply - feeds both beam relay commons
    notes: |-
      One fused feed, two relay commons. The make-before-break blip puts both beams on this node at
      once, so it and F5 are sized for both.

  SP_YR:
    style: simple
    type: Splice
    subtype: Y/R coil feed - EI TAP POINT
    notes: |-
      Factory topology preserved - the kill switch output feeds both coils here, which is what makes
      the engine stop switch stop the engine. Keep this splice ACCESSIBLE: it is the plug-in point
      for an EI module later. Stock had it as a double-female bullet at 460 mm along the trunk, and
      a bullet node is a reasonable form to reproduce - it needs no tools to open.

cables:
  # ignore_in_bom: true marks a conductor that ALREADY EXISTS in a retained stock part - the pod
  # pigtail, the condenser pigtail, the braided points leads, the SAE pigtail. It is drawn because
  # the electrical path is real, but it is not cut, labelled or ordered. The BOM and
  # tools/label_schedule.py both skip it. The PDM feed jumpers are NOT flagged: they are real wire.

  W_BAT_SOL:  {<<: *w6,  colors: [RD]}
  W_SOL_SM:   {<<: *w6,  colors: [RD]}
  W_BAT_GND:
    <<: *w6
    colors: [BK]
    notes: Battery negative straight to the engine block - the cranking return. Plain black; the stock harness had both Y/BK and BK/Y on two different ground nets.
  W_MAIN_IN:
    <<: *w12
    colors: [RD]
    notes: Battery / starter relay stud to the main fuse. 12 AWG - the shortest, highest-current feed on the bike. Does not enter the PDM.
  W_MAIN_OUT:
    <<: *w14
    colors: [WH]
    notes: |-
      Main fuse to SP_HOT. The stock harness melted at a bullet on this circuit, where the conductor
      size stepped at a separable joint. So: no gauge change at a connector on the main power path,
      and no bullet carrying it. One gauge from the fuse to the crimp.
  W_IGN_FEED: {<<: *w16, colors: [RD]}
  W_IGN_RET:
    <<: *w16
    colors: [GY]
    notes: Ignition switch output (IGN:3, ON) - drives the K_MAIN coil only. Not on the PARK path - PARK is IGN:1 to IGN:2, so the tail lamp in PARK is carried by W_IGN_FEED under F1.

  W_RH_IN:
    <<: *w16
    colors: [YE]
    notes: Fed from PDM F2. Runs the kill switch and, through it, two relay coils.
  W_YR_TRIG:
    <<: *w16
    colors: [GY]
    notes: |-
      Kill switch output. Drives K_COIL and, internally to the cluster, the starter button. About
      0.3A instead of the stock ~6A. Still the node that makes the kill switch stop the engine.
  W_MAIN_SW_FEED:
    <<: *w14
    colors: [WH]
    notes: SP_HOT to K_MAIN's common. The one 14 AWG leg into the PDM. Protected by the 20A main; individual circuits are fused downstream of the relay.
  W_SW_BUS:
    <<: *w16
    colors: [BG]
    notes: |-
      K_MAIN's 87 to SP_SW - the switched bus. Horn and headlamp are fed hot and never cross it;
      everything else switched does. About 12A sustained on filament lamps, 11A on LED. A short run
      in 125C TXL. If it ever needs to carry more, split the switched load rather than thicken it.
  # --- the two feed-side buses, outside the module - see SP_HOT / SP_SW ---
  W_HOT_F1:  {<<: *w16, colors: [RD], notes: "Hot bus to the F1 cavity. RD - always-hot per the scheme."}
  W_HOT_F4:  {<<: *w16, colors: [RD], notes: "Hot bus to the F4 cavity."}
  W_HOT_F5:  {<<: *w16, colors: [RD], notes: "Hot bus to the F5 cavity."}
  W_SW_F2:   {<<: *w16, colors: [BG], notes: "Switched bus to the F2 cavity. BG, tan - switched power."}
  W_SW_F3:   {<<: *w16, colors: [BG], notes: "Switched bus to the F3 cavity."}
  W_SW_F6:   {<<: *w16, colors: [BG], notes: "Switched bus to the F6 cavity."}
  W_SW_F7:   {<<: *w16, colors: [BG], notes: "Switched bus to the F7 cavity."}
  W_SW_F8:   {<<: *w16, colors: [BG], notes: "Switched bus to the F8 cavity."}
  W_SW_F9:   {<<: *w16, colors: [BG], notes: "Switched bus to the F9 cavity."}
  W_SW_F10:  {<<: *w16, colors: [BG], notes: "Switched bus to the F10 cavity - the USB charger."}
  W_SW_F11:  {<<: *w16, colors: [BG], notes: "Switched bus to the F11 cavity - relay coil supply."}
  W_RLY_PWR: {<<: *w16, colors: [BG], notes: "PDM F11 out to the relay coil splice."}
  W_KMAIN_GND:
    <<: *w16
    colors: [BK]
    notes: K_MAIN coil ground to the star bus.
  W_COIL_PWR:
    <<: *w16
    colors: [YE]
    notes: |-
      Fused coil power into the relay. SWITCHED, NOT ALWAYS-HOT, and this is the one that cannot be
      traded: coils must die with the key even if K_COIL's contact welds. See the PDM notes.
  W_K_GND:
    <<: *w16
    colors: [BK]
    notes: K_COIL coil ground to the star bus.
  W_YR_OUT:
    <<: *w16
    colors: [YE]
    notes: Relay output to the coil splice. Yellow to match the stock coil-feed colour so the circuit still reads as factory.
  W_COIL_L: {<<: *w16, colors: [YE]}
  W_COIL_R: {<<: *w16, colors: [YE]}
  W_PTS_L:
    <<: *w16
    ignore_in_bom: true
    colors: [YE]
    notes: Yellow serves LEFT - stamped plate. Factory braided jacket - do NOT strip it.
  W_CAP_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      NEW WIRE - no counterpart in the old harness. The condenser bracket earthed through its
      mounting tabs to the frame, which is now powder coated. A ring terminal under one of the two
      mounting bolts, to the star bus. THIS IS AN IGNITION EARTH: without it the points arc and burn.
  W_CAP_L:
    <<: *w16
    ignore_in_bom: true
    colors: [YE]
    notes: STOCK CONDENSER PIGTAIL, not harness wire - see CAP_L. Drawn because the circuit is real; not cut, not labelled, not ordered.
  W_CAP_R:
    <<: *w16
    ignore_in_bom: true
    colors: [BU]
    notes: STOCK CONDENSER PIGTAIL, not harness wire - see CAP_L. Blue, read off the part.
  W_PTS_R:
    <<: *w16
    ignore_in_bom: true
    colors: [BK]
    notes: Black serves RIGHT - stamped plate. Factory braided jacket - do NOT strip it.
  W_RH_OUT:
    <<: *w16
    colors: [YE]
    notes: |-
      Starter trigger. The STOCK wire here was BLACK and was not a ground; black is ground-only on
      this harness precisely so this wire cannot be mistaken for one. Do not land it on the star bus.
  W_SOL_GND:
    <<: *w16
    colors: [BK]
    notes: Starter relay COIL- to the star point. The relay's coil floats, so this is its only return.
  # --- horn, relayed -------------------------------------------------
  W_HORN_COIL:
    <<: *w16
    colors: [GY]
    notes: |-
      Switched power to the K_HORN coil from SP_RLY. GY, not BG - a relay coil drive. Fed from the
      switched bus, so the horn is dead with the key out even though F4 on the load side is hot.
  W_HORN_SW:
    <<: *w16
    colors: [YE]
    notes: |-
      Horn button return - the relay's coil ground side, not a chassis ground, so not black. Its own
      net, open to the starter-trigger wire. Used to carry the horn's full 2A through the cluster
      contacts; now carries 0.1A.
  W_LH_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      NEW WIRE - no counterpart in the old harness. Harness side of LH way 8, to the star point.
      The cluster side of way 8 is a short lead to a ring under a cluster screw - see LH.
  W_HS_GND:
    <<: *w16
    colors: [BK]
    notes: The headstock ground - HS_GND back to the star point, through a bullet so the front end can be unplugged.
  W_HORN_PWR:
    <<: *w16
    colors: [RD]
    notes: |-
      Fused horn power from PDM F4 into the relay common. ALWAYS-HOT per the split - the horn is
      still dead with the key out because its coil is switched, and an open contact draws nothing.
  W_HORN_FEED:
    <<: *w16
    colors: [BG]
    notes: Relay output to the horn - K_HORN's 87. BG, tan, for switched power.
  W_HORN_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      Horn return to the star bus. STOCK HAD NO SUCH WIRE - the horn's second terminal went to the
      button. Relaying moves the switching to the coil side, so the load side needs its own ground.

  # --- headlight, relayed --------------------------------------------
  W_HEAD_SUPPLY:
    <<: *w16
    colors: [BU]
    notes: |-
      Fused headlamp power from PDM F5 to the splice. ALWAYS-HOT per the split; the beams are dead
      with the key out because both relay coils are switched. Sized for BOTH beams at once, per the
      make-before-break note on K_LO.
  W_HI_PWR:  {<<: *w16, colors: [BU], notes: Splice to the K_HI common.}
  W_LO_PWR:  {<<: *w16, colors: [BU], notes: Splice to the K_LO common.}
  W_DIM_COMMON:
    <<: *w16
    colors: [GN]
    notes: |-
      Switched supply from SP_RLY up to the dimmer common. A coil-drive wire, not a lamp feed - it
      carries the two relay coils, about 0.3A worst case during the make-before-break blip.
  W_HI_TRIG:
    <<: *w16
    colors: [GY]
    notes: Dimmer HI output to the K_HI coil.
  W_LO_TRIG:
    <<: *w16
    colors: [GN]
    notes: Dimmer LO output to the K_LO coil.
  W_KHI_GND:  {<<: *w16, colors: [BK], notes: K_HI coil ground to the star bus.}
  W_KLO_GND:  {<<: *w16, colors: [BK], notes: K_LO coil ground to the star bus.}
  W_HEAD_HI:
    <<: *w16
    colors: [BU]
    notes: K_HI output to the HI splice.
  W_HEAD_LO:
    <<: *w16
    colors: [GN]
    notes: K_LO output to the LO input.
  W_HEAD_GND:
    <<: *w16
    colors: [BK]
    notes: Headlight ground, to the headstock ground.

  # --- tail / park net, and the meter lamps on it ---------------------
  W_TAIL_FEED:
    <<: *w16
    colors: [BG]
    notes: PDM F6 to the ignition switch's TAIL1 way. Fused switched power in; the switch decides whether it or the battery feeds the tail net.
  W_TAIL_OUT:
    <<: *w16
    colors: [BU]
    notes: |-
      IGN way 2 out to the tail net. Fed from W_TAIL_FEED in ON and DIRECTLY FROM THE BATTERY in
      PARK - see SP_TAIL.
  W_INSTR_FEED:
    <<: *w16
    colors: [BG]
    notes: PDM F7 out to the instrument splice - one wire per cavity. Splits at SP_INSTR into the meter feed and the neutral lamp feed.
  W_MTR_FEED:
    <<: *w16
    colors: [BG]
    notes: SP_INSTR to the meter lamp splice. Switched instrument power, sharing the fuse with the neutral lamp.
  W_MTR_SPD: {<<: *w16, colors: [BG], notes: "Speedometer light. SWITCHED, not park-fed - see SP_MTR."}
  W_MTR_TAC: {<<: *w16, colors: [BG], notes: "Tachometer light, same net."}
  W_GND_SPD: {<<: *w16, colors: [BK]}
  W_GND_TAC: {<<: *w16, colors: [BK]}

  # --- USB-C PD charger, replacing the stock accessory circuit ----------
  W_USB_FEED:
    <<: *w16
    colors: [BG]
    notes: |-
      PDM F10 to the charger. SWITCHED - it dies with the key. See USB. 16 AWG covers a 45W unit at
      about 4.4A in with margin.
  W_USB_GND:
    <<: *w16
    colors: [BK]
    notes: Charger return to the star point. Stock's accessory earths were never connected to anything - this circuit has a real one.

  # --- turn signals -----------------------------------------------------
  W_FLASH_IN:
    <<: *w16
    colors: [BG]
    notes: PDM F9 to the flasher. Switched, so the signals die with the key.
  W_FLASH_OUT:
    <<: *w16
    colors: [BU]
    notes: |-
      Flasher to the turn switch's feed way. BU rather than GN to keep the POWER INTO the switch
      distinct from the SWITCHED OUTPUTS either side of it - the three land on adjacent ways of the
      same cluster connector.
  W_FLASH_GND:
    <<: *w16
    colors: [BK]
    notes: Flasher ground. Drawn even if a 2-pin part would not use it - see FLASHER.
  W_SIG_L:
    <<: *w16
    colors: [GN]
    notes: |-
      LEFT IS GN AND RIGHT IS GY, DELIBERATELY. The front-left and front-right feeds run in the same
      bundle to the same place at the headlight shell, the lamps have no pinout to read, and
      swapping them gives a bike that indicates the wrong way.
  W_SIG_R:  {<<: *w16, colors: [GY], notes: "Turn switch RIGHT output. GY not GN - see W_SIG_L."}
  W_SIG_FL: {<<: *w16, colors: [GN]}
  W_SIG_RL: {<<: *w16, colors: [GN]}
  W_SIG_FR: {<<: *w16, colors: [GY]}
  W_SIG_RR: {<<: *w16, colors: [GY]}
  W_IND_L:  {<<: *w16, colors: [GN], notes: "Left splice to the instrument 6P way 1."}
  W_IND_L2: {<<: *w16, ignore_in_bom: true, colors: [GN], notes: "Pod-side leg to the left dash indicator."}
  W_IND_R:  {<<: *w16, colors: [GY], notes: "Right splice to the instrument 6P way 2."}
  W_IND_R2: {<<: *w16, ignore_in_bom: true, colors: [GY], notes: "Pod-side leg to the right dash indicator."}
  W_GND_SIG_FL: {<<: *w16, colors: [BK], notes: "To the headstock ground."}
  W_GND_SIG_FR: {<<: *w16, colors: [BK], notes: "To the headstock ground."}
  W_GND_SIG_RL: {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Tail-end harness."}
  W_GND_SIG_RR: {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Tail-end harness."}
  W_GND_IND_L:  {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Into the pod ground splice - see SP_POD_GND."}
  W_GND_IND_R:  {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Into the pod ground splice - completes its 1-to-3."}

  # --- tail lamp and the brake circuit --------------------------------
  # The main harness stops at TAIL_6P. The *2 legs beyond it are the
  # tail-end lighting harness, a separate loom - drawn so the circuits
  # are complete, flagged ignore_in_bom so they stay out of this BOM.
  W_TAIL_RUN:
    <<: *w16
    colors: [BU]
    notes: Tail net to the tail 6-way, RUNNING. Lights in ON and in PARK - see SP_TAIL.
  W_TAIL_RUN2: {<<: *w16, ignore_in_bom: true, colors: [BU], notes: "Tail-end harness, 6-way to the tail lamp."}
  W_SIG_RL2: {<<: *w16, ignore_in_bom: true, colors: [GN], notes: "Tail-end harness, 6-way to the rear left signal."}
  W_SIG_RR2: {<<: *w16, ignore_in_bom: true, colors: [GY], notes: "Tail-end harness, 6-way to the rear right signal."}
  W_BRAKE2: {<<: *w16, ignore_in_bom: true, colors: [GN], notes: "Tail-end harness, 6-way to the lamp's BRAKE input."}
  W_TAIL_GND2: {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Tail-end harness, 6-way GND to its ground splice."}
  W_GND_TAIL2: {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Tail-end harness, ground splice to the tail lamp."}
  W_BRK_FEED:
    <<: *w16
    colors: [BG]
    notes: PDM F8 to the brake splice. Its own fuse, unlike stock - see SP_BRK_FEED.
  W_BRK_FEED_F: {<<: *w16, colors: [BG], notes: "Splice to the front switch, at the lever perch."}
  W_BRK_FEED_R: {<<: *w16, colors: [BG], notes: "Splice to the rear switch, frame mounted."}
  W_BRK_OUT_F:  {<<: *w16, colors: [GN], notes: "Front switch out to the brake lamp splice."}
  W_BRK_OUT_R:  {<<: *w16, colors: [GN], notes: "Rear switch out to the brake lamp splice."}
  W_BRAKE:
    <<: *w16
    colors: [GN]
    notes: Brake splice to the tail 6-way, BRAKE. Distinct colour from the tail feed because the two land on adjacent ways and reversing them would give a lamp that is bright until you brake.
  W_GND_TAIL:
    <<: *w16
    colors: [BK]
    notes: Star point to the tail 6-way, GND - the whole tail-end harness returns on this one wire.

  # --- high beam indicator, off the beam net --------------------------
  W_HEAD_HI2:
    <<: *w16
    colors: [BU]
    notes: Splice to the HI input.
  W_IND_HB:  {<<: *w16, colors: [BU], notes: "Splice to the instrument 6P - the dash high-beam indicator."}
  W_IND_HB2: {<<: *w16, ignore_in_bom: true, colors: [BU], notes: "Pod-side leg, 6P to the indicator."}
  W_GND_HB:  {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Indicator return into the pod ground splice."}

  # --- neutral circuit -------------------------------------------------
  W_IND_N_FEED:
    <<: *w16
    colors: [BG]
    notes: SP_INSTR to the instrument 6P - switched power for the neutral lamp.
  W_IND_N_FEED2: {<<: *w16, ignore_in_bom: true, colors: [BG], notes: "Pod-side leg, 6P to the lamp."}
  W_NSW2:
    <<: *w16
    ignore_in_bom: true
    colors: [GY]
    notes: |-
      The lamp's RETURN, not a ground - it runs to the neutral switch, which closes to the engine
      case only in neutral. GY rather than BK: black is ground only, and this wire is live whenever
      the key is on.
  W_NSW:
    <<: *w16
    colors: [GY]
    notes: |-
      Harness-side leg, 6P to the switch. Stock ran light green here; the rebuild's function
      scheme puts it on GY.

  # --- pod ground and the engine strap ---------------------------------
  W_POD_GND2: {<<: *w16, ignore_in_bom: true, colors: [BK], notes: "Pod-side leg - three indicator returns onto one conductor at the splice."}
  W_POD_GND:  {<<: *w16, colors: [BK], notes: "Harness-side leg, 6P to the headstock ground."}
  W_ENG_GND:
    <<: *w12
    colors: [BK]
    notes: |-
      ENGINE BLOCK UP TO THE STAR POINT - the harness's one path to the battery negative. Every
      signal return and the charging return come down this wire, about 5-8A of lamps and relays
      plus whatever the regulator is putting into the battery. It does NOT carry cranking current;
      the battery negative goes to the block directly. See GND_ENG.

  W_STATOR_A:
    <<: *w16
    ignore_in_bom: true
    colors: [YE]
    notes: The stator's own fixed lead, EXTENDED at the bench to clear the chaincase, ending at ALT_SVC. Not harness wire.
  W_STATOR_B: {<<: *w16, ignore_in_bom: true, colors: [YE], notes: "The stator's second fixed lead, extended the same way."}
  W_ALT_A:
    <<: *w12
    colors: [YE]
    notes: |-
      ONE OF TWO SINGLE WIRES, W_ALT_A AND W_ALT_B - the stator jumper, ALT_SVC to the regulator's
      grey AC housing. AC and interchangeable: either lands on either AC input.
      12 AWG yellow, inside the Furukawa QLW 250 terminal's 2-8 sq mm range. Part of the separate
      stator jumper harness, zip-tied to the main loom for retention only.
      Yellow collides with the scheme's ignition role but is kept to match stock; these two are
      isolated in their own connector at the regulator.
  W_ALT_B: {<<: *w12, colors: [YE], notes: "The stator jumper's second leg. See W_ALT_A - same wire, interchangeable with it."}
  W_RR_OUT:
    <<: *w12
    colors: [RD]
    notes: |-
      DC+ GOES DIRECT TO THE BATTERY, not through the PDM. A series regulator is sensitive to
      resistance in the DC path, so the pair runs heavy and direct with MF_RR at the battery end.
      12 AWG, plain red for a direct battery run.
  W_RR_BATT:
    <<: *w12
    colors: [RD]
    notes: Fuse to the solenoid's battery stud, one 6 AWG lug from the battery positive. As short as the mounting allows - see W_RR_OUT.
  W_RR_GND:  {<<: *w12, colors: [BK], notes: "12 AWG to match W_RR_OUT - the return carries the same current as the feed. Lands on the star point."}

  # --- battery tender / 12V accessory point - see MF_TDR and SAE -----
  W_TDR_HOT:
    <<: *w12
    colors: [RD]
    notes: |-
      Solenoid battery stud to the tender fuse. The only unfused length in the circuit, kept as
      short as the holder's position allows. 12 AWG - the bottom of the MP630 terminal's band.
  W_TDR_SAE:
    <<: *w12
    ignore_in_bom: true
    colors: [RD]
    notes: THE SAE PIGTAIL'S OWN POSITIVE LEAD, not harness wire - fuse holder to the socket. Pulled to seat in MF_TDR. Not labelled, not ordered.
  W_TDR_GND:
    <<: *w12
    ignore_in_bom: true
    colors: [BK]
    notes: THE SAE PIGTAIL'S OWN RETURN, not harness wire - socket to the battery negative post, re-terminated with our 1/4 inch ring.

