# =====================================================================
# KZ305-B1 — REPLACEMENT HARNESS  (DRAFT - NOT BUILDABLE YET)
#
#   wireviz -f hps -p kz305-common.yml kz305-rebuild.yml
#
# This is the harness being built to replace the factory one. It must
# reproduce EVERY circuit in the factory model - any circuit missing
# from that transcription is a circuit that will not exist on the bike.
#
# See models/factory/00-notes.yml for the evidence-tag convention.
# Open items on the as-built record are at the foot of
# models/factory/signals.yml; the plan for closing them is
# docs/verification-plan.md.
#
# ---------------------------------------------------------------------
# BLOCKERS - do not cut wire against this file yet
#
#   1. GAUGE IS UNMEASURED, HARNESS-WIDE. Not one wire has had its
#      gauge taken with a tool; every bench value is an eyeball
#      estimate against an unverified 18 AWG baseline. Do not size
#      rebuild wire against the measurement log until the gauge pass
#      is done.
#
#   2. THE STAR GROUND IS BIGGER THAN DRAWN. The stock harness earths
#      most components through their own mounting hardware rather than
#      through a ground wire, so every one of those needs a NEW wire
#      back to the bus. Those wires do not exist in the old harness and
#      appear nowhere in either model. The count is the count of ground
#      Net B's earth points and it is NOT YET KNOWN.
#      ⚠️ THE FRAME IS ALREADY POWDER COATED. That path is GONE, and
#      MASKING IS NO LONGER AN OPTION - the window closed before this
#      project counted what depended on it. Every mounting-earthed
#      component now needs a wire or an abraded landing; there is no
#      third choice. See issue #54.
#      Until it closes, the GND bus way count is a guess and the PDM
#      circuit count is not final.
#
#   3. THE STARTER RELAY COIL. Which of the assembly's two leads is
#      COIL-, and where the coil's return goes. "COIL- grounds
#      directly" is withdrawn and nothing has replaced it - W_SOL_GND
#      is drawn but MUST NOT BE BUILT. The SOL way numbers below are
#      still the diagram's, not the part's, and both IGN and FUSE_4P
#      had to be renumbered once read.
#
#   4. RESOLVED 3 Sep 2026 - THE STOCK ACCESSORY CIRCUIT IS NOT
#      REPRODUCED, and a USB-C PD charger replaces it.
#      Both halves of the stock arrangement were known and NEITHER was
#      what the diagram says: the FEED is permanently live off the
#      battery post, unfused for two inches, and the EARTHS were never
#      connected at all. A live wire with no return, provisioned and
#      left that way for 44 years. Nothing about it is worth keeping -
#      not the topology, not the second fuse box, not the four bullet
#      pickups.
#      What replaces it is ONE circuit on F10, SWITCHED, individually
#      fused, with a real ground to the star bus. See the USB node.
#      The part is not selected and that is now a parts question
#      rather than a design one - it sizes F10 and nothing else.
#
#   LENGTHS ARE NOT A BLOCKER. The harness is built in place on the
#   bike and trimmed to final length there. Step 1 measured 46 branches
#   off the old harness before anything was cut, and that map sets
#   component spacing - it is a reference, not a cut list.
#
#   DESIGN DECISIONS AWAITING A CALL are filed as issues #44-#55 and
#   are deliberately not resolved in this file.
# ---------------------------------------------------------------------
#
# ---------------------------------------------------------------------
# DESIGN INPUTS FROM THE OLD HARNESS - things found, not decided
#
#   TWO STOCK WAYS SERVE NOTHING. The switched brown runs to a cavity
#   the R/R does not populate (B04.3) and to a cavity the LEFT CLUSTER
#   does not populate (B02.3). Both are live wires into empty mates
#   [bench 29 Aug 2026]. Do not reproduce either - the rebuild's
#   left-bar connector needs FIVE ways, not six. A STOCK WAY COUNT IS
#   NOT A CIRCUIT COUNT, and the difference is invisible from the
#   harness side.
#
#   THE STOCK 10A FUSE FEEDS GO UP TO THE HANDLEBAR AND BACK. Neither
#   10A circuit is fed at the fuse box; both are fed from SP_RH_BR, a
#   splice inside the RIGHT-HAND SWITCH PIGTAIL, itself fed from the
#   switched brown bus. The rebuild has no reason to reproduce the
#   detour - the PDM feeds its own fuses - but it DOES have to keep the
#   right-bar connector's way count honest, because three of those ways
#   only exist to serve it. Revisit the RH 4P way list when the PDM
#   circuit list is final.
#
#   THE MELTED JOINT WAS TOPOLOGY, NOT AGE. A gauge step at a bullet on
#   the 20A main, two connections from the battery post, where the
#   charging output joins as well. See W_MAIN_OUT.
#
#   THE EARTH, NOT THE FUSING, WAS THE COMMON-MODE FAILURE. Two ground
#   nets, and the big one never reaches the ring terminal at all.
#
#   A SECOND Y/R NET exists on the old harness, on the fuse-box and
#   starter-relay branch, open to the coil-feed Y/R. It is the starter
#   relay's coil feed [arith 2 Sep 2026]. Neither model draws it as a
#   cable; it closes with blocker 3.
# ---------------------------------------------------------------------
#
# ---------------------------------------------------------------------
# DESIGN DECISIONS
#
#   CONNECTORS: HYBRID. Sealed where exposed or run-critical -
#     charging, ignition, grounds, main power, starter, anything under
#     the tank or at the headstock. Stock-style bullets where the run
#     is sheltered and serviceable - inside the headlight shell,
#     instrument lamps, inside signal housings. Water in the sleeve
#     killed the original, so sealing follows exposure, not circuit
#     importance.
#
#   LIGHTING: FULL LED.
#   IGNITION: POINTS NOW, EI-READY. Stock circuit unchanged; the Y/R
#     node stays an accessible, documented tap so EI is a plug-in
#     later. Stock already made it accessible - see SP_YR.
#   REGULATOR: SH775 SERIES type, in hand.
#   HIGH-CURRENT SWITCH PATHS: RELAYED - five relays.
#
#   ** RELAY POLICY: ANYTHING THAT USED TO RUN THROUGH SWITCH CONTACTS
#   DIRECTLY. ** K_MAIN, K_COIL, K_HORN, K_HI, K_LO.
#
#     THE CASE IS THE CONTACTS, NOT THE LOAD. The horn at 2A and an LED
#     headlight under 2A would both fail a "relay where the current is
#     high" test. What carries the decision is that EVERY cluster
#     contact on this bike measured degraded - 3-5 ohm on the right,
#     left the same age and construction - and a contact that drops 6V
#     at 2A is not a switch, it is a resistor. The relays leave those
#     contacts carrying 0.15A, where their condition stops mattering.
#
#     THE HONEST COST: five new parts the bike never had, each a socket,
#     a ground and a failure point. Socket every one, keep them
#     accessible, carry spares.
#
#     ⚠️ CLEANING THE CLUSTERS IS NOT OPTIONAL AND NOT AN ALTERNATIVE.
#     All five relays are driven THROUGH those same contacts, and a
#     relay will not pull in through 8 ohm. Cleaning is what makes
#     relaying work.
#
#     THE STARTER NEEDS NO NEW RELAY. SOL *is* the starter relay and the
#     button has only ever driven its coil, never the motor. A K_START
#     would drive the new coil through the SAME degraded contacts, and
#     a relay coil (~0.15A) against a solenoid coil (~0.3A) is a 2x
#     improvement where K_COIL buys 20x.
#
#   ** WHICH FUSES SIT BEHIND K_MAIN: HYBRID. ** F1/F4/F5 always-hot,
#     F2/F3 and the rest switched. See the PDM notes for why, and issue
#     #45 for the standing recommendation to revisit it.
# ---------------------------------------------------------------------
#
# ---------------------------------------------------------------------
# FULL LED - three harness consequences
#
#   a. FLASHER. Must be LOAD-INDEPENDENT solid-state - a thermal
#      flasher's rate depends on the current through it, so LED lamps
#      make it flash far too fast or not at all. Want a wide current
#      range (roughly 0.05-10A) so it drives LED now and would still
#      drive filament on a revert. Buy one with REVERSE-POLARITY
#      PROTECTION; electronic flashers are polarity-sensitive where the
#      stock thermal unit was not, and the cheap ones omit it.
#      The shared-indicator backfeed does NOT apply to this bike - it
#      has SEPARATE left and right dash indicators, so the two circuits
#      are never bridged.
#
#   b. REGULATOR HEAT - SOLVED AT SOURCE. A shunt regulator burns off
#      surplus as heat, so cutting load makes it work harder. A SERIES
#      regulator open-circuits the stator instead of shorting it, so
#      regulator and stator both run cooler. The SH775 is a series unit
#      and is in hand, so temperature measurement is validation rather
#      than a decision gate. A single-phase stator connects to ANY TWO
#      of the three AC inputs - standard practice on single-phase
#      classics.
#
#   c. POLARITY NOW MATTERS. Filaments do not care; LEDs do. Every lamp
#      branch must be drawn with feed and ground identified, and the
#      tail/brake dual-intensity function verified on the chosen part.
#
#   BONUS: the 3.6 ohm neutral switch ground path stops mattering. At
#   0.28A an incandescent indicator lost ~1.1V across it; an LED at
#   ~20mA loses ~0.07V. Still worth cleaning, no longer worth chasing.
# =====================================================================

connectors:

  BATT:
    <<: *battery

  GND:
    type: Star ground point
    subtype: bolted, to a bare-metal plate
    pinlabels: [BATT NEG, RR RETURN, ENGINE STRAP, SIGNAL BUS]
    notes: |-
      ** FOUR LANDINGS, NOT TWENTY-TWO - issue #44 settled 6 Sep 2026. ** This node used to collect
      every ground in the harness, which is not buildable: twenty-two rings will not stack on one
      stud, and two of them are 6 AWG lugs.
      The grounds are now split BY DUTY, and the split is forced by current rather than chosen:
        1 BATT NEG      6 AWG, direct
        2 RR RETURN     12 AWG, direct - see below
        3 ENGINE STRAP  6 AWG, direct. Carries the WHOLE CRANKING RETURN, well over 100A
        4 SIGNAL BUS    one lead up from SP_GND, which collects the nineteen signal returns
      ** THE HEAVY RETURNS NEVER TOUCH A CONNECTOR. ** No 090 or 250 junction is rated for a tenth of
      cranking current. These are bolted, and the bolt IS the star point.
      ⚠️ W_RR_GND IS TREATED AS HEAVY, and that was not obvious. It is 12 AWG carrying the charging
      return - up to the 30A of MF_RR - so putting it on a 22A signal junction would push that current
      through a bus shared with nineteen lamp and relay returns. Found while splitting the node.
      ⚠️ THE FRAME IS ALREADY POWDER COATED, so this is a bare-metal plate or a scraped landing, NOT
      "the frame". Acceptance is 0.0-0.1 ohm REL-zeroed on a Fluke 87V, which is the meter's floor -
      treat it as pass/fail, not a measurement.

  MF:
    <<: *main_fuse
    subtype: 20A ATC, Metri-Pack 630 sealed pull-to-seat holder
    mpn: MP630 1214 ATC Set
    additional_components:
      - type: Fuse
        subtype: ATC / ATO regular blade, 20A yellow - NOT MiniVal
        qty: 1
    notes: |-
      ** MP630 1214 PULL-TO-SEAT HOLDER, decided 4 Sep 2026. ** Set includes housing, cover, seal and
      loose terminals. Both of this holder's wires are in range - W_MAIN_IN is 12 AWG and W_MAIN_OUT
      is 14 AWG, against the terminal's 12-14 AWG band.
      ⚠️ IT TAKES AN ATC (REGULAR BLADE) FUSE, NOT A MiniVal. The PDM is MiniVal throughout, so the
      build carries TWO fuse form factors and they are not interchangeable. Buy ATC 20A and 30A
      separately from the MiniVal kit.
      ⚠️ PULL-TO-SEAT MEANS THE WIRE THREADS THROUGH THE SEAL AND HOUSING BEFORE IT IS CRIMPED, then
      pulls back to lock. Same discipline as the MTA cavities and the printed labels: seal first,
      label first, crimp last. A crimped terminal will not pass back through, so a mistake here costs
      the whole lead.
      ⚠️ A THIRD TERMINAL FAMILY. The harness now uses MTA 280 in the PDM, MP630 here, and 090 at the
      connectors. Check the crimp tool covers pull-to-seat 630 before assuming.
      ** PROTECTION AND DISTRIBUTION ARE SEPARATE PARTS - decided 4 Sep 2026. ** A stud-terminal fuse
      holder doubling as the hot bus was considered and dropped: it couples the fuse RATING to the
      joint count, and the stud fuse families do not reach down to where this circuit belongs.
      MEGA/AMG starts at 60A and MIDI/AMI at 30A, both above what 14 AWG can carry. Distribution moved
      to SP_HOT instead, which is a power stud.
      ⚠️ THIS FUSE PROTECTS THE WIRE, NOT THE LOADS - every circuit downstream has its own fuse. So
      the rating and the conductor move together, and BIGGER IS NOT BETTER. Load is about 11A
      (K_MAIN's switched side at 6.6A plus the horn and headlamp fuses), so 20A on 14 AWG is already
      generous.
      ** 20A STANDS, AND #49 IS WHAT FREED IT (4 Sep 2026). ** While two 18 AWG branches left the
      switched bus unfused, this fuse was their only protection and its rating was hostage to them.
      They now leave through F11, so nothing downstream depends on this rating except the 14 AWG main
      feed itself - which is what it is sized for.

  PDM:
    type: Power distribution module
    subtype: Sealed modular, 60 cavities on the 280 footprint
    manufacturer: MTA
    mpn: "0301370"
    additional_components:
      - type: Top cover
        manufacturer: MTA
        mpn: "0301371"
        qty: 1
      - type: Secondary lock
        subtype: SIX PER MODULE, not one
        manufacturer: MTA
        mpn: "0301372"
        qty: 6
      - type: Mounting leg - male
        subtype: 2 pcs reqd per module
        manufacturer: MTA
        mpn: "0300690"
        qty: 2
      - type: Mounting leg - female
        subtype: 2 pcs reqd per module
        manufacturer: MTA
        mpn: "0300691"
        qty: 2
      # QUANTITIES DERIVED FROM THE CONNECTION SETS. Recomputed 3 Sep 2026 once
      # SP_HOT and SP_SW were drawn (#50), which put the nine fuse-input wires
      # into the model for the first time.
      #
      # ** THE DRAWING NOW CONVERGES ON THE PART. ** Two independent derivations
      # agree to the wire:
      #
      #   walking the connection sets   -> 42 wire-ends enter the module
      #   11 fuses x 2 + 5 relays x 4   -> 42 cavities exist to receive them
      #
      # and no cavity carries more than one wire, which a sealed cavity requires -
      # it takes one seal on one wire. That equality is the check on both numbers;
      # if a later edit breaks it, one of them is wrong.
      #
      # ONE TERMINAL AND ONE SEAL PER WIRE. A relay pin is a cavity a terminated
      # wire enters from below, exactly like a fuse leg, so relay positions cost
      # terminals - they are not free because the relay plugs in from the top.
      #
      # Gauge split of the 42: 16 AWG x41, 14 AWG x1.
      #
      # ** ONE SEAL, NOT TWO - 4 Sep 2026. ** Every cavity wire is now 16 or 14
      # AWG and both take the GREEN seal, so red 4550748 drops to zero. That also
      # makes Prowire's contradictory OD columns moot: 18 AWG was the only gauge
      # where the inch and mm figures implied different seals, and there is no
      # 18 AWG left in this harness.
      #
      # ⚠️ THESE ARE DESIGN QUANTITIES, NOT ORDER QUANTITIES. Order over - crimps
      # get wasted, and if the 16 AWG spool misses the green seal's 2.2mm bound
      # (#61) those circuits move to 14 AWG, which needs 1708339-L instead. Green
      # seals survive that; the terminal does not.
      - type: Terminal
        subtype: Sealed 2.8mm, 1.0-2.0 sq mm (18-16 AWG) - 41x 16 AWG
        manufacturer: MTA
        mpn: 1708338-L
        qty: 41
      # ONE 14 AWG leg enters the block - W_MAIN_SW_FEED to K_MAIN's 30. W_SW_BUS
      # went to 16 AWG with everything else, and W_MAIN_OUT terminates OUTSIDE on
      # SP_HOT.
      - type: Terminal
        subtype: Sealed 2.8mm, 2.5-4.0 sq mm (14-12 AWG) - W_MAIN_SW_FEED only
        manufacturer: MTA
        mpn: 1708339-L
        qty: 1
      # 60 cavities less the 42 populated. Includes the 10 that sit unused inside
      # a relay footprint - the module seals at the WIRE-ENTRY face, so a relay
      # body on top does not close a hole in the bottom.
      - type: Cavity plug
        subtype: 2.8mm black - 60 cavities less 42 populated. REQUIRED or the module is not sealed
        manufacturer: MTA
        mpn: "4550750"
        qty: 18
      # ⚠️ 16 AWG at 2.26mm clears green's 2.2mm lower bound by 0.06mm. Caliper
      # the delivered spool - issue #61. If it misses, those circuits move to
      # 14 AWG, which is ALSO green, so this quantity holds either way.
      # ⚠️ ZERO. Kept as a line so the decision is visible rather than absent:
      # 40 were bought before the harness went all-16, and they are now spare.
      - type: Wire seal - red
        subtype: NOT USED - no 18 AWG remains in the harness
        manufacturer: MTA
        mpn: "4550748"
        qty: 0
      - type: Wire seal - green
        subtype: 2.8mm, insul dia 2.2-3.0mm - for 16 AWG TXL (2.26mm) and 14 AWG TXL (2.59mm)
        manufacturer: MTA
        mpn: "4550747"
        qty: 42
    # ⚠️ WAYS ARE APPENDED, NEVER INSERTED. Connection sets reference this
    # connector BY INDEX, so inserting a way silently repoints every
    # reference after it - which is exactly how FUSE_4P went wrong on
    # 29 Aug. F7 therefore sits after SW AUX rather than beside F6. This
    # list is ALLOCATION order, not physical cavity order; the cavity map
    # is a separate artefact and is not written yet.
    pinlabels: [MAIN STUD - VESTIGIAL, F1 OUT, F2 OUT, F3 OUT, F4 OUT, F5 OUT, F6 OUT, SW IN - VESTIGIAL, SW OUT - VESTIGIAL, SW AUX - VESTIGIAL, F7 OUT, F8 OUT, F9 OUT, F1 IN (HOT), F4 IN (HOT), F5 IN (HOT), F2 IN (SW), F3 IN (SW), F6 IN (SW), F7 IN (SW), F8 IN (SW), F9 IN (SW), F10 OUT, F10 IN (SW), F11 OUT, F11 IN (SW)]
    notes: |-
      UPGRADE - replaces the stock 20A main plus two 10A glass fuses, and the fixed pigtail they came
      on. Do not read the pin list as a chosen part's pinout: it is the CIRCUIT LIST the module has to
      satisfy, in a stable order so the connection sets can reference it. The physical cavity map is a
      separate artefact and is not written yet.
      ⚠️ THE CIRCUIT COUNT IS NOT FINAL while the star-ground wire count is unknown - blocker 2.
      ** PART: MTA 0301370, BUSES POINT-TO-POINTED AT ASSEMBLY. ** 60 sealed 2.8mm cavities taking 30
      MiniVal fuses or 10 micro relays or a mix, so one cavity type takes either and a position's role
      is decided by what is pushed in. The catalogue's only bussed module (0301697) is fuses-only, not
      waterproof, and carries a SINGLE bus where this design needs two - so the two junctions get
      wired by hand. Full comparison and assembly rules in docs/part-selection.md.
      ** ONE WIRE PER CAVITY - DO NOT DAISY-CHAIN. ** A sealed cavity takes one cable seal on one
      wire, so the HOT and SWITCHED junctions are star points OUTSIDE the module. Keep HOT and
      SWITCHED positions at OPPOSITE ENDS of the block: interleaved, a mis-landed feed wire puts F3 on
      permanent power, which is exactly the failure the split exists to prevent.
      ** BUS THE FEED SIDE WITH SOLID BAR. ** A wire per fuse input is N crimps on the main power
      path - the old harness's melted-bullet mechanism rebuilt on purpose.
      ** THE HOT / SWITCHED SPLIT IS ARCHITECTURE, NOT PART SELECTION. **
        HOT  - fed from MAIN STUD, live whenever the battery is:
          F1 IGN SW FEED  - must be hot; it feeds the switch that drives K_MAIN.
          F4 HORN PWR     - K_HORN's 30. Its coil is switched, so the horn is still dead with the key
                            out; only the contact side is hot.
          F5 HEADLAMP PWR - K_HI and K_LO commons, same arrangement.
        SW   - fed from SW IN, downstream of K_MAIN, dead with the key out:
          F2 KILL FEED, F3 COIL PWR, F6 TAIL/PARK, F7 INSTR, F8 BRAKE, F9 SIGNAL.
      ** F3 IS NOT NEGOTIABLE. ** If it were hot and K_COIL's contact ever welded, the engine would
      keep running with the key out AND THE KILL SWITCH WOULD HAVE NO EFFECT, because the kill switch
      only drives that coil. Every other relay's welded-closed failure is a flat battery; that one is
      a bike you cannot stop.
      NO PARASITIC DRAW FROM THE HOT FUSES - an un-energised relay is an open contact, so F4 and F5
      sit at battery voltage against an open circuit and pass nothing.
      WHAT THE HYBRID BUYS: K_MAIN carries about 6.6A rather than the roughly 9A of a full stack, and
      the headlamp and horn loads never cross its contacts at all. It is the one relay whose failure
      kills the bike, so it is the one worth unloading.
      ** FUSE RATINGS ASSIGNED 4 Sep 2026, SIZED FOR INCANDESCENT. ** The bike may run filament lamps
      for a while before the LED conversion, so every rating below covers the STOCK load, not the LED
      one. That is the conservative direction and it means the ratings do not change if the lamp
      decision does.
        F1   5A   ign switch feed - K_MAIN coil, plus the tail lamp in PARK (see #48)
        F2   5A   kill switch feed - K_COIL coil only, ~0.15A
        F3  10A   both ignition coils, ~6A on points
        F4  10A   horn, 2A nominal but inrush is well above it
        F5  15A   headlamp. 4.2A on one 50W beam, 7A with BOTH lit during the dimmer's
                  make-before-break blip, and cold-filament inrush is several times that for a
                  few milliseconds. 10A would nuisance-blow on a cold start.
        F6   5A   tail / park, 8W filament
        F7   5A   instruments - three 3.4W lamps
        F8  7.5A  brake, 27W filament plus cold inrush
        F9  10A   signals - two 23W lamps a side plus the indicator
        F10 7.5A  USB-C PD, ~4.4A at 45W, and PD converters have capacitive inrush
        F11  5A   relay coil supply, ~0.45A worst case
      MiniVal part numbers are in docs/part-selection.md. Buy a variety kit rather than singles.
      ⚠️ THE SPLIT IS UNDER REVIEW - see issue #45, which recommends moving F4/F5 to switched and
      keeping only F1 hot. Issues #48-#51 also bear on this block.
      RELAY COUNT IS FIVE, at the TOP of what an RTMR-style module carries. Size for five positions
      plus a spare, or accept that two live in separate sockets outside it.

  SP_GND:
    style: simple
    type: Splice
    subtype: signal ground bus - 19 returns, sealed junctions
    notes: |-
      ** SEALED JUNCTION CONNECTORS, NOT A BUS BAR - issue #44, 6 Sep 2026. ** Three HW.JC-8P sealed
      junctions (8 ways, all pins bussed, 22A) jumpered together: 24 positions for nineteen returns,
      two internal jumpers and one lead out to the bolted star point.
      WHY NOT A BAR: a bar is unsealed, and water in the sleeve is what killed the original harness.
      These are sealed, they use the same 090 terminals as the rest of the connector order, and a
      circuit can be removed by pulling a terminal rather than cutting a crimp.
      LOAD IS ABOUT 5-8A across nineteen 16 AWG returns, against a 22A rating.
      ⚠️ THE CHARGING RETURN IS NOT HERE. W_RR_GND goes direct to the bolted point - see GND.
      ⚠️ 24 POSITIONS FOR 19 GROUNDS PLUS 2 JUMPER PAIRS AND A LEAD IS EXACTLY FULL. Buy a fourth
      junction if any spare capacity is wanted; blocker 2's ground count is not final.
  SP_HOT:
    style: simple
    type: Splice
    subtype: always-hot bus - 1 in, 4 out
    notes: |-
      ** THE MODULE HAS NO INTERNAL BUSBAR, SO THIS JUNCTION IS REAL AND HAS TO BE BUILT. ** Every
      MTA 0301370 cavity is wired separately, so the hot feed side is a harness node OUTSIDE the
      sealed block. It was implicit in the PDM way list until 3 Sep 2026 and therefore invisible to
      review - see issue #50.
      FIVE CONDUCTORS: W_MAIN_OUT in from the 20A fuse, then W_MAIN_SW_FEED to K_MAIN's 30 and the
      F1, F4 and F5 inputs.
      ** BUILT AS ONE CRIMPED PARALLEL SPLICE - Molex 19205-0004, 8 GA. ** Five conductors in a
      4.20mm bore, which needs 3.83mm. One crimp, no cascade.
      ** AND IT STAYS A CRIMP RATHER THAN A JUNCTION CONNECTOR - issue #44, 6 Sep 2026. ** SP_SW moved
      to a sealed junction for serviceability; this node deliberately did not. It is the
      HIGHEST-CURRENT node in the harness at about 16A, and unlike SP_SW its membership is settled -
      F1, F4, F5 and K_MAIN's 30, none of them likely to change.
      A crimp has ZERO mated interfaces; a junction has two per wire. On the main feed of a vibrating
      motorcycle that difference is the whole reason this rebuild bans bullets on the main path.
      Serviceability is worth paying interfaces for where the design is still moving. It is not worth
      paying them where it is settled.
      Modelled as ONE node the way the factory model's SP_BR is - a trunk with taps - so the build
      form is a note rather than a topology, and this decision does not change the drawing.
      ⚠️ THE TRUNK CARRIES CUMULATIVE CURRENT, NOT BRANCH CURRENT. The segment nearest the fuse
      carries everything downstream of it - up to 20A - and can taper as branches leave. Size each
      segment for what passes through it, not for the branch it feeds.
      ⚠️ ORDER THE CASCADE SO THE HEAVIEST BRANCH LEAVES FIRST. In a cascade the last branch's current
      passes through every splice before it, so putting the big load at the far end puts the most
      joints in series with the most current. K_MAIN's 30 is the heavy one here.
      WHY A CASCADE RATHER THAN A STUD: sealed crimp splices under adhesive heat-shrink, distributed
      along the loom, against four ring terminals stacked on one post. Stock practice on this bike -
      SP_RH_BR is a 1-to-3 and SP_BRAKE a 2-into-1 shared crimp. It also avoids a bolted joint that
      can loosen. The old harness did NOT fail at a splice; it failed at a separable bullet with a
      gauge step in it.
  SP_SW:
    style: simple
    type: Splice
    subtype: switched bus - 1 in, 8 out - FUSE INPUTS ONLY
    notes: |-
      ** THE BIGGER OF THE TWO. ** K_MAIN's 87 output feeds it and eight branches leave - the F2, F3,
      F6, F7, F8, F9, F10 and F11 inputs.
      ** IT FEEDS FUSE INPUTS AND NOTHING ELSE - the rule that settled issue #49, 4 Sep 2026. ** This
      node sits downstream of K_MAIN and UPSTREAM of every individual fuse, so anything tapped
      straight off it is protected by nothing smaller than MF. Two loads used to hang here directly.
      They now leave through F11. Do not add a ninth branch that is not a fuse input.
      ** BUILT AS A SEALED JUNCTION CONNECTOR - HW.JC-14P-1, issue #44, 6 Sep 2026. ** Fourteen ways
      as TWO 7-way buses, 22A, jumpered together to take all nine conductors with three spare.
      ⚠️ PUT THE HEAVY BRANCHES ON BUS A - the side K_MAIN's 87 feeds directly, F3 coil power
      especially. The jumper to bus B then carries only F7, F8 and F9, which is a couple of amps.
      WHY A CONNECTOR HERE AND A CRIMP AT SP_HOT: this node changed TWICE in one week - F10 when the
      USB circuit landed, F11 when #49 closed - and each change would have meant cutting and
      re-crimping. The circuit list is still moving. SP_HOT's is not.
      ⚠️ K_MAIN's 87 IS INSIDE THE MODULE AND THIS NODE IS OUTSIDE IT. So the switched bus leaves the
      block on one wire and comes back on six, which is nine cavity crossings for one net. That is the
      cost of a module with no busbar, and it is worth seeing rather than discovering at assembly.
      ⚠️ CARRIES THE WHOLE SWITCHED LOAD, about 6.6A, through its first segment. Same taper and same
      ordering rule as SP_HOT.
      Every branch is now fused, so MF is no longer the sole protection for anything leaving here -
      which is what freed MF's rating to be chosen on wire protection alone.

  MF_RR:
    type: Charging fuse
    subtype: 30A ATC, Metri-Pack 630 sealed pull-to-seat holder - AT THE BATTERY END
    mpn: MP630 1214 ATC Set
    pinlabels: [IN, OUT]
    additional_components:
      - type: Fuse
        subtype: ATC / ATO regular blade, 30A green - NOT MiniVal
        qty: 1
    notes: |-
      NEW PART, 1 Sep 2026, and it does not exist on the stock bike - which fused the charging output
      nowhere. It protects the WIRE, not the regulator: a direct-to-battery DC pair is unfused by
      definition unless something is put in it, and an unfused conductor onto a battery post is the one
      thing a harness must not have.
      AT THE BATTERY END DELIBERATELY - a fuse at the regulator end leaves the whole run unprotected.
      ** 30A, ON A CALLED STATOR OUTPUT OF 20A - decided 4 Sep 2026. ** Nothing on this bike states
      the stator's rated wattage and chasing it was blocking a $2 part. 20A is taken as the working
      figure; 30A sits above it so normal charging never opens the fuse, and below the SH775's 35A.
      12 AWG carries 30A comfortably, so the fuse still protects its conductor.
      SIZE UP LATER IF THE CHARGING TEST SAYS SO - target 14.0-14.5V at 3-5k. A fuse is the cheapest
      thing on this harness to change.

  IGN:
    <<: *ign_switch

  RH:
    <<: *rh_cluster
    pinlabels: [STOP IN (Br), LINK (Y/R), START OUT (BK)]

  SOL:
    <<: *starter_relay
  SM:
    <<: *starter_motor
  ALT:
    <<: *alternator
  RR:
    type: Regulator / rectifier
    subtype: 3-phase 35A SERIES type - see docs/part-selection.md
    manufacturer: Shindengen
    mpn: SH775
    pn: "4012941"
    pinlabels: [AC1, AC2, AC3, DC+, GND]
    additional_components:
      # qty derives from the drawing, so these self-correct if AC3 is ever used.
      - type: Terminal
        subtype: Shindengen mating pigtail, FH009-FH020 family - MPN TBD, Eastern Beaver preferred
        qty_multiplier: populated
        qty: 1
      - type: Cavity plug
        subtype: seals the deliberately unterminated AC3 - MPN TBD
        qty_multiplier: unpopulated
        qty: 1
    notes: |-
      IN HAND - a Polaris ORV takeoff, $45 [bench 29 Aug 2026]. A SERIES regulator: it open-circuits
      the stator rather than shorting it, so regulator and stator both run cooler and the LED heat
      problem is cured at source rather than managed.
      BENCH-TEST THE USED UNIT BEFORE BUILD - a regulator either works or does not, and it is
      testable.
      The alternator is single-phase, two yellow leads, 0.4 ohm [meter 18 Aug 2026]; it connects to
      ANY TWO of the three AC inputs, which is standard practice on single-phase classics. AC3 is
      deliberately unterminated and gets a cavity plug. Only two of three rectifier legs are used, so
      capacity is below the 35A rating - which does not matter here.
      CONNECTORS NOT YET ORDERED - two mating pigtails, 3-pin AC + 2-pin DC, Shindengen FH009-FH020
      family, $16-22; Eastern Beaver preferred for correct crimps and DC gauge.
      DC+ RUNS HEAVY AND DIRECT TO THE BATTERY with MF_RR at the battery end - see W_RR_OUT.
      Leave room and a mount; the SH775 is larger than a Podtronics, so mount it where the airflow
      actually is.
      ⚠️ THE STATOR'S RATED WATTAGE HAS NOT BEEN READ OFF ANYTHING - only the 0.4 ohm and 75V AC test
      values. It is what sizes MF_RR. [OPEN]
      Target 14.0-14.5V at 3-5k AND check body temperature. Never disconnect with the ignition on, and
      never disconnect the battery while running.

  K_MAIN:
    type: Relay
    subtype: ISO 280 micro, 20A, INTEGRAL FLYBACK DIODE - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      ** BUY RELAYS WITH AN INTEGRAL FLYBACK DIODE - decided 4 Sep 2026, closing issue #46. ** A relay
      coil is an inductor; opening it produces a reverse spike of several hundred volts. Stock had
      nothing to absorb it because stock had no relays and no semiconductors. This harness adds five
      relays, a solid-state flasher, a series regulator and a USB PD converter - and every one of
      those is a semiconductor that did not exist on the bike before.
      Integral rather than discrete: it is a catalogue option at no meaningful cost, it cannot be
      left out at assembly, and it cannot be wired backwards as a loose diode can.
      ⚠️ AN INTEGRAL DIODE MAKES 85/86 POLARITY MANDATORY. A diode-suppressed relay wired backwards is
      a dead short across the coil. 86 is COIL+ and 85 is COIL- on every relay in this harness, and
      the label schedule carries it.
      ALL FIVE RELAYS ARE ISO 280 MICRO and SEAT IN THE PDM rather than in separate sockets - the
      module's cavities are the 2.8mm 280 footprint. 20A parts (35A versions available) against a
      worst case of about 6.6A here, so every position sits well inside its rating.
      UPGRADE - keeps the whole switched load out of the ignition switch. That contact measured a
      healthy 0.1 ohm [meter 15 Aug 2026], so this is preventive rather than a repair. Fails safe
      (open = bike dead, key does nothing).
      CARRIES ABOUT 6.6A UNDER THE HYBRID SPLIT rather than the roughly 9A of a full stack - the
      headlamp and horn loads are fed hot and bypass these contacts entirely. This is the one relay
      whose failure kills the bike, which is what made it worth unloading.

  K_COIL:
    type: Relay
    subtype: ISO 280 micro, 20A, INTEGRAL FLYBACK DIODE - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - keeps coil current out of the kill switch. The kill switch now drives this coil (~0.15A)
      instead of passing ~6A through 44-year-old contacts. Socket it and keep it accessible - if it fails
      there is no spark. Fails safe (open = engine stops).


  K_HORN:
    type: Relay
    subtype: ISO 280 micro, 20A, INTEGRAL FLYBACK DIODE - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - keeps horn current out of the left cluster. Topology CONFIRMED BY METER 28 Aug 2026,
      which is what unblocked it: the horn button return is its own black net, left bar to horn, OPEN
      to the starter-trigger black. So the button switches the GROUND side in stock form, and this
      relay drops straight into that shape - 86 takes switched brown, the button pulls 85 to ground,
      contacts pass horn current. Behaviour at the bar is unchanged.
      THE CASE IS THE CONTACTS, NOT THE LOAD. The horn is only ~2A, but the RIGHT cluster measured
      3-5 ohm and the left is the same age and construction. 3 ohm at 2A is a 6V drop - a horn that
      barely sounds. Coil current is ~0.15A, where that resistance stops mattering.

  K_HI:
    type: Relay
    subtype: ISO 280 micro, 20A, INTEGRAL FLYBACK DIODE - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - high beam. See K_LO for the pair's design notes; they are one decision, not two.

  K_LO:
    type: Relay
    subtype: ISO 280 micro, 20A, INTEGRAL FLYBACK DIODE - seats in the PDM
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - low beam, and the second half of the beam pair. TWO RELAYS RATHER THAN A CHANGEOVER:
      the dimmer SELECTS between beams instead of switching one, so a single NO relay cannot do it,
      and two independent relays are cheaper to source, socket and carry spares for.
      ** THE WIPER IS MAKE-BEFORE-BREAK - THIS IS THE CONSTRAINT THE SCHEME HAS TO SURVIVE. ** R/BK
      and R/Y are open in both settled positions but blip CLOSED while the switch moves, so both coils
      energise together for the instant of the change [meter 28 Aug 2026, cluster unplugged]. Normal
      for the type and harmless - but it is exactly the assumption a naive two-relay wiring makes, so
      state it: BOTH BEAMS MAY BE LIT SIMULTANEOUSLY FOR A FRACTION OF A SECOND, and F5 must carry
      both at once without opening. Trivial with LED; 7A with the stock 50/35W filaments, which is why
      this only became comfortable alongside the LED decision.
      Bl is the COMMON and the supply [meter 28 Aug 2026], corroborated independently from the harness
      side by the HEAD fuse feeding Bl up to the bar. The dimmer now steers relay coils at ~0.15A each
      instead of passing the full lamp load through the bar contacts.
      ⚠️ MEASURE THE LED UNIT'S DRAW on the 87V 10A range - it sizes F5 and the beam gauge.

  LH:
    <<: *lh_cluster
    pinlabels: [Bl COMMON, R/BK HI, R/Y LO, O TURN FEED, G LEFT, Gy RIGHT, BK HORN, GND]
    notes: |-
      RETAINED STOCK PART - the rebuild keeps the switchgear, so the new harness has to mate this
      pigtail. Only the horn and dimmer ways are drawn so far; the turn ways are listed to hold their
      places and are NOT YET CONNECTED.
      ** FIVE WAYS IN THE 6P, NOT SIX - design input 3b. ** The stock 6P carries a brown that feeds
      NOTHING: it runs to a cavity the cluster does not populate, found 29 Aug 2026 by reading the far
      half. Do not reproduce it. Bl arrives on its own flying lead rather than through the 6P, and the
      horn BK is a separate spade - so the cluster's seven conductors are 5 in the 6P + Bl + BK.
      ** GND IS A NEW WIRE. ** Stock, the horn button earths through the cluster body; powder coating
      removes that path. See the GND bus notes.

  USB:
    type: USB-C PD charger
    subtype: 12V in - part not selected
    pinlabels: ["+12V", GND]
    notes: |-
      NEW CIRCUIT, 3 Sep 2026, and it REPLACES the stock accessory provision rather than extending it.
      Stock ran an R/W feed bolted to the battery stud - permanently live, unfused for two inches -
      to a second fuse box, and its two earth points were never connected at all [bench 2 Sep 2026].
      A live wire with no return, provisioned and left that way for 44 years. None of it is
      reproduced.
      ** SWITCHED, NOT ALWAYS-HOT, AND THAT IS THE WHOLE POINT OF REPLACING IT. ** Fed from F10 on
      the switched bus, so it dies with the key.
      ⚠️ THIS BIKE HAS NO PARASITIC LOAD AT ALL TODAY - points ignition, no ECU, no clock, no alarm.
      A PD charger left hot would be the first, and a phone left plugged in overnight would flatten a
      10Ah battery. Making it hot is a one-wire change at the PDM if that is ever wanted; making it
      hot BY DEFAULT would rebuild the exact fault this circuit exists to correct.
      ** IT GETS ITS OWN FUSE. ** F10, not shared. A USB socket is the circuit most likely to meet a
      failed cable or a passenger's unknown device, and that must not take the instruments with it.
      ⚠️ PART NOT SELECTED - see docs/part-selection.md for the criteria. Its input current sizes F10
      and is not knowable until a unit is chosen: roughly output watts over 12V times efficiency, so
      a 45W unit draws about 4.4A in.
      ⚠️ SIZE F10 FOR INRUSH, NOT JUST STEADY DRAW. A PD converter has capacitive input, and a fuse
      chosen on running current alone can nuisance-blow at switch-on.
  HORN:
    type: Horn
    subtype: 12V 2A
    pinlabels: [FEED, GND]
    notes: |-
      ⚠️ WAY 2 IS GND HERE, NOT SW - the factory model calls it SW and is right to. Stock switched the
      horn's RETURN through the left cluster body; the rebuild moves that switching to K_HORN's coil
      side, so this terminal is a permanent chassis return.

  HEAD:
    type: Headlight
    subtype: LED - part not selected
    pinlabels: [HI, LO, GND]
    notes: |-
      POLARITY MATTERS NOW. Filaments do not care which way round feed and ground are; LEDs do. This
      is the feed/ground reference for the beam circuits - draw every lamp branch with both identified.
      PART NOT SELECTED. Its measured draw sizes F5 and confirms the beam wire gauge; stock was 4.2A.

  FLASHER:
    type: Turn signal flasher
    subtype: load-independent solid-state, 3-pin
    pinlabels: [B+, LOAD, GND]
    notes: |-
      ** THREE PIN, AND THE GROUND WIRE GOES IN WHETHER THE CHOSEN PART NEEDS IT OR NOT. ** A 2-pin
      unit drops into the stock socket and is the common form; 3-pin adds a dedicated ground and is
      the more consistent design. The wire costs nothing in a harness being built from scratch and it
      keeps 3-pin parts on the table forever instead of locking the bike to 2-pin.
      LOAD-INDEPENDENT is the requirement, not a preference - a thermal flasher's rate depends on the
      current through it, so LED lamps make it flash far too fast or not at all. Want a wide current
      range, roughly 0.05-10A, so it drives LED now and would still drive filament on a revert.
      BUY ONE WITH REVERSE-POLARITY PROTECTION. Electronic flashers are polarity-sensitive where the
      stock thermal unit was not, and the cheap ones often omit it.
      ** THE SHARED-INDICATOR BACKFEED DOES NOT APPLY TO THIS BIKE. ** It has SEPARATE left and right
      dash indicators, so the two circuits are never bridged. Bikes with one shared indicator lamp
      backfeed through it once the lamps are LED; this one cannot. Part choice is issue #11.

  SIG_FL: {<<: *signal_lamp, subtype: "front left - LED"}
  SIG_FR: {<<: *signal_lamp, subtype: "front right - LED"}
  SIG_RL: {<<: *signal_lamp, subtype: "rear left - LED"}
  SIG_RR: {<<: *signal_lamp, subtype: "rear right - LED"}
  IND_L: {<<: *indicator, subtype: "left turn indicator - LED"}
  IND_R: {<<: *indicator, subtype: "right turn indicator - LED"}

  SP_SIG_L:
    style: simple
    type: Splice
    subtype: left turn net - 1 to 3
    notes: One switch output feeds the front lamp, the rear lamp and the dash indicator. Same on the right.
  SP_SIG_R:
    style: simple
    type: Splice
    subtype: right turn net - 1 to 3

  TAIL:
    <<: *taillight
    subtype: tail / brake - LED
    notes: |-
      ** DUAL INTENSITY IS THE THING TO VERIFY ON THE CHOSEN LED UNIT. ** A filament tail/brake lamp
      makes two brightnesses out of two filaments in one bulb and does not care about polarity. An
      LED unit may do it with two inputs, or with one input and a driver, or not at all. Pick the
      part before assuming this three-way footprint fits it, and check that TAIL and BRAKE can be
      driven simultaneously - stock lights the tail continuously and the brake ON TOP of it.
      No license lamp on the US/Canada bike; this lamp lights the plate.

  FBRK:
    <<: *brake_switch
    subtype: front, at the lever perch
    pinlabels: [FEED, OUT]
    notes: RETAINED STOCK PART, on its own pair of bullets rather than in the right-bar branch. Ways renamed from the factory model's colour labels - the rebuild's colours are different.
  RBRK:
    <<: *brake_switch
    subtype: rear, frame mounted
    pinlabels: [FEED, OUT]
    notes: RETAINED STOCK PART, in parallel with the front switch. Stock topology was read off the scan rather than metered - bench-verify at the ring-out.

  SP_BRK_FEED:
    style: simple
    type: Splice
    subtype: brake switch feed - 1 to 2
    notes: |-
      ** THIS FIXES A STOCK DEFICIENCY, AND IT IS WORTH BEING EXPLICIT ABOUT. ** Stock fed both brake
      switches from Br/W, which is UPSTREAM of the TAIL fuse - so the brake lamp was protected by
      nothing smaller than the 20A main. The rebuild gives the brake circuit its OWN fuse, F8.
      That also stops one blown fuse taking the tail and the brake together, which a shared feed
      would have done.

  SP_BRAKE:
    style: simple
    type: Splice
    subtype: brake lamp feed - two switches, one lamp
    notes: Front and rear switches are in parallel; either one lights the lamp.

  INSTR_6P:
    <<: *junction6p
    subtype: 6P connector, instrument pod
    pinlabels: [L TURN, R TURN, NEUTRAL FEED, NEUTRAL SW, HIGH BEAM, POD GND]
    notes: |-
      RETAINED STOCK PART - the pod pigtail survives, so the new harness has to mate it.
      ** CAVITY NUMBERS ARE THE STOCK ONES, READ AT THE BENCH 29 Aug 2026 ** - 3 rows of 2, mating
      face, keyway up, top row first; harness side FEMALE. Do not renumber them to suit the rebuild:
      the far half is the original pigtail and its cavities are fixed by the part.
      Ways 1 and 2 are the turn indicators and are NOT YET CONNECTED - they land with the signals.

  IND_N:
    <<: *indicator
    subtype: neutral indicator - LED
  IND_HB:
    <<: *indicator
    subtype: high-beam indicator - LED
  LAMP_SPD:
    <<: *indicator
    subtype: speedometer light - LED
  LAMP_TAC:
    <<: *indicator
    subtype: tachometer light - LED

  NSW:
    <<: *neutral_switch

  GND_ENG:
    type: Engine ground point
    subtype: block to star bus - HEAVY
    pinlabels: [STUD]
    notes: |-
      ** THIS STRAP CARRIES STARTER CURRENT, AND IT IS THE BIGGEST CASE OF BLOCKER 5. ** The starter
      motor grounds through its own case into the engine, so the engine-to-chassis path is the return
      for the entire cranking current - well over 100A - not a signal earth. Stock relied on the
      engine being bolted to a bare frame. ** THE FRAME IS BEING POWDER COATED, WHICH REMOVES EXACTLY
      THAT PATH. ** Drawn at 6 AWG to match the rest of the heavy starter loop.
      IT IS ALSO THE NEUTRAL SWITCH'S ONLY RETURN. NSW is a single-conductor case-grounding part -
      sealed, with nowhere to add a wire - so it earths through the engine whatever we do. Without
      this strap the neutral lamp does not work either, which is the cheap symptom of an expensive
      problem: a bike that cranks through some accidental path instead.

  SP_HI:
    style: simple
    type: Splice
    subtype: high-beam net - lamp plus indicator
    notes: The HI output feeds the headlight filament AND the dash indicator, so the indicator follows the beam rather than the switch. Same shape as stock, which took it off the same net.

  SP_TAIL:
    style: simple
    type: Splice
    subtype: tail / park net
    notes: |-
      ** THIS IS WHAT PRESERVES PARK. ** Fed from IGN way 2, which the switch table puts on battery in
      PARK (W-R) and on the fused tail feed in ON (R_Bl-R) [meter 15 Aug 2026]. So the tail lights in
      PARK with everything else dead, exactly as stock - and the ign_switch note's "preserve park
      function" is a drawn circuit rather than an intention.
      THE TAIL LAMP ONLY. The meter lamps are switched and hang on SP_MTR instead.

  SP_MTR:
    style: simple
    type: Splice
    subtype: meter lamp feed - 1 to 2
    notes: |-
      ** THESE LAMPS ARE SWITCHED, NOT PARK-FED. ** The stock node was B00.11, a Br/W double-female
      with one slot per meter lamp, and Br/W is switched - so stock's meter lamps died with the key
      [photo 2 Sep 2026].
      ⚠️ THAT CLOSURE RESTS ON THE PHOTOGRAPHS ALONE and has never been metered. If it is wrong these
      lamps belong on SP_TAIL. See docs/verification-plan.md, session A.

  SP_RLY:
    style: simple
    type: Splice
    subtype: relay coil supply - F11 out, 1 to 2
    notes: |-
      ** THIS NODE EXISTS TO SETTLE ISSUE #49. ** The horn relay's coil and the dimmer common used to
      tap SP_SW directly, upstream of every fuse, so their only protection was MF at 20A. One of them
      - the dimmer common - runs UP TO THE HANDLEBAR, which is the longest and most-flexed run on the
      bike and the classic chafe location. 18 AWG behind a 20A fuse is not protected; it is the fuse.
      Both now leave through F11 instead, and SP_SW feeds fuse inputs only.
      ONE FUSE FOR BOTH, not two. They are one functional group - switched supply to relay coils - and
      the shared-failure exposure is already there: F11 opening drops both beams, but so does F5, which
      feeds both beam relay commons through SP_HEAD. Splitting them would cost the last spare fuse
      position and buy no isolation that F5 does not already deny.
      Load is about 0.45A worst case - three coils at ~0.15A, all three live for the instant of the
      dimmer's make-before-break blip.

  SP_INSTR:
    style: simple
    type: Splice
    subtype: instrument feed - 1 to 2
    notes: |-
      F7 feeds BOTH the meter lamps and the neutral lamp, which until 3 Sep 2026 was drawn as two
      cables on ONE PDM way - against the one-wire-per-cavity rule a sealed cavity imposes, since it
      takes one seal on one wire. Found by the same count that produced SP_HOT and SP_SW (#50).
      So the fuse output leaves on a single wire and splits in the loom. A 2-into-1, same build form
      as the two feed buses.
      Load is three LED lamps, so this node is about sealing and terminal count rather than current.

  SP_POD_GND:
    style: simple
    type: Splice
    subtype: pod common ground bus - 1 to 3
    notes: |-
      RETAINED - this splice is inside the pod PIGTAIL, not the pod, and the pigtail survives.
      Observed 29 Aug 2026 and the count closes it at exactly three: six ways cross the 6P, eight
      wires leave the pigtail, five ways are signal, so 5 + 3 = 8.
      NOT a blocker 5 case - the pod already HAS a ground wire. It only needs re-terminating on the
      new bus.

  COIL_L:
    <<: *coil
    subtype: LEFT
  COIL_R:
    <<: *coil
    subtype: RIGHT
  PTS_L:
    <<: *points
    subtype: LEFT
  PTS_R:
    <<: *points
    subtype: RIGHT
  CAP_L:
    <<: *capacitor
    subtype: LEFT - STOCK PART
    notes: |-
      DRAWN 4 Sep 2026, closing issue #47. A points ignition does not work without condensers - they
      are what stops the contacts arcing as they open, and without them the points burn in hours.
      They were in the factory model and absent from this one, which would have read as a decision to
      delete them.
      ** ONE PART, NOT TWO ** [bench 4 Sep 2026]. A single bracket carrying two cans stacked axially,
      with a shared two-wire pigtail about 8 inches long, clamped to the bracket halfway along. YELLOW
      and BLUE, each ending in a male bullet. 0.24 +/- 0.02 uF, 1000 V DC, parallel across the points.
      Drawn as two connectors because they are electrically independent; ONE line in the BOM.
      ⚠️ IT EARTHED THROUGH TWO MOUNTING TABS TO THE FRAME, AND THAT PATH IS GONE. The frame is
      ALREADY powder coated, so masking - the cheap fix - is no longer available.
      ** SO IT GETS A GROUND WIRE, W_CAP_GND. ** A ring terminal captured under one of the two
      mounting bolts, wired to the star bus. That is better than abrading the landing anyway: the
      coating under the ring stops mattering entirely, and this is an ignition earth - a points
      ignition with no condenser return burns its contacts.
      ONE TAB IS ENOUGH [bench 4 Sep 2026]. Both cans share the one bracket, so the bracket IS the
      node and the two tabs are the same conductor - one carries, the other is mechanical support.
      A single ring under one bolt is therefore electrically complete rather than a compromise.
      The bracket has no ground provision of its own, so the ring goes under the existing bolt.
      ⚠️ THESE LEADS ARE NOT HARNESS WIRE. Like the points leads and the pod pigtail, they are factory
      pigtails on a retained part - see issue #52. Do not cut them, do not label them, and do not
      count them in the wire order.
  CAP_R:
    <<: *capacitor
    subtype: RIGHT - STOCK PART
    notes: Stock part, parallel across the right points. Same caveats as CAP_L - factory pigtail, not harness wire.

  SP_HEAD:
    style: simple
    type: Splice
    subtype: headlamp supply - feeds both beam relay commons
    notes: |-
      One fused feed, two relay commons. Drawn as a splice rather than by reusing one cable on two
      connection sets, because it IS one - and because the make-before-break blip puts both beams on
      this node at once. Size it and F5 for both, not for one.

  SP_YR:
    style: simple
    type: Splice
    subtype: Y/R coil feed - EI TAP POINT
    notes: |-
      Factory topology preserved - the kill switch output feeds both coils here, which is what makes the
      engine stop switch actually stop the engine. Keep this splice ACCESSIBLE and documented; it is the
      plug-in point for an EI module later.
      ** STOCK ALREADY MADE IT ACCESSIBLE, established 2 Sep 2026. ** This node is B03 on the old
      harness - a double-female bullet at 460mm along the trunk, one slot per coil. So the rebuild is
      PRESERVING a property rather than adding one, and a bullet node is a reasonable form to
      reproduce: it needs no tools to open and it is where an EI module would tap.

cables:

  W_BAT_SOL:  {<<: *w6,  colors: [RD]}
  W_SOL_SM:   {<<: *w6,  colors: [RD]}
  W_BAT_GND:
    <<: *w6
    colors: [BK]
    notes: Plain black, deliberately. The stock harness has BOTH Y/BK and BK/Y in it on two different ground nets, which cost this project a fortnight of dispute before the bench settled it - the new build does not inherit that ambiguity.
  W_MAIN_IN:
    <<: *w12
    colors: [RD]
    notes: |-
      Battery / starter relay stud to the main fuse. ROUNDED UP FROM 14 TO 12 AWG, 4 Sep 2026 - it
      was the only 14 AWG RD in the harness, so a whole spool bought one wire. 12 AWG RD is already
      on the list for the charging pair, and upsizing the shortest, highest-current feed on the bike
      costs nothing. It does not enter the PDM, so the cavity seal table does not care.
  W_MAIN_OUT:
    <<: *w14
    colors: [WH]
    notes: |-
      DESIGN INPUT FROM THE OLD HARNESS, 28 Aug 2026 - the one condition finding worth carrying into a
      new build. The stock harness melted at a bullet on this circuit: the 20A MAIN output, the highest
      current path on the bike, at a joint where the conductor size STEPS from one gauge to another.
      That is topology, not age. Build the same step at the same place in new wire and it heats again.
      So: no gauge change at a connector on the main power path, and no bullet carrying it. One gauge
      from the fuse to the distribution stud, and a terminal rated for it.
  W_IGN_FEED: {<<: *w16, colors: [RD]}
  W_IGN_RET:
    <<: *w16
    colors: [GY]
    notes: Ignition switch output - now drives the K_MAIN coil only (~0.15A), so this dropped from 16 to 18 AWG. The switch no longer carries the bike's load.

  W_RH_IN:
    <<: *w16
    colors: [YE]
    notes: Fed from PDM F2. Low current now - this only has to run the kill switch and, through it, two relay coils.
  W_YR_TRIG:
    <<: *w16
    colors: [GY]
    notes: |-
      Kill switch output. Drives K_COIL and, internally to the cluster, the starter button. Carries about
      0.3A instead of the stock ~6A. Still the node that makes the kill switch stop the engine - cutting
      it drops the coils.
  W_MAIN_SW_FEED:
    <<: *w14
    colors: [WH]
    notes: Main stud to the relay common. Short run inside the PDM; protected by the 20A main. Individual circuits are fused downstream of the relay.
  W_SW_BUS:
    <<: *w16
    colors: [BN]
    notes: |-
      Relay output - the switched brown bus. Under the hybrid split it carries the coil circuit through
      F3 plus the relay coils, about 6.6A, while the horn and headlamp loads are fed hot and never
      cross it.
      ** DROPPED FROM 14 TO 16 AWG, 4 Sep 2026. ** It was the only 14 AWG BN in the harness, so a whole
      minimum quantity bought one wire, and 16 AWG BN is already on the list at eight conductors.
      16 AWG carries 6.6A with room to spare on a run this short.
      NOTE THIS IS A ROUND-DOWN, against the standing round-up rule, and it is justified by the SKU
      rather than by the load. If the switched bus ever grows past about 10A, revisit it.
  # --- the two feed-side buses, outside the module - see SP_HOT / SP_SW ---
  W_HOT_F1:  {<<: *w16, colors: [RD], notes: "Hot bus to the F1 cavity. RD - always-hot per the scheme."}
  W_HOT_F4:  {<<: *w16, colors: [RD], notes: "Hot bus to the F4 cavity."}
  W_HOT_F5:  {<<: *w16, colors: [RD], notes: "Hot bus to the F5 cavity."}
  W_SW_F2:   {<<: *w16, colors: [BN], notes: "Switched bus to the F2 cavity. BN - switched power."}
  W_SW_F3:   {<<: *w16, colors: [BN], notes: "Switched bus to the F3 cavity."}
  W_SW_F6:   {<<: *w16, colors: [BN], notes: "Switched bus to the F6 cavity."}
  W_SW_F7:   {<<: *w16, colors: [BN], notes: "Switched bus to the F7 cavity."}
  W_SW_F8:   {<<: *w16, colors: [BN], notes: "Switched bus to the F8 cavity."}
  W_SW_F9:   {<<: *w16, colors: [BN], notes: "Switched bus to the F9 cavity."}
  W_SW_F10:  {<<: *w16, colors: [BN], notes: "Switched bus to the F10 cavity - the USB charger."}
  W_SW_F11:  {<<: *w16, colors: [BN], notes: "Switched bus to the F11 cavity - relay coil supply."}
  W_RLY_PWR: {<<: *w16, colors: [BN], notes: "PDM F11 out to the relay coil splice. Was two unfused taps off SP_SW - see SP_RLY and issue #49."}
  W_GND_MAIN:
    <<: *w12
    colors: [BK]
    notes: The signal ground bus up to the bolted star point. Carries all nineteen returns, about 5-8A, so it is 12 AWG rather than 16 - it is the only conductor on that path and there is no second route home.
  W_KMAIN_GND:
    <<: *w16
    colors: [BK]
    notes: K_MAIN coil ground to the star bus.
  W_COIL_PWR:
    <<: *w16
    colors: [YE]
    notes: |-
      Fused coil power into the relay. ** SWITCHED, NOT ALWAYS-HOT, AND THIS IS THE ONE THAT CANNOT BE
      TRADED. ** Coils must die with the key, and that has to hold even if K_COIL's contact welds - if
      F3 were hot, a welded contact would leave the engine running with the key out and the kill switch
      powerless, since the kill switch only drives this relay's coil. It is the sole exception to the
      hybrid split for exactly that reason. See the PDM notes.
  W_K_GND:
    <<: *w16
    colors: [BK]
    notes: K_COIL coil ground to the star bus.
  W_YR_OUT:
    <<: *w16
    colors: [YE]
    notes: Relay output to the coil splice. Kept Y/R to match the stock coil-feed colour so the circuit still reads as factory.
  W_COIL_L: {<<: *w16, colors: [YE]}
  W_COIL_R: {<<: *w16, colors: [YE]}
  W_PTS_L:
    <<: *w16
    colors: [YE]
    notes: Yellow serves LEFT - stamped plate, confirmed 15 Aug 2026, corroborated by the diagram. Factory braided jacket - do NOT strip it.
  W_CAP_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      NEW WIRE - no counterpart in the old harness. The condenser bracket earthed through its mounting
      tabs to the frame, and the frame is already powder coated.
      A ring terminal captured under one of the two mounting bolts, to the star bus. THIS IS AN
      IGNITION EARTH: a points ignition with no condenser return arcs its contacts and burns them.
      Unlike the other blocker-2 cases this one cannot be solved by masking, because the window closed.
  W_CAP_L:
    <<: *w16
    colors: [YE]
    notes: STOCK CONDENSER PIGTAIL, not harness wire - see CAP_L and issue #52. Drawn because the circuit is real; not cut, not labelled, not ordered.
  W_CAP_R:
    <<: *w16
    colors: [BU]
    notes: |-
      STOCK CONDENSER PIGTAIL, not harness wire - see CAP_L and issue #52.
      ** BLUE, NOT BLACK - corrected 4 Sep 2026 with the part in hand. ** It was drawn black by
      symmetry with the right points lead. It is not, and the black-is-never-a-signal guard had
      already been given an exemption for it - an exemption that was covering a wrong colour rather
      than a real exception. The exemption is withdrawn.
  W_PTS_R:
    <<: *w16
    colors: [BK]
    notes: Black serves RIGHT - stamped plate, confirmed 15 Aug 2026, corroborated by the diagram. Factory braided jacket - do NOT strip it.
  W_RH_OUT:
    <<: *w16
    colors: [YE]
    notes: |-
      Starter trigger. YE on the rebuild's scheme, which is the point of that scheme: the STOCK wire
      here was BLACK and was not a ground, and black is now ground-only precisely so this wire cannot
      be mistaken for one. Do not land it on the star bus.
  W_SOL_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      ⛔ ** DO NOT BUILD THIS CONNECTION. ** It was drawn on the claim that the relay's COIL- grounds
      directly, which is WITHDRAWN - the assembly has exactly TWO small leads, Y/R and BK, BOTH ENDING
      IN BULLETS INTO THE HARNESS, with no ring, eyelet or anything that lands on engine or frame
      [bench 2 Sep 2026]. See the starter_relay note in kz305-common.yml.
      LEFT DRAWN rather than deleted because there is no positive account of what replaces it, and
      deleting it would assert the coil has no return, which is also false. The meter settles it -
      blocker 3. [OPEN]
  # --- horn, relayed -------------------------------------------------
  W_HORN_COIL:
    <<: *w16
    colors: [GY]
    notes: |-
      Switched power to the K_HORN coil, ~0.15A. GY not BN - it is a relay coil drive, and the
      8-colour scheme groups those under grey.
      ⚠️ IT IS FED FROM THE SWITCHED BUS (PDM SW OUT), so the horn is dead with the key out even
      though F4 on the load side is always-hot. The colour describes the ROLE, not the source.
  W_HORN_SW:
    <<: *w16
    colors: [YE]
    notes: |-
      Horn button return - the relay's coil ground side, not a chassis ground. YE, not black: black is
      ground-only on the rebuild's scheme, and the stock wire here WAS black despite not being an
      earth. Its own net, open to the starter-trigger black [meter 28 Aug 2026].
      This is the wire that used to carry the horn's full 2A through the cluster contacts; it now
      carries 0.15A.
  W_LH_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      NEW WIRE - no counterpart in the old harness. The cluster earthed through its own body and the
      frame is being powder coated. Worked example of blocker 5.
  W_HORN_PWR:
    <<: *w16
    colors: [BU]
    notes: |-
      Fused horn power from PDM F4 into the relay common. ALWAYS-HOT per the hybrid split - the horn is
      still dead with the key out because its COIL is switched, and an open relay contact draws nothing.
  W_HORN_FEED:
    <<: *w16
    colors: [YE]
    notes: Relay output to the horn. ⚠️ DRAWN YE, WHICH IS OFF THE FUNCTION SCHEME - so is W_HORN_PWR on BU. Both are load-side horn wires and the scheme has no horn role; resolve with the palette, not by copying stock colours.
  W_HORN_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      Horn return to the star bus. STOCK HAD NO SUCH WIRE - the horn's second terminal went to the
      button. Relaying moves the switching to the coil side, so the load side now needs its own ground.

  # --- headlight, relayed --------------------------------------------
  W_HEAD_SUPPLY:
    <<: *w16
    colors: [BU]
    notes: |-
      Fused headlamp power from PDM F5 to the splice. ALWAYS-HOT per the hybrid split; the beams are
      dead with the key out because both relay coils are switched. Bl is the dimmer's common and supply
      in stock form - colour kept so the circuit still reads as factory. Sized for BOTH beams at once,
      per the make-before-break note on K_LO.
  W_HI_PWR:  {<<: *w16, colors: [BU], notes: Splice to the K_HI common.}
  W_LO_PWR:  {<<: *w16, colors: [BU], notes: Splice to the K_LO common.}
  W_DIM_COMMON:
    <<: *w16
    colors: [GN]
    notes: |-
      Switched supply up to the dimmer common. NOW A COIL-DRIVE WIRE, not a lamp feed - it carries the
      two relay coils (~0.15A each, ~0.3A worst case during the make-before-break blip) instead of the
      full lamp load. Dropped from 16 to 18 AWG for that reason.
  W_HI_TRIG:
    <<: *w16
    colors: [GY]
    notes: Dimmer HI output to the K_HI coil. Stock colour retained.
  W_LO_TRIG:
    <<: *w16
    colors: [GN]
    notes: Dimmer LO output to the K_LO coil. Stock colour retained.
  W_KHI_GND:  {<<: *w16, colors: [BK], notes: K_HI coil ground to the star bus.}
  W_KLO_GND:  {<<: *w16, colors: [BK], notes: K_LO coil ground to the star bus.}
  W_HEAD_HI:
    <<: *w16
    colors: [BU]
    notes: K_HI output to the HI filament. Stock colour retained.
  W_HEAD_LO:
    <<: *w16
    colors: [GN]
    notes: K_LO output to the LO filament. Stock colour retained.
  W_HEAD_GND:
    <<: *w16
    colors: [BK]
    notes: Headlight ground to the star bus. Stock earthed on BK/Y - ground Net B - which never reached the chassis ring. See the GND notes.

  # --- tail / park net, and the meter lamps on it ---------------------
  W_TAIL_FEED:
    <<: *w16
    colors: [BN]
    notes: PDM F6 to the ignition switch's TAIL1 way. Fused switched power in; the switch decides whether it or the battery feeds the tail net.
  W_TAIL_OUT:
    <<: *w16
    colors: [BU]
    notes: |-
      IGN way 2 out to the tail net. Fed from W_TAIL_FEED in ON and DIRECTLY FROM THE BATTERY in
      PARK - see SP_TAIL. Sized 16 AWG for the tail lamp that joins this net later, not for the two
      LED meter lamps it carries today.
  W_INSTR_FEED:
    <<: *w16
    colors: [BN]
    notes: PDM F7 out to the instrument splice - one wire per cavity. Splits at SP_INSTR into the meter feed and the neutral lamp feed.
  W_MTR_FEED:
    <<: *w16
    colors: [BN]
    notes: PDM F7 to the meter lamp splice. Switched instrument power, sharing the fuse with the neutral lamp.
  W_MTR_SPD: {<<: *w16, colors: [BN], notes: "Speedometer light. SWITCHED, not park-fed - see SP_MTR."}
  W_MTR_TAC: {<<: *w16, colors: [BN], notes: "Tachometer light, same net."}
  W_GND_SPD: {<<: *w16, colors: [BK]}
  W_GND_TAC: {<<: *w16, colors: [BK]}

  # --- USB-C PD charger, replacing the stock accessory circuit ----------
  W_USB_FEED:
    <<: *w16
    colors: [BN]
    notes: |-
      PDM F10 to the charger. SWITCHED - it dies with the key, deliberately. See USB.
      16 AWG covers a 45W unit at about 4.4A in with margin; confirm against the chosen part.
  W_USB_GND:
    <<: *w16
    colors: [BK]
    notes: Charger return to the star bus. Stock's accessory earths were never connected to anything - this circuit has a real one.

  # --- turn signals -----------------------------------------------------
  W_FLASH_IN:
    <<: *w16
    colors: [BN]
    notes: PDM F9 to the flasher. Switched, so the signals die with the key.
  W_FLASH_OUT:
    <<: *w16
    colors: [BU]
    notes: |-
      Flasher to the turn switch's feed way. BU rather than GN to keep the POWER INTO the switch
      distinct from the SWITCHED OUTPUTS either side of it - the three land on adjacent ways of the
      same cluster connector.
  W_FLASH_GND:
    <<: *w16
    colors: [BK]
    notes: Flasher ground. Drawn even though a 2-pin part would not use it - see FLASHER.
  W_SIG_L:
    <<: *w16
    colors: [GN]
    notes: |-
      ** LEFT IS GN AND RIGHT IS GY, DELIBERATELY. ** This is one of the few places colour is still
      the control. The front-left and front-right feeds run in the same bundle to the same place at
      the headlight shell, the lamps have no pinout to read, and swapping them gives a bike that
      indicates the wrong way - a safety fault, not an annoyance. Costs no extra SKU: GY is already
      bought in 18 AWG for the relay coil drives.
  W_SIG_R:  {<<: *w16, colors: [GY], notes: "Turn switch RIGHT output. GY not GN - see W_SIG_L."}
  W_SIG_FL: {<<: *w16, colors: [GN]}
  W_SIG_RL: {<<: *w16, colors: [GN]}
  W_SIG_FR: {<<: *w16, colors: [GY]}
  W_SIG_RR: {<<: *w16, colors: [GY]}
  W_IND_L:  {<<: *w16, colors: [GN], notes: "Left splice to the instrument 6P way 1."}
  W_IND_L2: {<<: *w16, colors: [GN], notes: "Pod-side leg to the left dash indicator."}
  W_IND_R:  {<<: *w16, colors: [GY], notes: "Right splice to the instrument 6P way 2."}
  W_IND_R2: {<<: *w16, colors: [GY], notes: "Pod-side leg to the right dash indicator."}
  W_GND_SIG_FL: {<<: *w16, colors: [BK]}
  W_GND_SIG_FR: {<<: *w16, colors: [BK]}
  W_GND_SIG_RL: {<<: *w16, colors: [BK]}
  W_GND_SIG_RR: {<<: *w16, colors: [BK]}
  W_GND_IND_L:  {<<: *w16, colors: [BK], notes: "Into the pod ground splice - see SP_POD_GND."}
  W_GND_IND_R:  {<<: *w16, colors: [BK], notes: "Into the pod ground splice - completes its 1-to-3."}

  # --- tail lamp and the brake circuit --------------------------------
  W_TAIL_RUN:
    <<: *w16
    colors: [BU]
    notes: Tail net to the tail filament. Lights in ON and in PARK - see SP_TAIL.
  W_BRK_FEED:
    <<: *w16
    colors: [BN]
    notes: PDM F8 to the brake splice. Its own fuse, unlike stock - see SP_BRK_FEED.
  W_BRK_FEED_F: {<<: *w16, colors: [BN], notes: "Splice to the front switch, at the lever perch."}
  W_BRK_FEED_R: {<<: *w16, colors: [BN], notes: "Splice to the rear switch, frame mounted."}
  W_BRK_OUT_F:  {<<: *w16, colors: [GN], notes: "Front switch out to the brake lamp splice."}
  W_BRK_OUT_R:  {<<: *w16, colors: [GN], notes: "Rear switch out to the brake lamp splice."}
  W_BRAKE:
    <<: *w16
    colors: [GN]
    notes: Brake splice to the lamp's BRAKE input. Distinct colour from the tail feed because the two land on adjacent ways of the same lamp and reversing them would give a lamp that is bright until you brake.
  W_GND_TAIL:
    <<: *w16
    colors: [BK]
    notes: Tail lamp return to the star bus. Stock earthed it on Net B, which never reached the chassis ring.

  # --- high beam indicator, off the beam net --------------------------
  W_HEAD_HI2:
    <<: *w16
    colors: [BU]
    notes: Splice to the HI filament. W_HEAD_HI now runs relay-to-splice rather than relay-to-lamp.
  W_IND_HB:  {<<: *w16, colors: [BU], notes: "Splice to the instrument 6P - the dash high-beam indicator."}
  W_IND_HB2: {<<: *w16, colors: [BU], notes: "Pod-side leg, 6P to the indicator."}
  W_GND_HB:  {<<: *w16, colors: [BK], notes: "Indicator return into the pod ground splice."}

  # --- neutral circuit -------------------------------------------------
  W_IND_N_FEED:
    <<: *w16
    colors: [BN]
    notes: PDM F7 to the instrument 6P - switched power for the neutral lamp.
  W_IND_N_FEED2: {<<: *w16, colors: [BN], notes: "Pod-side leg, 6P to the lamp."}
  W_NSW2:
    <<: *w16
    colors: [GY]
    notes: |-
      The lamp's RETURN, not a ground - it runs to the neutral switch, which closes to the engine
      case only in neutral. GY rather than BK for exactly that reason: black is ground only, and
      this wire is live whenever the key is on.
  W_NSW:
    <<: *w16
    colors: [GY]
    notes: |-
      Harness-side leg, 6P to the switch. Stock ran LIGHT GREEN here and the factory model draws it
      GN with a warning, because WireViz cannot separate LG from G. The rebuild sidesteps that: it
      is GY on the function scheme and light green is not bought at all.
      The 3.6 ohm contact resistance stops mattering with an LED - at ~20mA it costs ~0.07V against
      ~1.1V for the old incandescent. Still worth cleaning, no longer worth chasing.

  # --- pod ground and the engine strap ---------------------------------
  W_POD_GND2: {<<: *w16, colors: [BK], notes: "Pod-side leg - three indicator returns onto one conductor at the splice."}
  W_POD_GND:  {<<: *w16, colors: [BK], notes: "Harness-side leg, 6P to the star bus. Stock earthed this on Net B, which never reached the chassis ring."}
  W_ENG_GND:
    <<: *w6
    colors: [BK]
    notes: |-
      ** ENGINE TO STAR BUS, AND IT CARRIES CRANKING CURRENT. ** The starter motor grounds through
      its case into the engine, so this is the return for the whole starter draw - not a signal
      earth. 6 AWG to match the rest of the heavy loop. See GND_ENG for why the powder coating makes
      this a new part rather than a reproduction.

  W_ALT:
    <<: *w16
    colors: [YE, YE]
    notes: |-
      ** 16 AWG TO MATCH THE STATOR, NOT 14 - decided 4 Sep 2026, and NOT on cost. ** The stator has
      its own pigtail of about 8 inches ending in BULLETS [bench 4 Sep 2026], and it reads 16 AWG.
      ** A GAUGE STEP AT A BULLET ON A CURRENT PATH IS THE MECHANISM THAT MELTED THE ORIGINAL
      HARNESS. ** That is this project's single most important condition finding - see W_MAIN_OUT, and
      B06.4 in the factory model, where the 20A main met a smaller conductor at a separable joint.
      Running 14 AWG into a 16 AWG stator lead would rebuild that step on the charging circuit, which
      is a continuous-duty path rather than an intermittent one.
      So the standing "round up liberally" rule is deliberately NOT applied here. Matching beats
      upsizing whenever the joint is a bullet.
      ⚠️ THE SAME CHECK APPLIES AT THE OTHER END. The R/R mating pigtail comes from Eastern Beaver at
      whatever gauge they supply. Ask before ordering, and match it too. [OPEN]
      NOTE THE HARNESS STILL SUPPLIES THIS RUN - the stator's 8 inches does not reach the regulator,
      so this is wire we buy, not a retained pigtail like the pod's.
  W_RR_OUT:
    <<: *w12
    colors: [RD]
    notes: |-
      ** DC+ GOES DIRECT TO THE BATTERY, not through the PDM. ** The SH775 is a SERIES regulator and
      series units are sensitive to resistance in the DC path, so the pair runs heavy and direct with
      MF_RR at the battery end.
      12 AWG and plain red to match a direct battery run. ⚠️ THE GAUGE IS PROVISIONAL - blocker 1
      stands, and the stator's rated wattage has still not been read off anything. [OPEN]
  W_RR_BATT:
    <<: *w12
    colors: [RD]
    notes: Fuse to the battery positive. Kept as short as the mounting allows - see W_RR_OUT for why this path's resistance matters to a series regulator.
  W_RR_GND:  {<<: *w12, colors: [BK], notes: "Gauge raised from 14 to 12 to match W_RR_OUT - the return carries the same current as the feed."}

connections:

  # --- heavy starter path -------------------------------------------
  - - BATT: [1]
    - W_BAT_SOL: [1]
    - SOL: [1]
  - - SOL: [2]
    - W_SOL_SM: [1]
    - SM: [1]
  - - BATT: [2]
    - W_BAT_GND: [1]
    - GND: [1]
  - - SP_GND: [1]
    - W_GND_MAIN: [1]
    - GND: [4]

  # --- main feed through the 20A fuse --------------------------------
  - - SOL: [1]
    - W_MAIN_IN: [1]
    - MF: [1]
  - - MF: [2]
    - W_MAIN_OUT: [1]
    - SP_HOT: [1]

  # --- ignition switch loop -----------------------------------------
  - - PDM: [2]
    - W_IGN_FEED: [1]
    - IGN: [1]
  # --- ignition switch drives the main relay coil only --------------
  - - IGN: [3]
    - W_IGN_RET: [1]
    - K_MAIN: [3]
  - - K_MAIN: [4]
    - W_KMAIN_GND: [1]
    - SP_GND: [1]

  # --- main relay passes the whole switched bus ---------------------
  - - SP_HOT: [1]
    - W_MAIN_SW_FEED: [1]
    - K_MAIN: [1]
  - - SP_HOT: [1]
    - W_HOT_F1: [1]
    - PDM: [14]
  - - SP_HOT: [1]
    - W_HOT_F4: [1]
    - PDM: [15]
  - - SP_HOT: [1]
    - W_HOT_F5: [1]
    - PDM: [16]
  - - K_MAIN: [2]
    - W_SW_BUS: [1]
    - SP_SW: [1]
  - - SP_SW: [1]
    - W_SW_F2: [1]
    - PDM: [17]
  - - SP_SW: [1]
    - W_SW_F3: [1]
    - PDM: [18]
  - - SP_SW: [1]
    - W_SW_F6: [1]
    - PDM: [19]
  - - SP_SW: [1]
    - W_SW_F7: [1]
    - PDM: [20]
  - - SP_SW: [1]
    - W_SW_F8: [1]
    - PDM: [21]
  - - SP_SW: [1]
    - W_SW_F9: [1]
    - PDM: [22]
  - - SP_SW: [1]
    - W_SW_F10: [1]
    - PDM: [24]
  - - SP_SW: [1]
    - W_SW_F11: [1]
    - PDM: [26]

  # --- F11: fused supply for the relay coils that used to tap SP_SW ---
  - - PDM: [25]
    - W_RLY_PWR: [1]
    - SP_RLY: [1]

  # --- USB-C PD charger ---------------------------------------------
  - - PDM: [23]
    - W_USB_FEED: [1]
    - USB: [1]
  - - USB: [2]
    - W_USB_GND: [1]
    - SP_GND: [1]

  # --- FIXED: fused feed to the KILL SWITCH, not to the coils --------
  - - PDM: [3]
    - W_RH_IN: [1]
    - RH: [1]

  # --- kill switch drives the relay coil only (~0.15A) ---------------
