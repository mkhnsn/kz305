# =====================================================================
# NOT REPRODUCED FROM THE FACTORY HARNESS, deliberately
#
#   - The stock fuse holders and their fixed pigtail. The PDM replaces
#     them.
#   - Both stock ground nets. The star point replaces them.
#   - The right-bar distribution splices. The two stock 10A circuits
#     were fed from a splice inside the right-hand switch pigtail; the
#     PDM feeds its own fuses.
#   - The stock accessory circuit: a permanently live, unfused feed
#     with no return. The USB charger on F10 and the SAE point on
#     MF_TDR replace it.
#   - Two stock ways that served nothing: the switched brown into an
#     unpopulated cavity at the regulator and at the left cluster.
# =====================================================================
