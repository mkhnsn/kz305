# =====================================================================
# NOT YET DRAWN
#
#   DRAWN 1 Sep 2026 and no longer on this list: the horn with K_HORN,
#   and the headlight + dimmer with K_HI and K_LO.
#
#   Still from the factory transcription: 4x turn signals + flasher,
#   tail/brake, front/rear brake switches, instrument + indicator
#   lamps, neutral indicator, 6P junctions, accessory leads.
#
#   THE LH CLUSTER IS DRAWN BUT ONLY HALF CONNECTED. Its dimmer and
#   horn ways carry wire; the turn ways (O/G/Gy) are listed to hold
#   their places and go nowhere. Do not read the way list as complete.
#
#   NOT FROM THE FACTORY MODEL AT ALL, added 28 Aug 2026: the ground
#   wires for every component that earths through its own mounting
#   hardware in stock form. They have no counterpart to copy - the old
#   harness simply does not contain them - and the count is unknown
#   until ground Net B's earth points are traced through their child
#   harnesses. This is the largest single unknown in the rebuild's
#   wire count. See blocker 5 and the GND notes.
# =====================================================================
