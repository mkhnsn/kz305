# =====================================================================
# KZ305-B1 — REPLACEMENT HARNESS  (DRAFT - NOT BUILDABLE YET)
#
#   wireviz -f hps -p kz305-common.yml kz305-rebuild.yml
#
# This is the harness being built to replace the factory one. It must
# reproduce EVERY circuit in kz305-factory.yml - any circuit missing
# from the factory transcription is a circuit that will not exist on
# the bike.
#
# ---------------------------------------------------------------------
# BLOCKED - do not cut wire against this file yet
#
#   1. Factory transcription complete as of 19 Aug 2026 and REVISED
#      28 Aug 2026 by the first ring-out. Remaining unknowns are
#      listed at the foot of models/factory/signals.yml.
#
#      THE FUSE-CASCADE ARGUMENT IS WITHDRAWN. It was read off the
#      scan; the box on the bench has no internal bus and no brown
#      reaches it. Three independent circuits, printed on the box
#      itself: 20A MAIN, 10A HEAD, 10A TAIL. One 10A does NOT carry
#      the whole bike.
#
#      The per-circuit cavity map survives that, on better evidence:
#
#        - THE EARTH, NOT THE FUSING, WAS THE COMMON-MODE FAILURE.
#          Two ground nets, and the big one never reaches the ring
#          terminal at all - it earths through component mounting
#          hardware, outside the harness. See 5 below.
#        - A GAUGE STEP AT A BULLET ON THE 20A MAIN. That is where
#          the old harness melted, and the mechanism is topology, not
#          age - see W_MAIN_OUT.
#        - CHARGING RUNS THROUGH THE IGNITION SWITCH.
#          ** WITHDRAWN 29 Aug 2026. THIS IS NOT TRUE. ** It rested
#          on the R/R 4P having no spare pin, forcing brown to be the
#          DC output. At the bench the R/R half is populated on only
#          THREE cavities - the brown cavity is EMPTY - and the
#          SH221-12's fourth lead leaves as a W/R male bullet to
#          B04.6, joining the main power path to the starter relay
#          and fuse box. So stock charging does NOT pass the ignition
#          switch, and the factory model was right before it was
#          "corrected". Do not carry this into the rebuild as a
#          design driver. See W_RR_OUT and measurements/README.
#   2. No lengths YET, but the reference now exists: Step 1 measured
#      46 branches off the old harness, datum and trunk map recorded,
#      before anything was cut. Lengths still are not in this file -
#      transferring them is its own pass, and the BOM stays
#      meaningless until it happens. Render with -f hps.
#   3b. NOT A BLOCKER, A DESIGN INPUT, 29 Aug 2026 - TWO STOCK WAYS
#      SERVE NOTHING. The switched brown runs to a cavity the R/R does
#      not populate (B04.3) and to a cavity the LEFT CLUSTER does not
#      populate (B02.3). Both are live wires into empty mates, found by
#      reading the far half of each connector.
#      Do not reproduce either. The rebuild's left-bar connector needs
#      FIVE ways, not six. A STOCK WAY COUNT IS NOT A CIRCUIT COUNT,
#      and the difference is invisible from the harness side.
#      Likely cause: the loom is catalogued for A1/A2/B1/C1/D1 and
#      these ways are live on other variants.
#   3a. NOT A BLOCKER, A DESIGN INPUT, 29 Aug 2026 - THE STOCK 10A
#      FUSE FEEDS GO UP TO THE HANDLEBAR AND BACK. Neither 10A circuit
#      is fed at the fuse box. Both are fed from SP_RH_BR, a splice
#      inside the RIGHT-HAND SWITCH PIGTAIL, which is itself fed from
#      the switched brown bus: Br/W comes back down to the TAIL fuse,
#      Bl/W to the HEAD fuse. That is why both wires run between the
#      fuse box and the right-bar branch, which these models circled
#      for weeks without an explanation.
#      The rebuild has no reason to reproduce the detour - the PDM
#      feeds its own fuses - but it DOES have to keep the right-bar
#      connector's way count honest, because three of those ways only
#      exist to serve the detour. Revisit the RH 4P way list when the
#      PDM circuit list is final.
#   3. Fuse block part not selected - depends on final circuit count,
#      which now also depends on 5, and the count grew again on 1 Sep
#      when the relay policy took it to five relay positions.
#   6. NEW BLOCKER, 1 Sep 2026 - THE STARTER RELAY ASSEMBLY IS NOT
#      MAPPED, AND TWO CIRCUITS DEPEND ON IT. Everything in the
#      measurement log points AT the assembly and nothing IS it: no
#      terminal map, no lead lengths, no measured gauge. What that
#      blocks here:
#        - THE ACCESSORY FEED. A SECOND, two-fuse box was found
#          29 Aug; its W/Bl output fed B09 and WAS in service. It takes
#          power on an R/W jumper off the relay assembly. Whether that
#          jumper leaves the BATTERY stud or the switched side decides
#          if the accessory circuit is permanently live, and that is a
#          fuse assignment this rebuild cannot make blind.
#        - THE SOL WAY NUMBERS BELOW ARE FROM THE DIAGRAM, NOT THE
#          PART. They have never been checked against the housing. IGN
#          and FUSE_4P both had to be renumbered to physical cavities
#          once read; assume SOL will too.
#      Capture sheet: measurements/starter-relay.md.
#   7. ACCESSORY EARTHS WERE NEVER CONNECTED, 29 Aug 2026 - and that is
#      a design input, not a fault to reproduce. The accessory FEED was
#      in service but BOTH accessory grounds sat open their whole lives
#      on the oxidation evidence, so whatever was fed returned to the
#      frame some other way. The rebuild draws accessory circuits with
#      a real ground or not at all. NOT YET DRAWN either way, pending 6.
#   4. GAUGE IS UNMEASURED, harness-wide. Not one wire has had its
#      gauge taken with a tool; every bench value is an eyeball
#      estimate against an unverified 18 AWG baseline. Do not size
#      rebuild wire against the measurement log until the gauge pass
#      is done.
#   5. NEW BLOCKER, 28 Aug 2026 - THE STAR GROUND IS BIGGER THAN
#      DRAWN. The stock harness earths most components through their
#      own mounting hardware rather than through a ground wire, so
#      every one of those needs a NEW wire back to the bus. Those
#      wires do not exist in the old harness and appear nowhere in
#      either model. The count is the count of ground Net B's earth
#      points and it is NOT YET KNOWN - each has to be traced through
#      its own child harness. Until it is, the bus way count below is
#      a guess and the circuit count is not final.
# ---------------------------------------------------------------------
#
# DESIGN DECISIONS  (16 Aug 2026)
#
#   Connectors: HYBRID. Sealed where exposed or run-critical - charging,
#     ignition, grounds, main power, starter, anything under the tank or
#     at the headstock. Stock-style bullets where the run is sheltered
#     and serviceable - inside the headlight shell, instrument lamps,
#     inside signal housings. Water in the sleeve killed the original,
#     so sealing follows exposure, not circuit importance.
#
#   Lighting: FULL LED.
#   Ignition: POINTS NOW, EI-READY. Stock circuit unchanged; the Y/R
#     node stays an accessible, documented tap so EI is a plug-in later.
#   Regulator: MODERN SOLID-STATE, single-phase. See RR notes - the
#     series-type upgrade DOES apply - see the correction below.
#   High-current switch paths: RELAYED. See K_COIL.
#
# ---------------------------------------------------------------------
# FULL LED - three harness consequences, not just a warning
#
#   a. FLASHER. Wanted: LOAD-INDEPENDENT solid-state, so it flashes at a
#      constant rate regardless of what is hanging off it. Look for a
#      wide current range (roughly 0.05-10A) so it drives LEDs now and
#      would still drive incandescent if you ever revert.
#
#      2-pin (B+/load) is the common form and drops straight into the
#      stock 2-pin socket. 3-pin adds a dedicated ground and is the more
#      consistent design. RUN THE GROUND WIRE ANYWAY - it costs one wire
#      in a harness being built from scratch, and it keeps 3-pin parts
#      on the table forever instead of locking the bike to 2-pin.
#
#      Buy one with reverse-polarity protection: electronic flashers are
#      polarity-sensitive where the stock thermal unit was not, and the
#      cheap ones often omit the protection.
#
#      Good news for this bike: it has SEPARATE left and right indicator
#      lamps (12V 3.4W each, printed 255). Bikes with one shared
#      indicator bridge the two circuits and backfeed with LEDs. That
#      failure mode does not apply here.
#
#   b. REGULATOR HEAT - SOLVABLE AFTER ALL. A shunt regulator burns off
#      surplus as heat, so cutting load makes it work harder. The
#      genuine fix is a SERIES regulator, which open-circuits the stator
#      instead of shorting it, so the stator runs cooler too.
#
#      CORRECTED 18 Aug 2026. This file previously said the series units
#      (SH775 and friends) are three-phase and therefore do not fit.
#      That was wrong. They ARE three-phase parts, but a single-phase
#      stator connects to ANY TWO of the three AC inputs, which is
#      standard practice on single-phase classics - Nortons in
#      particular - and manufacturers reportedly accept it. So the
#      series option is open to this bike and is now the top pick.
#      See docs/part-selection.md.
#
#      The single-phase-specific parts (Podtronics, Boyer, Tympanium)
#      are all still SHUNT units. They run cooler than the stock SCR
#      through lower forward drop, but they still dissipate the surplus,
#      so with one of those full LED is an improvement, NOT a cure.
#      Measure regulator body
#      temperature on the first run, not just voltage - the 87V does
#      type-K thermocouple, so the instrument is already in hand.
#
#   c. POLARITY NOW MATTERS. Incandescent lamps do not care; LEDs do.
#      Every lamp branch must be drawn with feed and ground identified,
#      and the tail/brake dual-intensity function verified.
#
#   Bonus: the 3.6 ohm neutral switch ground path stops mattering. At
#   0.28A an incandescent indicator lost ~1.1V across it; an LED drawing
#   ~20mA loses ~0.07V. Still worth cleaning, no longer worth chasing.
#
# ---------------------------------------------------------------------
# DECIDED - HIGH-CURRENT PATHS GET RELAYS
#
#   Stock ran the full coil current through the kill switch. Yours
#   measured 3 ohm (kill) and 5 ohm (button), 8 ohm in series. K_COIL
#   now passes coil power; the kill switch only drives the relay coil,
#   so those contacts carry roughly 0.3A instead of ~6A and their
#   condition stops being load-bearing.
#
#   HONEST TRADE: this adds a part that did not exist. If K_COIL fails,
#   there is no spark. It fails SAFE (open = engine stops, which is what
#   a kill circuit should do) but it is a new single point of failure.
#   Use a quality relay, socket it, keep it accessible, carry a spare.
#
#   K_MAIN - DECIDED, drawn below. The ignition switch now drives a
#     relay coil instead of passing the bike's entire switched load.
#     Its contact measured a healthy 0.1 ohm, so this is preventive.
#     Fails safe (open = bike dead, key does nothing).
#
#   ** POLICY SET 1 Sep 2026: RELAY ANYTHING THAT USED TO RUN THROUGH
#   SWITCH CONTACTS DIRECTLY. ** This supersedes the case-by-case
#   deferrals below, which are kept for their reasoning rather than
#   their conclusions. Five relays: K_MAIN, K_COIL, K_HORN, K_HI, K_LO.
#
#   THE STARTER ALREADY COMPLIES - NO NEW RELAY, AND ADDING ONE WOULD
#   NOT HELP. SOL *is* the starter relay; the button has only ever
#   driven its coil, never the motor. Putting a K_START in front of it
#   would drive the new coil through the SAME degraded contacts, and a
#   relay coil (~0.15A) against a solenoid coil (~0.3A) is a 2x
#   improvement where K_COIL buys 20x. The measured problem is the
#   contacts themselves - button 5 ohm, kill 3 ohm, 8 ohm in series,
#   and the note on rh_cluster is blunt that a relay will NOT pull in
#   through 8 ohm. CLEAN THE CLUSTER. That is the fix, and no relay
#   substitutes for it: every one of the five above is driven through
#   those same contacts.
#
#   K_HORN - DECIDED AND NOW DRAWN, 1 Sep 2026. The horn and
#     the left cluster were transcribed 19 Aug, and 28 Aug confirmed the
#     topology by meter: the horn button return is its own black net,
#     left bar to horn, open to the starter-trigger black. So the button
#     does switch the GROUND side, as the design assumed - the relay
#     coil takes switched power on 86 and the button pulls 85 to ground;
#     contacts then pass horn current. Behaviour unchanged, the button
#     just stops carrying the load. Justification is measured: the horn
#     is only ~2A, but the RIGHT cluster contacts came back at 3-5 ohm,
#     and 3 ohm at 2A is a 6V drop - a horn that barely sounds. The left
#     cluster is the same age and construction.
#
#   HEADLIGHT - DECIDED AND NOW DRAWN as K_HI + K_LO, 1 Sep 2026. The
#     deferral below wanted the LED's measured draw first, on the
#     argument that a unit under ~2A through a cleaned switch needs no
#     relay at all. The policy above overrules that. Still measure the
#     draw - it sizes F5 and the beam gauge - but it is not a gate.
#     Kept because the two constraints it establishes are still binding:
#     The dimmer is metered and the common is settled: Bl is the common
#     and the supply, R/BK is HI, R/Y is LO. Open since 13 Aug, and it
#     was the thing standing in the way of a beam relay. The harness
#     side agrees independently - the HEAD fuse feeds Bl up to the bar -
#     which also establishes the case for relaying rather than assuming
#     it: the FULL LAMP LOAD passes through the bar-switch contacts,
#     fused and then switched at the handlebar.
#
#     TWO CONSTRAINTS FOR THE DESIGN, both now measured:
#       - It needs TWO relays or a changeover, since the dimmer selects
#         between beams rather than switching one.
#       - THE WIPER IS MAKE-BEFORE-BREAK. R/BK and R/Y blip closed
#         while the switch moves, so both beam outputs are tied for the
#         instant of the change. A two-relay scheme must TOLERATE both
#         coils energised together rather than assume the outputs are
#         mutually exclusive. Not a fault and normal for the type - but
#         it is exactly the assumption a naive two-relay wiring makes.
#
#     What is left is the load: pick the LED headlight and measure its
#     actual draw on the 87V 10A range. Stock was 4.2A; an LED unit
#     under ~2A through a cleaned switch does not need a relay at all.
#
#   THE HONEST COST OF THE POLICY. Each relay is a socket, a ground and
#   a failure point, and five of them is five new parts the bike never
#   had. The counter-argument used to be "relay where the switch is old
#   AND the current is high" - the horn at 2A and an LED headlight under
#   2A both fail the current half of that test. What carries the
#   decision instead is that EVERY cluster contact on this bike measured
#   degraded (3-5 ohm right, left same age and construction), and a
#   contact that drops 6V at 2A is not a switch, it is a resistor. The
#   relays move the load off 44-year-old contacts and leave them
#   carrying 0.15A, where their condition stops being load-bearing.
#   Socket every one, keep them accessible, carry spares.
# =====================================================================

connectors:

  BATT:
    <<: *battery

  GND:
    type: Star ground bus
    subtype: to bare chassis stud
    pinlabels: [BATT, RR, SOL, K_MAIN, K_COIL, K_HI, K_LO, LH CLUSTER, HORN, HEAD, ENG, SPARE]
    notes: |-
      UPGRADE - replaces the stock earth arrangement, and 28 Aug 2026 established that what it replaces
      is not what this note used to say. There is no single ring terminal carrying the harness. There
      are TWO ground nets: a small Y/BK net that does reach the ring, and a harness-wide BK/Y net that
      is OPEN to it and earths through the child harnesses at component mounting points - engine block,
      frame, wherever each part is bolted. One ring terminal, many earth points.
      GOOD NEWS: the big net is ONE net, not four, so it is one thing to re-terminate.
      BAD NEWS, AND IT IS SCOPE: every component that earthed through its mounting now needs a wire
      back to this bus that the old harness never had. The way list below is provisional until that
      count is known, and the frame is being powder coated, which removes the earth path those
      components were silently using.
      WAY COUNT GREW 1 Sep 2026 with the relay decision. FIVE relay coils now earth here, not two -
      K_MAIN, K_COIL, K_HORN, K_HI, K_LO. Each is only ~0.15A, so they cost way count rather than gauge.
      NOTE THERE IS NO K_HORN WAY. Its coil- does not come here - it goes to the horn button, and the
      button earths through LH CLUSTER. That is the stock ground-side switching preserved, and it is
      why the horn relay costs one bus way rather than two.
      LH CLUSTER IS A NEW WIRE AND A WORKED EXAMPLE OF BLOCKER 5. Stock, the horn button grounds
      through the CLUSTER BODY - established 29 Aug 2026 when the unsleeved LH pigtail turned out to
      carry seven leads and no eighth ground conductor. The frame is being powder coated, which removes
      exactly that path, so the rebuild runs a real wire. Every other mounting-earthed component needs
      the same treatment and the count is still unknown.
      Mask or scrape the stud back to bare metal. Acceptance is 0.0-0.1 ohm REL-zeroed on a Fluke 87V,
      which is the meter's floor - treat it as pass/fail, not a measurement.

  MF:
    <<: *main_fuse
    subtype: 20A inline, sealed holder

  PDM:
    type: Power distribution module
    subtype: TBD - PART NOT SELECTED, custom / semi-custom under consideration
    pinlabels: [MAIN STUD, F1 IGN SW FEED (HOT), F2 KILL FEED (SW), F3 COIL PWR (SW), F4 HORN PWR (HOT), F5 HEADLAMP PWR (HOT), F6 SPARE, SW IN (Br), SW OUT (Br), SW AUX (Br)]
    notes: |-
      UPGRADE - replaces the stock 20A main plus 2x 10A glass fuses. Cavity map PROVISIONAL; the circuit
      count is not final while the star-ground wire count is unknown (blocker 5). F2 feeds the KILL
      SWITCH, not the coils directly - see SP_YR. PART CHOICE - the relay decisions point at a sealed
      RTMR-style relay/fuse module rather than a plain blade fuse block: roughly 6-8 fused circuits and
      3-5 relay positions.
      ** STILL OPEN 1 Sep 2026, AND CUSTOM / SEMI-CUSTOM IS IN PLAY. ** Do not read the pin list as a
      chosen part's pinout - it is the circuit list the module has to satisfy, in a stable order so
      the connection sets can reference it. A custom build would make the two-busbar split below
      straightforward and free the way count from whatever a vendor happened to lay out; against
      that, a bought sealed module arrives weatherproofed and already rated. The requirements the
      pin list encodes are the same either way, which is why this decision does not block the rest
      of the model.
      ** CANDIDATE ROUTES, 1 Sep 2026: A METRI-PACK 280 ARRAY, OR THE MTA MODULAR FAMILY. ** MP280 is
      a 2.8mm blade on 22-14 AWG - the range this harness actually uses - and it mates BOTH a MINI
      (ATM) fuse and an ISO 280 micro relay, so one receptacle type still takes either and a
      position's role is decided by what is pushed in. Micro 280 relays are 20A with 35A versions,
      against a worst case of ~6.6A at K_MAIN, so every position sits well inside a 20A part.
      ** BUS THE FEED SIDE WITH SOLID BAR, WHICHEVER ROUTE. ** A wire per fuse input is N crimps on
      the main power path - the B06.4 mechanism rebuilt on purpose. This is also the thing to check
      on MTA: most of its modules carry NO common power and wire each terminal separately, which is
      the busbar problem in a nicer package. Two bars suit the hot/switched split above.
      ** SETTLED 1 Sep 2026: MTA 0301370, BUSES POINT-TO-POINTED AT ASSEMBLY. ** 60 sealed 2.8mm
      cavities, 30 MiniVal fuses or 10 micro relays or mixed, so one cavity type takes either. The
      catalogue's only bussed module (0301697) is fuses-only, not waterproof, and carries a SINGLE
      bus where this design needs two - so the two junctions get wired by hand instead.
      ** ONE WIRE PER CAVITY - DO NOT DAISY-CHAIN. ** A sealed cavity takes one cable seal on one
      wire, so the HOT and SWITCHED junctions are star points OUTSIDE the module. Keep HOT and
      SWITCHED positions at opposite ends of the block: interleaved, a mis-landed feed wire puts F3
      on permanent power, which is exactly the failure the split exists to prevent.
      Full comparison and the assembly rules in docs/part-selection.md.
      ** WHICH FUSES SIT BEHIND K_MAIN - DECIDED 1 Sep 2026, HYBRID. ** This was UNDEFINED until now:
      the model drew every PDM pin from the outside and said nothing about the module's internal bus,
      so whether a given fuse was switched or always-hot was not stated anywhere.
      ** THIS IS ARCHITECTURE, NOT PART SELECTION, AND IT BINDS WHATEVER THE PDM TURNS OUT TO BE. **
      THE PART IS NOT LOCKED - see the part note below. What the split means in practice:
        - BOUGHT MODULE: a requirement it has to meet. Not every RTMR-style unit splits its fused
          outputs across two sources, and one that cannot is disqualified by this, not adapted to.
        - CUSTOM OR SEMI-CUSTOM: two separate busbars, hot and switched, and the fuse positions
          land on one or the other. That is a build detail rather than a search filter, and it is
          the arrangement this split describes most naturally.
        HOT  - fed from MAIN STUD, live whenever the battery is:
          F1 IGN SW FEED  - must be hot; it feeds the switch that drives K_MAIN.
          F4 HORN PWR     - K_HORN's 30. Its coil is switched, so the horn is still dead with the key
                            out; only the contact side is hot.
          F5 HEADLAMP PWR - K_HI and K_LO commons, same arrangement.
        SW   - fed from SW IN, downstream of K_MAIN, dead with the key out:
          F2 KILL FEED    - the kill switch.
          F3 COIL PWR     - K_COIL's 30. ** THIS ONE IS NOT NEGOTIABLE - see below. **
      ** WHY K_COIL IS THE EXCEPTION. ** If F3 were hot and K_COIL's contact ever welded, the engine
      would keep running with the key out AND THE KILL SWITCH WOULD HAVE NO EFFECT, because the kill
      switch only drives that coil. Every other relay's welded-closed failure is a flat battery. That
      one is a bike you cannot stop. The rule the rest of this file states - coils must die with the
      key - is exactly this, and it survives a failed relay only if F3 is switched.
      ** NO PARASITIC DRAW FROM THE HOT FUSES. ** An un-energised relay is an open contact, so F4 and
      F5 sit at battery voltage against an open circuit and pass nothing. Hot here costs no drain.
      WHAT THE HYBRID BUYS: K_MAIN carries about 6.6A - the coil circuit plus four relay coils - rather
      than the roughly 9A of a full stack, and the headlamp and horn loads never cross its contacts at
      all. It is the one relay whose failure kills the bike, so it is the one worth unloading.
      ** RELAY COUNT IS NOW FIVE, 1 Sep 2026 ** - K_MAIN, K_COIL, K_HORN, K_HI, K_LO - which is at the
      TOP of that range, not in the middle. Size the module for five positions plus a spare, or accept
      that two of them live in separate sockets outside it. F4/F5 are new with the horn and beam relays.
      SW AUX exists because the switched brown bus now feeds three relay coils rather than one.
      BASELINE FOR THE LAYOUT, mapped off the old box 28 Aug 2026 with every fuse pulled. Three
      independent holders, no internal bus, each carrying its printed name: 20A MAIN (W in, W/R out),
      10A HEAD (Bl/W in, Bl out to the dimmer), 10A TAIL (R/Bl and Br/W, orientation not yet measured).
      That is what the block has to cover as a floor, not a set of wires to reproduce - the old box and
      its fixed pigtail do not survive.

  MF_RR:
    type: Charging fuse
    subtype: 30A inline, sealed holder - AT THE BATTERY END
    pinlabels: [IN, OUT]
    notes: |-
      NEW PART, 1 Sep 2026, and it does not exist on the stock bike - which fused the charging output
      nowhere. It protects the WIRE, not the regulator: a direct-to-battery DC pair is unfused by
      definition unless something is put in it, and an unfused conductor onto a battery post is the one
      thing a harness must not have.
      AT THE BATTERY END DELIBERATELY - a fuse at the regulator end leaves the whole run unprotected.
      RATING PROVISIONAL. 30A is a placeholder above the stock system's output and below the SH775's
      35A; it cannot be set properly until the stator's rated wattage is known, which nothing on this
      bike has yet stated. See blocker 4.

  IGN:
    <<: *ign_switch

  RH:
    <<: *rh_cluster
    pinlabels: [STOP IN (Br), LINK (Y/R), START OUT (BK)]

  SOL:
    <<: *starter_relay
  SM:
    <<: *starter_motor
  ALT:
    <<: *alternator
  RR:
    type: Regulator / rectifier
    subtype: Shindengen SH775 (Polaris 4012941), 3-phase 35A SERIES type - see docs/part-selection.md
    pinlabels: [AC1, AC2, AC3, DC+, GND]
    notes: |-
      IN HAND 29 Aug 2026 - the Polaris ORV takeoff has arrived. ORDERED 19 Aug 2026, eBay, $45. This supersedes the 18 Aug decision to fit a
      Podtronics shunt first and measure: the used-unit price hit the point where the SH775 wins outright
      (a SERIES type open-circuits the stator rather than shorting it, so regulator and stator run cooler
      and the LED heat problem is cured at source). Temperature measurement is now validation, not a
      decision gate. BENCH-TEST the used unit before build - a regulator either works or does not, and it
      is testable. The alternator is confirmed single-phase, two yellow leads, 0.4 ohm, permanent-magnet
      rotor, bench 18 Aug 2026; it connects to ANY TWO of the three AC inputs - standard practice on
      single-phase classics, manufacturers reportedly accept it. AC3 is deliberately unterminated. Only
      two of three rectifier legs are used, so capacity is below the 35A rating - does not matter here.
      CONNECTORS NOT YET ORDERED - two mating pigtails, 3-pin AC + 2-pin DC, Shindengen spec (fits the
      FH009-FH020 family), $16-22 openly sold; Eastern Beaver preferred for correct crimps and DC gauge.
      OPEN CHECK - part-selection.md wants the DC pair heavy gauge and direct to the battery, fused at
      the battery end; the model currently routes DC+ to the PDM main stud. Reconcile before cutting
      wire. The claim previously here - that the stock harness ran the whole charging current through
      the ignition switch - is WITHDRAWN 29 Aug 2026; stock routes R/R DC out on W/R to B04.6 and the
      starter-relay/fuse-box node, not through the switch. See W_RR_OUT. Leave room and a mount - the SH775 is larger than a Podtronics; mount where the airflow
      actually is. The stator's rated wattage has NOT been read off anything, only the 0.4 ohm and 75V
      AC test values. Target 14.0-14.5V at 3-5k AND check body temperature. Never disconnect with the
      ignition on, and never disconnect the battery while running.

  K_MAIN:
    type: Relay
    subtype: ISO mini, socketed
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - keeps the whole switched load out of the ignition switch. That contact measured a healthy
      0.1 ohm, so this is preventive rather than a repair, and it also stops the entire bike's supply from
      passing through a 44-year-old switch. Fails safe (open = bike dead, key does nothing).
      CARRIES ABOUT 6.6A UNDER THE HYBRID SPLIT, not the roughly 9A a full stack would put through it -
      the headlamp and horn loads are fed hot and bypass these contacts entirely. This is the one relay
      whose failure kills the bike, which is what made it worth unloading. See the PDM notes.

  K_COIL:
    type: Relay
    subtype: ISO mini, socketed
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - keeps coil current out of the kill switch. The kill switch now drives this coil (~0.15A)
      instead of passing ~6A through 44-year-old contacts. Socket it and keep it accessible - if it fails
      there is no spark. Fails safe (open = engine stops).


  K_HORN:
    type: Relay
    subtype: ISO mini, socketed
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - keeps horn current out of the left cluster. Topology CONFIRMED BY METER 28 Aug 2026,
      which is what unblocked it: the horn button return is its own black net, left bar to horn, OPEN
      to the starter-trigger black. So the button switches the GROUND side in stock form, and this
      relay drops straight into that shape - 86 takes switched brown, the button pulls 85 to ground,
      contacts pass horn current. Behaviour at the bar is unchanged.
      THE CASE IS THE CONTACTS, NOT THE LOAD. The horn is only ~2A, but the RIGHT cluster measured
      3-5 ohm and the left is the same age and construction. 3 ohm at 2A is a 6V drop - a horn that
      barely sounds. Coil current is ~0.15A, where that resistance stops mattering.

  K_HI:
    type: Relay
    subtype: ISO mini, socketed
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - high beam. See K_LO for the pair's design notes; they are one decision, not two.

  K_LO:
    type: Relay
    subtype: ISO mini, socketed
    pinlabels: [30 COMMON, 87 NO, 86 COIL+, 85 COIL-]
    notes: |-
      UPGRADE - low beam, and the second half of the beam pair. TWO RELAYS RATHER THAN A CHANGEOVER,
      decided 1 Sep 2026: the dimmer SELECTS between beams instead of switching one, so a single NO
      relay cannot do it, and two independent relays are cheaper to source, socket and carry spares for
      than one changeover unit.
      ** THE WIPER IS MAKE-BEFORE-BREAK - THIS IS THE CONSTRAINT THE SCHEME HAS TO SURVIVE. ** Metered
      28 Aug 2026 on the unplugged cluster: R/BK and R/Y are open in both settled positions but blip
      CLOSED while the switch moves, so both coils energise together for the instant of the change.
      That is normal for the type and harmless - but it is exactly the assumption a naive two-relay
      wiring makes, so state it: BOTH BEAMS MAY BE LIT SIMULTANEOUSLY FOR A FRACTION OF A SECOND.
      F5 must carry both beams at once without opening. With LED that is trivial; with the stock 50/35W
      filaments it would have been 7A, which is why this only became comfortable alongside the LED
      decision.
      Bl is the COMMON and the supply - metered the same day, and corroborated independently from the
      harness side by the HEAD fuse feeding Bl up to the bar. The dimmer now steers relay coils on
      ~0.15A each instead of passing the full lamp load through the bar contacts.
      DEFERRAL CLOSED 1 Sep 2026. This was held pending the LED headlight's measured draw, on the
      argument that a unit under ~2A through a cleaned switch needs no relay. Overruled by decision:
      relay everything that used to run through switch contacts directly. Still measure the draw on
      the 87V 10A range - it sizes F5 - but it is no longer a gate.

  LH:
    <<: *lh_cluster
    pinlabels: [Bl COMMON, R/BK HI, R/Y LO, O TURN FEED, G LEFT, Gy RIGHT, BK HORN, GND]
    notes: |-
      RETAINED STOCK PART - the rebuild keeps the switchgear, so the new harness has to mate this
      pigtail. Only the horn and dimmer ways are drawn so far; the turn ways are listed to hold their
      places and are NOT YET CONNECTED.
      ** FIVE WAYS IN THE 6P, NOT SIX - design input 3b. ** The stock 6P carries a brown that feeds
      NOTHING: it runs to a cavity the cluster does not populate, found 29 Aug 2026 by reading the far
      half. Do not reproduce it. Bl arrives on its own flying lead rather than through the 6P, and the
      horn BK is a separate spade - so the cluster's seven conductors are 5 in the 6P + Bl + BK.
      ** GND IS A NEW WIRE. ** Stock, the horn button earths through the cluster body; powder coating
      removes that path. See the GND bus notes.

  HORN:
    type: Horn
    subtype: 12V 2A
    pinlabels: [FEED, SW]

  HEAD:
    type: Headlight
    subtype: LED - part not selected
    pinlabels: [HI, LO, GND]
    notes: |-
      POLARITY MATTERS NOW. Filaments do not care which way round feed and ground are; LEDs do. This
      is the feed/ground reference for the beam circuits - draw every lamp branch with both identified.
      PART NOT SELECTED. Its measured draw sizes F5 and confirms the beam wire gauge; stock was 4.2A.

  COIL_L:
    <<: *coil
    subtype: LEFT
  COIL_R:
    <<: *coil
    subtype: RIGHT
  PTS_L:
    <<: *points
    subtype: LEFT
  PTS_R:
    <<: *points
    subtype: RIGHT

  SP_HEAD:
    style: simple
    type: Splice
    subtype: headlamp supply - feeds both beam relay commons
    notes: |-
      One fused feed, two relay commons. Drawn as a splice rather than by reusing one cable on two
      connection sets, because it IS one - and because the make-before-break blip puts both beams on
      this node at once. Size it and F5 for both, not for one.

  SP_YR:
    style: simple
    type: Splice
    subtype: Y/R coil feed - EI TAP POINT
    notes: |-
      Factory topology preserved - the kill switch output feeds both coils here, which is what makes the
      engine stop switch actually stop the engine. Keep this splice ACCESSIBLE and documented; it is the
      plug-in point for an EI module later.

# ---------------------------------------------------------------------
# CARRY-OVER FROM THE FACTORY BRANCH MAP (17 Aug 2026, revised 28 Aug)
#
#   The right bar is a DISTRIBUTION POINT in the stock harness, not just
#   a switch location - the switched brown splits three ways there, with
#   Br/W going to the 4P and Bl/W to a bullet. BOTH FAR ENDS ARE NOW
#   FOUND, and both land on the fuse box: Br/W is continuous to the box
#   and so is Bl/W. What is NOT settled is which way either one runs.
#   Whatever they feed still needs feeding in the new harness, and a
#   through-connection needs different wire from a tap. Do not finalise
#   this branch until the ring-out gives both directions.
#
#   ALSO CARRY OVER, and it is a circuit rather than a direction: a
#   SECOND Y/R NET exists on the old harness, on the fuse-box and
#   starter-relay branch, open to the coil-feed Y/R. Neither model
#   carries it. A circuit missing from the factory transcription is a
#   circuit that will not exist on the bike - find both its ends.
#   ONE END IS NOW KNOWN: B06.1, a male bullet on the B06 branch, open
#   to both B03 and B01.2. The other end is somewhere in the starter
#   relay assembly - so this closes with blocker 6, not separately.
# ---------------------------------------------------------------------

cables:

  W_BAT_SOL:  {<<: *w6,  colors: [RD]}
  W_SOL_SM:   {<<: *w6,  colors: [BK]}
  W_BAT_GND:
    <<: *w6
    colors: [BK]
    notes: Plain black, deliberately. The stock harness has BOTH Y/BK and BK/Y in it on two different ground nets, which cost this project a fortnight of dispute before the bench settled it - the new build does not inherit that ambiguity.
  W_MAIN_IN:  {<<: *w14, colors: [WH]}
  W_MAIN_OUT:
    <<: *w14
    colors: [WH]
    notes: |-
      DESIGN INPUT FROM THE OLD HARNESS, 28 Aug 2026 - the one condition finding worth carrying into a
      new build. The stock harness melted at a bullet on this circuit: the 20A MAIN output, the highest
      current path on the bike, at a joint where the conductor size STEPS from one gauge to another.
      That is topology, not age. Build the same step at the same place in new wire and it heats again.
      So: no gauge change at a connector on the main power path, and no bullet carrying it. One gauge
      from the fuse to the distribution stud, and a terminal rated for it.
  W_IGN_FEED: {<<: *w16, colors: [WH]}
  W_IGN_RET:
    <<: *w18
    colors: [BN]
    notes: Ignition switch output - now drives the K_MAIN coil only (~0.15A), so this dropped from 16 to 18 AWG. The switch no longer carries the bike's load.

  W_RH_IN:
    <<: *w16
    colors: [BN]
    notes: Fed from PDM F2. Low current now - this only has to run the kill switch and, through it, two relay coils.
  W_YR_TRIG:
    <<: *w18
    colors: [YERD]
    notes: |-
      Kill switch output. Drives K_COIL and, internally to the cluster, the starter button. Carries about
      0.3A instead of the stock ~6A. Still the node that makes the kill switch stop the engine - cutting
      it drops the coils.
  W_MAIN_SW_FEED:
    <<: *w14
    colors: [WH]
    notes: Main stud to the relay common. Short run inside the PDM; protected by the 20A main. Individual circuits are fused downstream of the relay.
  W_SW_BUS:
    <<: *w14
    colors: [BN]
    notes: |-
      Relay output - the switched brown bus. NO LONGER FEEDS EVERYTHING, 1 Sep 2026: under the hybrid
      split it carries the coil circuit through F3 plus four relay coils, about 6.6A, while the horn and
      headlamp loads are fed hot and never cross it. Kept at 14 AWG anyway - it is the main switched
      path, the margin is cheap, and the load grows as the undrawn circuits land.
  W_KMAIN_GND:
    <<: *w18
    colors: [BK]
    notes: K_MAIN coil ground to the star bus.
  W_COIL_PWR:
    <<: *w16
    colors: [BN]
    notes: |-
      Fused coil power into the relay. ** SWITCHED, NOT ALWAYS-HOT, AND THIS IS THE ONE THAT CANNOT BE
      TRADED. ** Coils must die with the key, and that has to hold even if K_COIL's contact welds - if
      F3 were hot, a welded contact would leave the engine running with the key out and the kill switch
      powerless, since the kill switch only drives this relay's coil. It is the sole exception to the
      hybrid split for exactly that reason. See the PDM notes.
  W_K_GND:
    <<: *w18
    colors: [BK]
    notes: K_COIL coil ground to the star bus.
  W_YR_OUT:
    <<: *w16
    colors: [YERD]
    notes: Relay output to the coil splice. Kept Y/R to match the stock coil-feed colour so the circuit still reads as factory.
  W_COIL_L: {<<: *w16, colors: [YERD]}
  W_COIL_R: {<<: *w16, colors: [YERD]}
  W_PTS_L:
    <<: *w18
    colors: [YE]
    notes: Yellow serves LEFT - stamped plate, confirmed 15 Aug 2026, corroborated by the diagram. Factory braided jacket - do NOT strip it.
  W_PTS_R:
    <<: *w18
    colors: [BK]
    notes: Black serves RIGHT - stamped plate, confirmed 15 Aug 2026, corroborated by the diagram. Factory braided jacket - do NOT strip it.
  W_RH_OUT:
    <<: *w18
    colors: [BK]
    notes: Starter trigger. BK but NOT a ground - do not land it on the star bus.
  W_SOL_GND:
    <<: *w18
    colors: [BK]
    notes: Direct to the star bus. CONFIRMED 15 Aug 2026 - no neutral-switch interlock in this circuit.
  # --- horn, relayed -------------------------------------------------
  W_HORN_COIL:
    <<: *w18
    colors: [BN]
    notes: Switched brown to the K_HORN coil. ~0.15A.
  W_HORN_SW:
    <<: *w18
    colors: [BK]
    notes: |-
      Horn button return - relay coil ground side. BK but NOT a chassis ground; it lands on the relay,
      not the bus. CONFIRMED as its own net 28 Aug 2026, open to the starter-trigger black. This is the
      wire that used to carry the horn's full 2A through the cluster contacts; it now carries 0.15A.
  W_LH_GND:
    <<: *w18
    colors: [BK]
    notes: |-
      NEW WIRE - no counterpart in the old harness. The cluster earthed through its own body and the
      frame is being powder coated. Worked example of blocker 5.
  W_HORN_PWR:
    <<: *w16
    colors: [BN]
    notes: |-
      Fused horn power from PDM F4 into the relay common. ALWAYS-HOT per the hybrid split - the horn is
      still dead with the key out because its COIL is switched, and an open relay contact draws nothing.
  W_HORN_FEED:
    <<: *w16
    colors: [BN]
    notes: Relay output to the horn. Kept brown to match the stock feed colour.
  W_HORN_GND:
    <<: *w16
    colors: [BK]
    notes: |-
      Horn return to the star bus. STOCK HAD NO SUCH WIRE - the horn's second terminal went to the
      button. Relaying moves the switching to the coil side, so the load side now needs its own ground.

  # --- headlight, relayed --------------------------------------------
  W_HEAD_SUPPLY:
    <<: *w16
    colors: [BU]
    notes: |-
      Fused headlamp power from PDM F5 to the splice. ALWAYS-HOT per the hybrid split; the beams are
      dead with the key out because both relay coils are switched. Bl is the dimmer's common and supply
      in stock form - colour kept so the circuit still reads as factory. Sized for BOTH beams at once,
      per the make-before-break note on K_LO.
  W_HI_PWR:  {<<: *w16, colors: [BU], notes: Splice to the K_HI common.}
  W_LO_PWR:  {<<: *w16, colors: [BU], notes: Splice to the K_LO common.}
  W_DIM_COMMON:
    <<: *w18
    colors: [BU]
    notes: |-
      Switched supply up to the dimmer common. NOW A COIL-DRIVE WIRE, not a lamp feed - it carries the
      two relay coils (~0.15A each, ~0.3A worst case during the make-before-break blip) instead of the
      full lamp load. Dropped from 16 to 18 AWG for that reason.
  W_HI_TRIG:
    <<: *w18
    colors: [RDBK]
    notes: Dimmer HI output to the K_HI coil. Stock colour retained.
  W_LO_TRIG:
    <<: *w18
    colors: [RDYE]
    notes: Dimmer LO output to the K_LO coil. Stock colour retained.
  W_KHI_GND:  {<<: *w18, colors: [BK], notes: K_HI coil ground to the star bus.}
  W_KLO_GND:  {<<: *w18, colors: [BK], notes: K_LO coil ground to the star bus.}
  W_HEAD_HI:
    <<: *w16
    colors: [RDBK]
    notes: K_HI output to the HI filament. Stock colour retained.
  W_HEAD_LO:
    <<: *w16
    colors: [RDYE]
    notes: K_LO output to the LO filament. Stock colour retained.
  W_HEAD_GND:
    <<: *w16
    colors: [BK]
    notes: Headlight ground to the star bus. Stock earthed on BK/Y - ground Net B - which never reached the chassis ring. See the GND notes.

  W_ALT:     {<<: *w14, colors: [YE, YE]}
  W_RR_OUT:
    <<: *w12
    colors: [RD]
    notes: |-
      ** THIS NOTE PREVIOUSLY ASSERTED A WITHDRAWN CLAIM. CORRECTED 1 Sep 2026. ** It said the stock
      R/R output is brown, lands on the switched brown bus, and therefore returns every charging amp
      through the ignition switch contacts - presented as measured 28 Aug. That is NOT TRUE and was
      withdrawn on 29 Aug at the head of this file, but the withdrawal never reached this cable. At the
      bench the R/R half of B04.3 is populated on only THREE cavities - the brown one is EMPTY - and
      the SH221-12's fourth lead leaves as a W/R male bullet to B04.6, joining the main power path.
      Stock charging does NOT pass the ignition switch. Do not carry the old claim forward as a design
      driver; the factory model was right before it was "corrected".
      ** ROUTE RECONCILED 1 Sep 2026 - DC+ NOW GOES DIRECT TO THE BATTERY. ** This file used to land it
      on the PDM main stud, against part-selection.md, and flagged the difference as an open check. The
      check is closed in part-selection's favour, and NOT on the withdrawn argument: the SH775 is a
      SERIES regulator and series units are sensitive to resistance in the DC path, so the pair runs
      heavy and direct with the fuse at the battery end. That is a property of the part now in hand,
      which the old routing predated.
      Gauge raised from 14 to 12 AWG and colour to plain red to match a direct battery run. THE GAUGE IS
      PROVISIONAL - blocker 4 stands, and the stator's rated wattage has still not been read off
      anything.
  W_RR_BATT:
    <<: *w12
    colors: [RD]
    notes: Fuse to the battery positive. Kept as short as the mounting allows - see W_RR_OUT for why this path's resistance matters to a series regulator.
  W_RR_GND:  {<<: *w12, colors: [BK], notes: "Gauge raised from 14 to 12 to match W_RR_OUT - the return carries the same current as the feed."}

