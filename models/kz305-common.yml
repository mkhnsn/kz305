# =====================================================================
# KZ305-B1 — shared definitions
#
# Prepended to BOTH models. Nothing here describes topology; this file
# holds only things true of the parts themselves, plus bench-confirmed
# measurements that must never drift between the two drawings.
#
#   wireviz -p kz305-common.yml kz305-factory.yml   # as-built reference
#   wireviz -p kz305-common.yml kz305-rebuild.yml   # the rebuild
#
# The "templates" key is ignored by WireViz; it exists to anchor values.
# See models/factory/00-notes.yml for the evidence-tag convention used
# in every note in these files.
#
# Kawasaki -> WireViz color codes:
#   W=WH  Br=BN  R=RD  BK=BK  Y=YE  Bl=BU  Gy=GY  O=OG  G=GN
#   Y/R=YERD  Y/BK=YEBK  R/BK=RDBK  R/Y=RDYE  Br/W=BNWH  Bl/W=BUWH
#   R/Bl=RDBU
#
# ---------------------------------------------------------------------
# !! NEVER IDENTIFY A LEAD BY COLOUR ALONE
#
#    Four of the eight colours rung carry more than one circuit
#    [meter 28 Aug 2026]:
#
#      BK  = right points lead, starter trigger, chassis grounds, horn
#            button return. Horn return and starter trigger are
#            CONFIRMED separate nets, open to each other.
#      YE  = left points lead, alternator phases. Separated by
#            continuity, NOT by gauge - both look the same on the bench.
#      Y/R = kill switch output / coil feed (SP_YR) AND a SECOND,
#            independent Y/R net on the fuse-box and starter-relay
#            branch, open to it. Net 2 is the starter relay's coil
#            feed, identified by gender complement [arith 2 Sep 2026].
#      Bl  = brake lamp feed, the fused headlight supply to the dimmer,
#            AND the right condenser lead [bench 4 Sep 2026]. THREE
#            roles. The first two are measured open to each other; the
#            third is on the points circuit and is a third net again.
#
#    AND THE REVERSED PAIRS. Not collisions, but worse - they LOOK like
#    the same wire written two ways, and on this bike BOTH members of
#    each pair physically exist:
#
#      W/R vs R/W   W/R (WHITE base) is the main power path and the
#                   R/R's DC output. R/W (RED base) feeds the second,
#                   two-fuse box off the starter-relay assembly.
#                   [bench 29 Aug 2026, both in hand]
#      Y/BK vs BK/Y Y/BK (YELLOW base) is ground Net A, the unused
#                   accessory earth. BK/Y (BLACK base) is Net B, the
#                   harness-wide return. Open to each other.
#      Br/W vs W/Br, W/Bl vs Bl/W - both pairs have cost this project
#                   time twice each.
#
#    BASE COLOUR FIRST, ALWAYS, and say so. A record that does not
#    state the base colour is ambiguous and cannot be repaired by
#    inference - re-read the wire.
#
#    Ring out to the endpoint before terminating. This includes
#    identifications made in these models from the scan.
# ---------------------------------------------------------------------
#
# ---------------------------------------------------------------------
# !! THE REBUILD USES SOLID COLOURS ONLY - decided 1 Sep 2026
#
#    No tracer wire. Custom striped TXL carries minimum order
#    quantities that make no sense for one bike, so identification
#    moves to PRINTED HEAT-SHRINK LABELS plus docs/label-schedule.md.
#
#    ** THIS KILLS THE REVERSED-PAIR FAILURE MODE OUTRIGHT. ** With no
#    tracers there are no pairs left to reverse.
#
#    THE PRICE is that colour alone separates fewer circuits. The
#    scheme is therefore FUNCTION-BASED and deliberately SMALL - EIGHT
#    solids, sized on BOM cost, where the driver is (colour x gauge)
#    SKUs rather than the colour count:
#
#      BK  ground ONLY - never a signal, never a feed
#      RD  always-hot / battery / unfused main
#      WH  fused main power, pre-relay
#      BN  switched power - the bus and its fused feeds
#      YE  ignition, coil, starter trigger
#      GY  control and trigger signals - relay coil drives, switch
#          returns, and the RIGHT turn circuit
#      BU  lighting supply and HIGH beam  - USE LIGHT BLUE, see below
#      GN  LOW beam, dimmer common, and the LEFT turn circuit
#
#    11 colours is 21 SKUs; 8 is 17; 7 is 16; 5 is 15. Below about
#    seven the saving stops - SKU count is dominated by the gauge
#    spread - so dropping further costs safety distinctions and buys
#    almost nothing. Eight is the knee, and it is where HIGH and LOW
#    beam stay different colours.
#
#    ** LEFT IS GN AND RIGHT IS GY ON PURPOSE. ** The front-left and
#    front-right signal feeds run in the same bundle to the same place
#    at the headlight shell, and a signal lamp has no pinout to read,
#    so colour is the only thing that separates them. Swapping them
#    gives a bike that indicates the wrong way - a safety fault rather
#    than an annoyance. It costs no extra SKU.
#
#    ** WHERE COLOUR IS NOT THE CONTROL. ** Colour only has to
#    disambiguate where nothing else does:
#      - RELAYS identify themselves. 30/85/86/87 are moulded on.
#      - MAPPED CONNECTORS have a cavity map and a printed label - the
#        PDM, the bar clusters, the instrument 6P.
#      - THE POINTS LEADS are in a factory braided jacket,
#        unmistakable against new TXL whatever colour it is.
#    What is left - lamps, splices, free bullets - is where a swap has
#    no other check, and that is what the guard enforces.
#
#    TWO DOCUMENTED EXCEPTIONS, both forced by parts we do not make:
#      - W_PTS_R is BLACK and is NOT a ground. Factory contact breaker
#        lead in a braided jacket - do not strip it, and do not land it
#        on the star bus.
#      - The 6 AWG heavy path is red/black battery cable, so W_BAT_SOL
#        and W_SOL_SM are both RD at SOL. They are lugs on separate
#        studs and cannot physically be interchanged.
#
#    THE FACTORY MODEL IS UNAFFECTED - it records what the bike HAD, in
#    the stock two-colour codes, and remains the cross-reference.
# ---------------------------------------------------------------------
#
# !! WireViz has no light-green code, so Kawasaki LG and G BOTH render
#    as GN. Any LG lead is tagged in its notes. Do not read green off
#    the drawing and assume it is G.
#
# !! NEVER PUT A BARE > OR < IN A notes: BODY. WireViz renders notes
#    into a graphviz HTML-like label, where those characters open and
#    close tags, so "raised 14 -> 12 AWG" fails the build with an
#    opaque "syntax error ... near 'AWG'" pointing at generated dot,
#    not at the YAML. Write "from 14 to 12" instead.
#
# !! A COLON OR A COMMA IN AN INLINE notes: VALUE SPLITS THE MAPPING.
#    Use a block scalar (|-) for any note carrying either.
# =====================================================================

templates:

  # ---- wire gauges -------------------------------------------------
  # Gauge only. length_unit lives in the rebuild file, which is the one
  # that gets cut; the factory model carries no lengths at all so the
  # BOM cannot report a fabricated zero.
  # WIRE DECIDED 1 Sep 2026: TXL from Prowire. Thin-wall XLPE, 125 C, SAE
  # J1128. The choice is not only thermal - TXL's thin wall sets the MTA
  # cavity SEAL size, and GXL or SXL in the same gauge would need a
  # different seal part number. See docs/part-selection.md.
  #
  #   AWG   OD (inch col)     OD (mm col)   seal implied
  #   18    0.078in / 1.98mm  2.20mm        RED 4550748  /  GREEN 4550747
  #   16    0.089in / 2.26mm  2.40mm        GREEN        /  GREEN
  #   14    0.102in / 2.59mm  2.70mm        GREEN        /  GREEN
  #   12    0.127in / 3.23mm  3.30mm        GREY 4550749 /  GREY  - not in the PDM
  #
  # ** THE HARNESS IS ALL 16 AWG ABOVE 14 - decided 4 Sep 2026. ** Every conductor
  # that was 18 AWG is now 16. Three independent reasons, none of them decisive
  # alone:
  #   - A STOCK HARNESS WIRE MEASURES 1.29-1.45mm at the stripped conductor
  #     [bench 4 Sep 2026], and 16 AWG nominal is 1.291mm against 18 AWG's
  #     1.024mm. Kawasaki used 16; the long-standing "common size is 18 AWG"
  #     label was never measured.
  #   - IT COLLAPSES 15 WIRE SKUs TO 10 and merges each colour into a higher
  #     price tier. Cost came out a wash - 16 AWG black is CHEAPER per foot than
  #     18 AWG black at the 100ft tier.
  #   - IT LEAVES ONE CAVITY SEAL. See below.
  # The loads never wanted 16 - they are 0.15A relay coils and a 4.2A beam - so
  # this is not an ampacity decision. It is a parts-count and matching decision.
  #
  # ⚠️ PROWIRE'S OWN CHART DISAGREES WITH ITSELF, 4 Sep 2026. Its inch and mm
  # columns are not conversions of each other - the mm figures run 0.05 to
  # 0.22mm larger, and the gap is biggest exactly where it matters:
  #
  #   18 AWG is 1.98mm by the inch column, which fits the RED seal (1.2-2.1),
  #   and 2.20mm by the mm column, which DOES NOT - it needs GREEN (2.2-3.0).
  #
  # Every other gauge lands on the same seal either way. This model took the
  # INCH column, which is where the 1.98 / 2.26 / 2.59 / 3.23 figures came from.
  #
  # ** THE CONFLICT IS NOW MOOT. ** 18 AWG was the ONLY gauge where the two
  # columns implied different seals, and there is no 18 AWG left in the harness.
  # 16 AWG lands in GREEN on either column - 2.26mm by the inch figure, 2.40mm by
  # the mm figure - so every cavity wire takes green and the question does not
  # need answering. The 40 red seals already bought are spare.
  #
  # Stranding, from the same chart: 18 is 19/30, 16 is 19/29, 14 is 19/27. The
  # STRAND COUNT IS 19 FOR ALL THREE, so counting strands cannot identify a
  # gauge on this wire - it is the strand diameter that changes. Caliper the
  # stripped conductor bundle instead: 18 = 1.02mm, 16 = 1.29mm, 14 = 1.63mm.
  # TXL covers 24 to 8 AWG, so every gauge above EXCEPT 6 is available in it.
  #
  # ⚠️ 6 AWG IS NOT TXL AND CANNOT BE. TXL runs roughly 24 to 8 AWG; 6 is
  # outside the range. The three heavy cables - W_BAT_SOL, W_SOL_SM and
  # W_BAT_GND - are battery/starter cable, a different product with a
  # different insulation and a much larger OD. NOT SPECIFIED YET, and it
  # does not inherit the seal or terminal decisions above: none of it
  # enters the PDM, and all three terminate in lugs rather than 280s.
  # Lug holes are M6 at the relay studs and the starter motor terminal
  # [bench 11 Sep 2026]; the battery-post and star-bus ends are still open.
  # Bought long and cut to fit on the bike - no cut lengths.
  w6:  &w6  {gauge: 6 AWG,  type: Battery cable - SPEC TBD}
  w12: &w12 {gauge: 12 AWG, type: TXL, supplier: Prowire}
  w14: &w14 {gauge: 14 AWG, type: TXL, supplier: Prowire}
  w16: &w16 {gauge: 16 AWG, type: TXL, supplier: Prowire}
  w18: &w18 {gauge: 18 AWG, type: TXL, supplier: Prowire}

  # ---- ignition ----------------------------------------------------
  coil: &coil
    type: Ignition coil
    pinlabels: [PRI+, PRI-]
    notes: Primary 3.6-5.4 ohm, secondary 11-17 kohm [scan, printed 161].

  points: &points
    type: Contact breaker
    pinlabels: [SIGNAL]
    notes: Leads carry a factory braided jacket - do NOT strip it. Colours from the stamped plate [bench 15 Aug 2026].

  capacitor: &capacitor
    type: Capacitor
    subtype: 0.24 +/- 0.02 uF, 1000 W VDC
    pinlabels: [SIGNAL, GND]
    notes: Parallel across the points.

  plug: &plug
    type: Spark plug
    pinlabels: [HT]

  # ---- charging / starting -----------------------------------------
  alternator: &alternator
    type: Alternator
    subtype: single-phase, 2 bullet
    pinlabels: [PHASE A, PHASE B]
    notes: Single-phase, 0.4 ohm across the pair against a spec of 0.36-0.54 [meter 18 Aug 2026]. Each lead must read infinity to ground. About 75V AC at 4000 rpm.

  regrec: &regrec
    type: Regulator / rectifier
    subtype: combined, shunt type
    notes: Shunt type - it dumps surplus as heat, so LED load reduction makes it run HOTTER. Check 14.0-14.5V at 3-5k AND check body temperature. Never disconnect with the ignition on.

  battery: &battery
    type: Battery
    subtype: 12V 10Ah
    pinlabels: [POS, NEG]

  starter_relay: &starter_relay
    type: Starter relay
    pinlabels: [BAT STUD, MOTOR STUD, COIL+, COIL-]
    notes: |-
      Green corrosion on both studs on the original - replace.
      BOTH STUDS ARE M6 [bench 11 Sep 2026] - the 6 AWG lugs at BAT STUD and MOTOR STUD are M6 rings.
      ** NOTHING ON THIS PART REACHES EARTH. ** The assembly has exactly TWO small leads, Y/R ending
      in a FEMALE bullet and BK in a MALE bullet. Neither is a ring, an eyelet, or anything that
      lands on the engine or frame [bench 2 Sep 2026]. The harness side does not supply one either -
      B06.2 is Black Net 2, 0.2 ohm to the start button and OPEN to the ground net [meter 28 Aug].
      THE COIL LEADS MATE B06.1 AND B06.2 BY GENDER COMPLEMENT - B06.1 is a MALE Y/R and B06.2 a
      FEMALE BK, exactly opposite to the relay's pair, on the branch that serves this assembly. That
      identifies Y/R Net 2 as the coil feed. [arith 2 Sep 2026]
      COIL METERED 3.2 ohm Y/R to BK, ~3.75 A at 12 V. BOTH LEADS OPEN to both studs and to the case,
      and the case sits in a RUBBER vibration mount [meter 11 Sep 2026]. The coil floats; there is no
      ground at this part and W_SOL_GND does not exist. Called at the bench: Y/R = COIL+, BK = COIL-.
      The diode (#46) follows the ELECTRICAL polarity, which turns on where Y/R Net 2's far end is -
      see measurements/starter-relay.md.
      ⚠️ WHERE THE COIL'S RETURN GOES IS NOT KNOWN, and which lead is which is not known. Ground-side
      switching would fit the metered Push = Y/R to BK, but Y/R Net 2 is OPEN to the bar's Y/R, so
      they are not one wire and the loop does not close on present evidence. Needs the meter. Do not
      redraw the circuit until it does. [OPEN]

  starter_motor: &starter_motor
    type: Starter motor
    pinlabels: [POS]
    notes: Grounds through the case. POS terminal is M6 [bench 11 Sep 2026] - W_SOL_SM lands on an M6 ring.

  # ---- switches ----------------------------------------------------
  ign_switch: &ign_switch
    type: Ignition switch
    subtype: 4-pin
    pinlabels: [BATT (W), TAIL2 (R), IGN (Br), TAIL1 (R/Bl)]
    notes: |-
      All six pin pairs read in all four positions [meter 15 Aug 2026]. ON = W-Br and R_Bl-R.
      PARK = W-R only. OFF and LOCK fully open. Contact 0.1 ohm, healthy. PRESERVE PARK FUNCTION.
      ⚠️ WAYS ARE PHYSICAL CAVITIES - mating face, keyway up, left to right, top row first:
      1 W, 2 R, 3 Br, 4 R/Bl. NOT the printed table's column order. [bench 29 Aug 2026]
      TAIL1 IS R/Bl, red base with a BLUE tracer - both halves of B00.3 read at the bench, the
      switch's own pigtail independently of the harness wire [bench 29 Aug 2026]. R/BK is a real
      colour on this bike (the dimmer beam outputs), which is why the printed table's R/BK was never
      an obvious slip.
      This connector IS the ignition switch by elimination - 4 ways carrying W R Br R/Bl, mirror
      4-of-4, and no other 4-way in the harness carries that set [arith 29 Aug 2026].
      The BATT white is visibly heavier than the harness's common wire - eyeball only. [OPEN]

  rh_cluster: &rh_cluster
    type: Right bar cluster
    subtype: stop switch + starter button
    notes: |-
      RUN = Br-Y_R, Push = Y_R-BK, interlock holds [meter 15 Aug 2026].
      ⚠️ CONTACTS DEGRADED - button 5 ohm, kill 3 ohm, 8 ohm in series. A relay will NOT pull in
      through 8 ohm.
      ** CLEANING IS A PLANNED BUILD STEP AND THE RELAY SCHEME DEPENDS ON IT. ** All five rebuild
      relays are driven through these contacts, so cleaning is not an alternative to relaying - it is
      what makes relaying work. ACCEPTANCE, REL-zeroed on the 87V: under 1 ohm per contact, the
      procedure's damaged-conductor threshold. The benchmark is in hand - the ignition switch
      measured 0.1 ohm. Re-measure after cleaning and record the value; a contact that will not come
      under 1 ohm needs replacing, not more cleaning.

  lh_cluster: &lh_cluster
    type: Left bar cluster
    subtype: dimmer + turn signal + horn
    notes: |-
      DIMMER - Bl is the common (the only pin present in both positions), R/BK is HI, R/Y is LO
      [meter 28 Aug 2026, cluster unplugged]. Corroborated independently from the harness side -
      Blue Net 2 runs the fuse box's HEAD output to this cluster.
      ⚠️ THE WIPER IS MAKE-BEFORE-BREAK. R_BK to R_Y is open in both settled positions but blips
      CLOSED while the switch moves, so both beam outputs are tied for the instant of the change.
      Harmless on filaments; a two-relay beam scheme must TOLERATE it rather than assume the outputs
      are exclusive.

  neutral_switch: &neutral_switch
    type: Neutral switch
    subtype: single conductor, case-grounding
    pinlabels: [SIGNAL]
    notes: One wire, grounds through the engine case. 4 ohm in neutral (3.6 lead-corrected), open in gear [meter 15 Aug 2026]. Indicator only, NOT a crank interlock. The 4 ohm is contamination, not spec - it was 40 ohm before cleaning.

  brake_switch: &brake_switch
    type: Brake light switch
    pinlabels: [IN, OUT]

  # ---- lamps -------------------------------------------------------
  headlight: &headlight
    type: Headlight
    subtype: 12V 50/35W sealed beam
    pinlabels: [HI, LO, GND]

  taillight: &taillight
    type: Tail / brake light
    subtype: 12V 8/27W
    pinlabels: [TAIL, BRAKE, GND]

  signal_lamp: &signal_lamp
    type: Turn signal
    subtype: 12V 23W
    pinlabels: [FEED, GND]

  license_lamp: &license_lamp
    type: License plate light
    subtype: 12V 8W
    pinlabels: [FEED, GND]

  indicator: &indicator
    type: Indicator lamp
    subtype: 12V 3.4W
    pinlabels: [FEED, GND]
    notes: Six 3.4W lamps total about 20W. Removing them shifts that load onto the shunt regulator.

  # ---- distribution ------------------------------------------------
  main_fuse: &main_fuse
    type: Main fuse
    subtype: 20A
    pinlabels: [IN, OUT]

  fuse10: &fuse10
    type: Fuse
    subtype: 10A glass
    pinlabels: [IN, OUT]

  junction6p: &junction6p
    type: Junction
    subtype: 6P connector
