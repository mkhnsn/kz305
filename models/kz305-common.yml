# =====================================================================
# KZ305-B1 — shared definitions
#
# Prepended to BOTH models. Nothing here describes topology; this file
# holds only things true of the parts themselves, plus bench-confirmed
# measurements that must never drift between the two drawings.
#
#   wireviz -p kz305-common.yml kz305-factory.yml   # as-built reference
#   wireviz -p kz305-common.yml kz305-rebuild.yml   # the rebuild
#
# The "templates" key is ignored by WireViz; it exists to anchor values.
#
# Kawasaki -> WireViz color codes:
#   W=WH  Br=BN  R=RD  BK=BK  Y=YE  Bl=BU  Gy=GY  O=OG  G=GN
#   Y/R=YERD  Y/BK=YEBK  R/BK=RDBK  R/Y=RDYE  Br/W=BNWH  Bl/W=BUWH
#   R/Bl=RDBU
#
# !! Y/BK AND BK/Y ARE BOTH IN THIS HARNESS - RESOLVED 28 Aug 2026
#
#    Settled at the bench with the wires in hand, and the fortnight-old
#    "dispute" turned out to be a false premise: the 13 Aug note and the
#    17 Aug read were looking at two different wires.
#
#      Y/BK = YEBK  yellow base, black tracer  -> ground Net A
#      BK/Y = BKYE  black base, yellow tracer  -> ground Net B
#
#    They are DIFFERENT NETS, measured open to each other. Net A reaches
#    the single chassis ring terminal; Net B does not reach it at all.
#    See the GND_CHASSIS / GND_NETB notes on the backbone sheet, and
#    measurements/README.md.
#
#    Base colour is written FIRST, always. Bench convention 28 Aug 2026.
#    Br/W is not W/Br; Y/BK is not BK/Y. Records written before that date
#    that do not state the base colour are ambiguous and cannot be
#    repaired by inference - re-read the wire.
#
# !! NEVER PUT A BARE > OR < IN A notes: BODY. WireViz renders notes into
#    a graphviz HTML-like label, where those characters open and close
#    tags, so "raised 14 -> 12 AWG" fails the build with an opaque
#    "syntax error ... near 'AWG'" pointing at generated dot, not at the
#    YAML. Write "from 14 to 12" instead. Cost an hour on 1 Sep 2026.
#
# !! WireViz has no light-green code, so Kawasaki LG and G BOTH render as
#    GN. Any LG lead is tagged in its notes. Do not read green off the
#    drawing and assume it is G.
#
# Two-color leads are primary-then-secondary. Y/R and R/Y are DIFFERENT
# wires; so are Br/W and W/Br. Base manual, printed 33, item 18.
#
# !! COLOR COLLISION - never identify a lead by color alone. The ring-out
#    of 28 Aug 2026 turned this from a warning into a measurement: THREE of
#    the eight colours rung carry more than one circuit.
#
#      BK  = right points lead, starter trigger, chassis grounds, horn
#            button return. Two of those four are now CONFIRMED as separate
#            nets by continuity - horn button return (left bar to horn) and
#            starter trigger (right bar to relay), open to each other.
#      YE  = left points lead, alternator phases. Separated by continuity
#            28 Aug 2026, NOT by gauge - both look the same on the bench.
#      Y/R = kill switch output / coil feed (modelled, SP_YR) AND a SECOND,
#            independent Y/R net on the fuse-box and starter-relay branch
#            that is open to it and is MISSING FROM THESE MODELS entirely.
#      Bl  = brake lamp feed AND the fused headlight supply to the dimmer.
#            Two nets, open to each other.
#
#    AND THE REVERSED PAIRS. These are not collisions but they are worse,
#    because they LOOK like the same wire written two ways. On this bike
#    both members of each pair physically exist:
#
#      W/R vs R/W - W/R (white base) is the main power path, B04.6 to
#            B06.4, and the R/R's DC output. R/W (RED base) is a
#            different circuit entirely: it feeds a SECOND, two-fuse
#            box off the starter-relay assembly. Confirmed at the bench
#            29 Aug 2026, both in hand.
#      Y/BK vs BK/Y - the two ground nets, open to each other.
#      Br/W vs W/Br, W/Bl vs Bl/W - the pairs that have cost this
#            project time twice each.
#
#    BASE COLOUR FIRST, ALWAYS, and say so.
#
#    Ring out to the endpoint before terminating. Identification by colour
#    alone is unsafe in this harness - including identifications made in
#    these models from the scan.
# =====================================================================

templates:

  # ---- wire gauges -------------------------------------------------
  # Gauge only. length_unit lives in the rebuild file, which is the one
  # that gets cut; the factory model carries no lengths at all so the
  # BOM cannot report a fabricated zero.
  w6:  &w6  {gauge: 6 AWG}
  w12: &w12 {gauge: 12 AWG}
  w14: &w14 {gauge: 14 AWG}
  w16: &w16 {gauge: 16 AWG}
  w18: &w18 {gauge: 18 AWG}

  # ---- ignition ----------------------------------------------------
  coil: &coil
    type: Ignition coil
    pinlabels: [PRI+, PRI-]
    notes: Primary 3.6-5.4 ohm, secondary 11-17 kohm. Printed 161.

  points: &points
    type: Contact breaker
    pinlabels: [SIGNAL]
    notes: Leads carry a factory braided jacket - do NOT strip it. Colors confirmed 15 Aug 2026 from the stamped plate.

  capacitor: &capacitor
    type: Capacitor
    subtype: 0.24 +/- 0.02 uF, 1000 W VDC
    pinlabels: [SIGNAL, GND]
    notes: Parallel across the points.

  plug: &plug
    type: Spark plug
    pinlabels: [HT]

  # ---- charging / starting -----------------------------------------
  alternator: &alternator
    type: Alternator
    subtype: single-phase, 2 bullet
    pinlabels: [PHASE A, PHASE B]
    notes: Single-phase CONFIRMED on the bench. 0.4 ohm across the pair (spec 0.36-0.54, printed 159). Each lead must read infinity to ground. About 75V AC at 4000 rpm.

  regrec: &regrec
    type: Regulator / rectifier
    subtype: combined, shunt type
    notes: Shunt type - it dumps surplus as heat, so LED load reduction makes it run HOTTER. Check 14.0-14.5V at 3-5k AND check body temperature. Never disconnect with the ignition on.

  battery: &battery
    type: Battery
    subtype: 12V 10Ah
    pinlabels: [POS, NEG]

  starter_relay: &starter_relay
    type: Starter relay
    pinlabels: [BAT STUD, MOTOR STUD, COIL+, COIL-]
    notes: Green corrosion on both studs on the original - replace. COIL+ is fed BK from the starter button. COIL- grounds directly, CONFIRMED 15 Aug 2026.

  starter_motor: &starter_motor
    type: Starter motor
    pinlabels: [POS]
    notes: Grounds through the case.

  # ---- switches ----------------------------------------------------
  ign_switch: &ign_switch
    type: Ignition switch
    subtype: 4-pin
    pinlabels: [BATT (W), TAIL2 (R), IGN (Br), TAIL1 (R/Bl)]
    notes: |-
      METER-CONFIRMED 15 Aug 2026, all six pin pairs in all four positions. ON = W-Br and R_Bl-R.
      PARK = W-R only. OFF and LOCK fully open. Contact 0.1 ohm, healthy. Preserve park function.
      ** WAYS RENUMBERED TO PHYSICAL CAVITIES 29 Aug 2026 ** - mating face, keyway up, left to right,
      top row first: 1 W, 2 R, 3 Br, 4 R/Bl. They were previously listed in the printed table's
      column order, which is not the connector's. Both models were swept for pin references.
      ** TAIL1 IS R/Bl, NOT R/BK - CORRECTED 29 Aug 2026. ** The printed table gives R/BK and the
      600 dpi scan cannot separate the two. BOTH HALVES of B00.3 were read at the bench and both are
      RED base with a BLUE tracer - the switch's own pigtail independently of the harness wire. Two
      physical reads against one scan. R/BK is a real colour on this bike (the dimmer beam outputs),
      which is why this was never an obvious slip.
      CONNECTOR CONFIRMED as this switch 29 Aug 2026: 4 ways, W R Br R/Bl, 4-of-4 on the mirror, and
      no other 4-way in the harness carries that set. Identified by elimination, not resemblance.
      The BATT white is visibly heavier than the harness's common wire - eyeball only, see the
      gauge caveat.

  rh_cluster: &rh_cluster
    type: Right bar cluster
    subtype: stop switch + starter button
    notes: |-
      METER-CONFIRMED 15 Aug 2026 - RUN = Br-Y_R, Push = Y_R-BK, interlock holds. WARNING contacts
      degraded - button 5 ohm, kill 3 ohm, 8 ohm series. The relay will NOT pull in through 8 ohm.
      ** CLEANING IS A PLANNED BUILD STEP, CONFIRMED 1 Sep 2026, AND THE RELAY SCHEME DEPENDS ON IT. **
      All five rebuild relays are driven through these contacts, so cleaning is not an alternative to
      relaying - it is what makes relaying work. ACCEPTANCE, REL-zeroed on the 87V: under 1 ohm per
      contact, the procedure's damaged-conductor threshold. The benchmark for what good looks like is
      in hand - the ignition switch measured 0.1 ohm and this project called it healthy. Re-measure
      after cleaning and record the value; a contact that will not come under 1 ohm needs replacing,
      not more cleaning.

  lh_cluster: &lh_cluster
    type: Left bar cluster
    subtype: dimmer + turn signal + horn
    notes: DIMMER METER-CONFIRMED 28 Aug 2026, cluster unplugged - Bl is the common (the only pin present in both positions), R/BK is HI, R/Y is LO. Closes procedure item 5.6, open since 13 Aug. Corroborated independently the same day from the harness side - Blue Net 2 runs the fuse box's HEAD output to this cluster. WIPER IS MAKE-BEFORE-BREAK - R_BK to R_Y is open in both settled positions but blips closed while the switch moves, so both beam outputs are tied for the instant of the change. Harmless on filaments; a two-relay beam scheme must tolerate it rather than assume the outputs are exclusive.

  neutral_switch: &neutral_switch
    type: Neutral switch
    subtype: single conductor, case-grounding
    pinlabels: [SIGNAL]
    notes: CONFIRMED 15 Aug 2026 - one wire, grounds through the engine case. 4 ohm in neutral (3.6 lead-corrected), open in gear. Indicator only, NOT a crank interlock. The 4 ohm is contamination, not spec - was 40 ohm before cleaning.

  brake_switch: &brake_switch
    type: Brake light switch
    pinlabels: [IN, OUT]

  # ---- lamps -------------------------------------------------------
  headlight: &headlight
    type: Headlight
    subtype: 12V 50/35W sealed beam
    pinlabels: [HI, LO, GND]

  taillight: &taillight
    type: Tail / brake light
    subtype: 12V 8/27W
    pinlabels: [TAIL, BRAKE, GND]

  signal_lamp: &signal_lamp
    type: Turn signal
    subtype: 12V 23W
    pinlabels: [FEED, GND]

  license_lamp: &license_lamp
    type: License plate light
    subtype: 12V 8W
    pinlabels: [FEED, GND]

  indicator: &indicator
    type: Indicator lamp
    subtype: 12V 3.4W
    pinlabels: [FEED, GND]
    notes: Six 3.4W lamps total about 20W. Removing them shifts that load onto the shunt regulator.

  # ---- distribution ------------------------------------------------
  main_fuse: &main_fuse
    type: Main fuse
    subtype: 20A
    pinlabels: [IN, OUT]

  fuse10: &fuse10
    type: Fuse
    subtype: 10A glass
    pinlabels: [IN, OUT]

  junction6p: &junction6p
    type: Junction
    subtype: 6P connector
